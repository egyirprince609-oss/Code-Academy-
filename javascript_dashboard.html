<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JavaScript Course Dashboard</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
}

/* =========================
NAVBAR
========================= */

.navbar{
display:flex;
align-items:center;
justify-content:space-between;
padding:15px 20px;
background:#0f172a;
border-bottom:1px solid #1e293b;
position:sticky;
top:0;
}

/* BACK BUTTON (ANIMATED + MODERN) */
.backBtn{
background:linear-gradient(135deg,#facc15,#f97316);
border:none;
color:#111827;
padding:10px 14px;
border-radius:12px;
cursor:pointer;
font-weight:bold;
display:flex;
align-items:center;
gap:8px;
transition:0.3s;
box-shadow:0 0 12px rgba(250,204,21,0.4);
}

.backBtn:hover{
transform:translateX(-6px);
box-shadow:0 0 18px rgba(250,204,21,0.7);
}

/* TITLE */
.title{
font-size:16px;
color:#facc15;
font-weight:bold;
}

/* XP BOX */
.xpBox{
background:#1e293b;
padding:8px 12px;
border-radius:10px;
font-size:13px;
}

/* =========================
CONTAINER
========================= */

.container{
padding:20px;
max-width:1100px;
margin:auto;
}

h2{
color:#facc15;
margin-top:20px;
}

/* =========================
GRID
========================= */

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
margin-top:20px;
}

/* =========================
CARD
========================= */

.card{
background:#111827;
padding:15px;
border-radius:15px;
border:1px solid #1f2937;
cursor:pointer;
transition:0.3s;
position:relative;
}

.card:hover{
transform:translateY(-5px);
border-color:#facc15;
box-shadow:0 0 15px rgba(250,204,21,0.2);
}

.card h3{
margin:0;
color:#facc15;
}

.card p{
font-size:13px;
color:#94a3b8;
margin-top:8px;
}

.badge{
position:absolute;
top:10px;
right:10px;
padding:5px 10px;
font-size:11px;
border-radius:20px;
background:#22c55e;
}

.locked .badge{
background:#ef4444;
}

.locked{
opacity:0.5;
cursor:not-allowed;
}

/* BACK ICON */
.backIcon{
font-size:18px;
}

</style>
</head>

<body>

<!-- =========================
NAVBAR
========================= -->

<div class="navbar">

<button class="backBtn" onclick="goBack()">
<span class="backIcon">⬅</span> Back
</button>

<div class="title">JavaScript Course</div>

<div class="xpBox" id="xpBox">XP: 0</div>

</div>

<!-- =========================
CONTENT
========================= -->

<div class="container">

<h2>JavaScript Mastery Path (15 Lessons)</h2>

<div class="grid" id="lessonGrid"></div>

</div>

<script>

/* =========================
BACK BUTTON
========================= */

function goBack(){
window.history.back();
}

/* =========================
USER DATA
========================= */

let user = JSON.parse(localStorage.getItem("js_user")) || {
xp:0,
completed:[]
};

function saveUser(){
localStorage.setItem("js_user", JSON.stringify(user));
}

document.getElementById("xpBox").textContent = "XP: " + user.xp;

/* =========================
LESSONS (JAVASCRIPT PATH)
========================= */

const lessons = [
{
id:"js_lesson_1",
title:"Introduction to JavaScript",
desc:"Understand what JavaScript is and how it brings life to websites."
},
{
id:"js_lesson_2",
title:"Variables & Data Types",
desc:"Learn let, const, var and data types."
},
{
id:"js_lesson_3",
title:"Functions",
desc:"Reusable logic blocks for programs."
},
{
id:"js_lesson_4",
title:"Conditionals",
desc:"If, else, switch logic control."
},
{
id:"js_lesson_5",
title:"Loops",
desc:"For, while loops for repetition."
},
{
id:"js_lesson_6",
title:"Arrays",
desc:"Store multiple values in one variable."
},
{
id:"js_lesson_7",
title:"Objects",
desc:"Structure real-world data."
},
{
id:"js_lesson_8",
title:"DOM Manipulation",
desc:"Control HTML using JavaScript."
},
{
id:"js_lesson_9",
title:"Events",
desc:"Click, input, keyboard interactions."
},
{
id:"js_lesson_10",
title:"Forms Handling",
desc:"Capture user input dynamically."
},
{
id:"js_lesson_11",
title:"LocalStorage",
desc:"Save data in browser."
},
{
id:"js_lesson_12",
title:"APIs",
desc:"Connect to external data sources."
},
{
id:"js_lesson_13",
title:"Async JavaScript",
desc:"Promises, async/await."
},
{
id:"js_lesson_14",
title:"Mini Projects",
desc:"Build interactive applications."
},
{
id:"js_lesson_15",
title:"Final JavaScript Project",
desc:"Build a full interactive app system."
}
];

/* =========================
UNLOCK SYSTEM
========================= */

function isUnlocked(index){

if(index === 0) return true;

return user.completed.includes(lessons[index-1].id);
}

/* =========================
RENDER
========================= */

const grid = document.getElementById("lessonGrid");

function render(){

grid.innerHTML = "";

lessons.forEach((lesson,index)=>{

const unlocked = isUnlocked(index);

const card = document.createElement("div");

card.className = "card " + (!unlocked ? "locked" : "");

card.innerHTML = `
<h3>${lesson.title}</h3>
<p>${lesson.desc}</p>
<div class="badge">${unlocked ? "OPEN" : "LOCKED"}</div>
`;

if(unlocked){
card.onclick = () => {
window.location.href = `js_lesson.html?lesson=${lesson.id}`;
};
}

grid.appendChild(card);

});

}

render();

</script>

</body>
</html>
