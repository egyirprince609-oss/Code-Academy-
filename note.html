<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Notes - Code Academy</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg1:#020617;
  --bg2:#0f172a;
  --card:#1e293b;
  --primary:#38bdf8;
  --primary-glow:rgba(56,189,248,0.4);
  --text:#f8fafc;
  --text-dim:#94a3b8;
  --border:rgba(56,189,248,0.12);
  --success:#22c55e;
  --warning:#facc15;
  --danger:#ef4444;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{
  background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 100%);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}

/* Animated gradient blobs */
body::before, body::after{
  content:'';
  position:fixed;
  width:600px;
  height:600px;
  border-radius:50%;
  filter:blur(120px);
  z-index:-1;
  animation:float 25s ease-in-out infinite;
}
body::before{
  background:radial-gradient(circle, rgba(56,189,248,0.15), transparent 70%);
  top:-200px;
  left:-200px;
}
body::after{
  background:radial-gradient(circle, rgba(168,85,247,0.12), transparent 70%);
  bottom:-200px;
  right:-200px;
  animation-delay:12s;
}
@keyframes float{
  0%,100%{transform:translate(0,0) scale(1);}
  50%{transform:translate(40px,40px) scale(1.1);}
}

/* NAVBAR */
.navbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background:rgba(15,23,42,0.7);
  backdrop-filter:blur(20px);
  border-bottom-left-radius:24px;
  border-bottom-right-radius:24px;
  box-shadow:0 8px 32px rgba(0,0,0,0.4);
  z-index:200;
  border-bottom:1px solid var(--border);
}

.navLeft{display:flex;gap:12px;}
.navCenter{text-align:center;}
.navCenter h1{font-size:20px;font-weight:800;}
.navCenter p{font-size:12px;color:var(--text-dim);}
.navRight{display:flex;gap:10px;}

.navBtn{
  width:44px;
  height:44px;
  border-radius:14px;
  background:rgba(30,41,59,0.6);
  border:1px solid var(--border);
  color:var(--primary);
  font-size:18px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all 0.3s;
}
.navBtn:hover{
  background:var(--primary);
  color:var(--bg1);
  transform:scale(1.08);
  box-shadow:0 8px 25px var(--primary-glow);
}

/* OVERLAY */
.overlay{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(4px);
  z-index:150;
  opacity:0;
  pointer-events:none;
  transition:0.3s;
}
.overlay.active{opacity:1;pointer-events:all;}

/* MENU PANEL */
.menuPanel{
  position:fixed;
  top:0;left:-85%;
  width:85%;
  max-width:400px;
  height:100%;
  background:rgba(15,23,42,0.95);
  backdrop-filter:blur(20px);
  border-right:1px solid var(--border);
  z-index:250;
  transition:left 0.3s cubic-bezier(0.4,0,0.2,1);
  display:flex;
  flex-direction:column;
}
.menuPanel.active{left:0;}

.menuHeader{
  padding:25px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--border);
}
.menuHeader h2{font-size:18px;font-weight:700;}
.menuHeader button{
  background:none;border:none;color:var(--text-dim);
  font-size:22px;cursor:pointer;
}

.notesList{
  flex:1;
  overflow-y:auto;
  padding:15px;
}

.emptyState{
  text-align:center;
  padding:80px 20px;
  color:var(--text-dim);
}
.emptyState i{font-size:60px;margin-bottom:15px;opacity:0.3;}

.noteCard{
  background:rgba(30,41,59,0.6);
  border:1px solid var(--border);
  border-radius:16px;
  padding:15px;
  margin-bottom:12px;
  cursor:pointer;
  transition:all 0.3s;
}
.noteCard:hover{
  border-color:var(--primary);
  transform:translateX(5px);
  box-shadow:0 8px 25px var(--primary-glow);
}
.noteTitle{font-weight:700;margin-bottom:5px;font-size:15px;}
.noteDate{font-size:12px;color:var(--text-dim);}
.noteIcons{float:right;font-size:14px;color:var(--warning);}

/* MAIN EDITOR */
.mainContent{
  padding-top:90px;
  padding-bottom:100px;
  max-width:900px;
  margin:0 auto;
}

.editorCard{
  background:rgba(30,41,59,0.6);
  backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-radius:24px;
  padding:30px;
  margin:0 20px;
  box-shadow:0 20px 60px rgba(0,0,0,0.3);
  animation:fadeIn 0.4s;
}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}

.titleInput{
  width:100%;
  font-size:20px;
  font-weight:300;
  background:transparent;
  border:none;
  outline:none;
  color:var(--text);
  margin-bottom:20px;
  padding-bottom:10px;
  border-bottom:2px solid var(--border);
}
.titleInput::placeholder{color:var(--text-dim);}

/* TOOLBAR */
.toolbar{
  display:flex;
  flex-direction: columns;
  gap:5px;
  padding:10px;
  background:rgba(15,23,42,0.8);
  border-radius:12px;
  margin-bottom:15px;
  overflow-x:auto;
  border:1px solid var(--border);
}
.toolbar button{
  min-width:30px;
  height:30px;
  border:none;
  border-radius:8px;
  background:transparent;
  color:var(--text-dim);
  cursor:pointer;
  font-size:14px;
  transition:all 0.2s;
}
.toolbar button:hover{
  background:rgba(56,189,248,0.15);
  color:var(--primary);
  transform:scale(1.15);
}
.toolbar button.active{
  background:var(--primary);
  color:var(--bg1);
}

/* EDITOR */
.editor{
  min-height:400px;
  outline:none;
  font-size:16px;
  line-height:1.8;
  color:var(--text);
  padding:10px;
}
.editor h1{font-size:28px;margin:20px 0 10px;font-weight:700;}
.editor h2{font-size:22px;margin:18px 0 8px;font-weight:600;}
.editor h3{font-size:18px;margin:15px 0 6px;font-weight:600;}
.editor p{margin:10px 0;}
.editor ul,.editor ol{margin-left:25px;margin:10px 0;}
.editor blockquote{
  border-left:4px solid var(--primary);
  padding-left:15px;
  margin:15px 0;
  color:var(--text-dim);
  font-style:italic;
}

/* CODE BLOCK */
.codeWrapper{
  position:relative;
  margin:15px 0;
  border-radius:12px;
  overflow:hidden;
  border:1px solid var(--border);
}
.codeHeader{
  background:#0d1117;
  padding:8px 15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  color:var(--text-dim);
  border-bottom:1px solid #30363d;
}
.codeHeader button{
  background:none;border:none;color:var(--primary);
  cursor:pointer;font-size:14px;
}
.codeBlock{
  background:#0d1117;
  color:#e6edf3;
  font-family:'JetBrains Mono',monospace;
  font-size:14px;
  padding:15px;
  overflow-x:auto;
  white-space:pre;
}

/* IMAGE */
.editor img{
  max-width:100%;
  border-radius:12px;
  margin:15px 0;
  cursor:pointer;
}

/* SAVE STATUS */
.saveStatus{
  position:fixed;
  top:85px;
  right:20px;
  padding:12px 20px;
  background:rgba(15,23,42,0.95);
  border:1px solid var(--border);
  border-radius:12px;
  font-size:13px;
  color:var(--success);
  opacity:0;
  transform:translateY(-20px);
  transition:all 0.3s;
  z-index:300;
}
.saveStatus.show{opacity:1;transform:translateY(0);}

/* SEARCH OVERLAY */
.searchOverlay{
  position:fixed;
  top:70px;
  left:50%;
  transform:translateX(-50%) scale(0.95);
  width:90%;
  max-width:500px;
  background:rgba(15,23,42,0.98);
  backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;
  z-index:300;
  opacity:0;
  pointer-events:none;
  transition:all 0.3s;
}
.searchOverlay.active{
  opacity:1;
  pointer-events:all;
  transform:translateX(-50%) scale(1);
}
.searchInput{
  width:100%;
  padding:15px;
  background:rgba(30,41,59,0.8);
  border:1px solid var(--border);
  border-radius:12px;
  color:var(--text);
  font-size:16px;
  outline:none;
}

@media(max-width:640px){
 .editorCard{padding:20px;margin:0 15px;}
 .titleInput{font-size:24px;}
 .menuPanel{width:90%;}
}
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="navLeft">
    <button class="navBtn" onclick="history.back()"><i class="fa fa-arrow-left"></i></button>
    <button class="navBtn" id="menuBtn"><i class="fa fa-bars"></i></button>
  </div>
  <div class="navCenter">
    <h1>My Notes</h1>
    <p>Save everything you learn</p>
  </div>
  <div class="navRight">
    <button class="navBtn" id="searchBtn"><i class="fa fa-search"></i></button>
    <button class="navBtn" id="saveBtn"><i class="fa fa-save"></i></button>
  </div>
</nav>

<!-- OVERLAY -->
<div class="overlay" id="overlay"></div>

<!-- MENU PANEL -->
<div class="menuPanel" id="menuPanel">
  <div class="menuHeader">
    <h2>Saved Notes</h2>
    <button id="closeMenu"><i class="fa fa-times"></i></button>
  </div>
  <div class="notesList" id="notesList">
    <div class="emptyState">
      <i class="fa fa-file-code"></i>
      <p>No saved notes yet.<br>Create your first programming note.</p>
    </div>
  </div>
</div>

<!-- SEARCH OVERLAY -->
<div class="searchOverlay" id="searchOverlay">
  <input type="text" class="searchInput" id="searchInput" placeholder="Search notes by title...">
  <div id="searchResults" style="margin-top:15px;"></div>
</div>

<!-- SAVE STATUS -->
<div class="saveStatus" id="saveStatus">All changes saved ✓</div>

<!-- MAIN EDITOR -->
<div class="mainContent">
  <div class="editorCard">
    <input type="text" class="titleInput" id="noteTitle" placeholder="Enter note title...">

    <!-- TOOLBAR -->
    <div class="toolbar">
      <button onclick="format('bold')" title="Bold"><i class="fa fa-bold"></i></button>
      <button onclick="format('italic')" title="Italic"><i class="fa fa-italic"></i></button>
      <button onclick="format('underline')" title="Underline"><i class="fa fa-underline"></i></button>
      <button onclick="format('hiliteColor','yellow')" title="Highlight"><i class="fa fa-highlighter"></i></button>
      <button onclick="format('formatBlock','h1')" title="H1">H1</button>
      <button onclick="format('formatBlock','h2')" title="H2">H2</button>
      <button onclick="format('formatBlock','h3')" title="H3">H3</button>
      <button onclick="format('insertUnorderedList')" title="Bullet"><i class="fa fa-list-ul"></i></button>
      <button onclick="format('insertOrderedList')" title="Numbered"><i class="fa fa-list-ol"></i></button>
      <button onclick="insertCodeBlock()" title="Code"><i class="fa fa-code"></i></button>
      <button onclick="format('formatBlock','blockquote')" title="Quote"><i class="fa fa-quote-left"></i></button>
      <button onclick="format('undo')" title="Undo"><i class="fa fa-undo"></i></button>
      <button onclick="format('redo')" title="Redo"><i class="fa fa-redo"></i></button>
      <button onclick="insertImage()" title="Image"><i class="fa fa-image"></i></button>
    </div>

    <!-- EDITOR -->
    <div class="editor" id="editor" contenteditable="true"></div>
    <input type="file" id="imageInput" accept="image/*" style="display:none">
    
  </div>
  
</div>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// ========== FIREBASE CONFIG ==========
const firebaseConfig = {
    apiKey: "AIzaSyDDHzPkR4jIMz6fcK7M_hdjQk2u6xk-efI",
  authDomain: "code-acada.firebaseapp.com",
  databaseURL: "https://code-acada-default-rtdb.firebaseio.com",
  projectId: "code-acada",
  storageBucket: "code-acada.appspot.com", // FIXED: was.firebasestorage.app
  messagingSenderId: "155763239454",
  appId: "1:155763239454:web:7fc20b0037dcd8e5621c0f",
  measurementId: "G-ZCV1ELNR0K"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let currentNoteId = null;
let notes = [];

// Elements
const menuBtn = document.getElementById('menuBtn');
const menuPanel = document.getElementById('menuPanel');
const overlay = document.getElementById('overlay');
const closeMenu = document.getElementById('closeMenu');
const saveBtn = document.getElementById('saveBtn');
const searchBtn = document.getElementById('searchBtn');
const searchOverlay = document.getElementById('searchOverlay');
const noteTitle = document.getElementById('noteTitle');
const editor = document.getElementById('editor');
const notesList = document.getElementById('notesList');
const saveStatus = document.getElementById('saveStatus');

// ========== AUTH ==========
onAuthStateChanged(auth, async (user) => {
  if(user){
    currentUser = user;
    loadNotes();
  } else {
    window.location.href = 'login.html';
  }
});

// ========== MENU PANEL ==========
menuBtn.onclick = () => {
  menuPanel.classList.add('active');
  overlay.classList.add('active');
}
closeMenu.onclick = hideMenu;
overlay.onclick = hideMenu;
function hideMenu(){
  menuPanel.classList.remove('active');
  overlay.classList.remove('active');
  searchOverlay.classList.remove('active');
}

// ========== FORMATTING ==========
window.format = (cmd, val=null) => {
  document.execCommand(cmd, false, val);
  editor.focus();
}

// ========== CODE BLOCK ==========
window.insertCodeBlock = () => {
  const lang = prompt('Language? html/css/js/python', 'javascript');
  const code = prompt('Paste your code:');
  if(code){
    const wrapper = document.createElement('div');
    wrapper.className = 'codeWrapper';
    wrapper.innerHTML = `
      <div class="codeHeader">
        <span>${lang.toUpperCase()}</span>
        <button onclick="copyCode(this)"><i class="fa fa-copy"></i></button>
      </div>
      <div class="codeBlock">${code}</div>
    `;
    editor.appendChild(wrapper);
  }
}

window.copyCode = (btn) => {
  const code = btn.parentElement.nextElementSibling.textContent;
  navigator.clipboard.writeText(code);
  btn.innerHTML = '<i class="fa fa-check"></i>';
  setTimeout(() => btn.innerHTML = '<i class="fa fa-copy"></i>', 2000);
}

// ========== IMAGE ==========
window.insertImage = () => {
  document.getElementById('imageInput').click();
}
document.getElementById('imageInput').onchange = (e) => {
  const file = e.target.files[0];
  if(file){
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = document.createElement('img');
      img.src = ev.target.result;
      img.onclick = () => window.open(img.src, '_blank');
      editor.appendChild(img);
    }
    reader.readAsDataURL(file);
  }
}

// ========== SAVE NOTE ==========
saveBtn.onclick = saveNote;

async function saveNote(){
  if(!currentUser) return;

  saveBtn.innerHTML = '<i class="fa fa-spinner fa-spin"></i>';

  const noteData = {
    title: noteTitle.value || 'Untitled Note',
    content: editor.innerHTML,
    updatedAt: serverTimestamp()
  };

  try{
    if(currentNoteId){
      await updateDoc(doc(db, 'users', currentUser.uid, 'notes', currentNoteId), noteData);
    } else {
      noteData.createdAt = serverTimestamp();
      const docRef = await addDoc(collection(db, 'users', currentUser.uid, 'notes'), noteData);
      currentNoteId = docRef.id;
    }

    showSaveStatus();
    loadNotes();
    saveBtn.innerHTML = '<i class="fa fa-save"></i>';
  } catch(error){
    alert('Error saving: ' + error.message);
    saveBtn.innerHTML = '<i class="fa fa-save"></i>';
  }
}

function showSaveStatus(){
  saveStatus.classList.add('show');
  setTimeout(() => saveStatus.classList.remove('show'), 2000);
}

// ========== LOAD NOTES ==========
async function loadNotes(){
  if(!currentUser) return;

  const q = query(collection(db, 'users', currentUser.uid, 'notes'), orderBy('updatedAt', 'desc'));
  const snap = await getDocs(q);
  notes = [];

  notesList.innerHTML = '';

  if(snap.empty){
    notesList.innerHTML = `
      <div class="emptyState">
        <i class="fa fa-file-code"></i>
        <p>No saved notes yet.<br>Create your first programming note.</p>
      </div>
    `;
    return;
  }

  snap.forEach(doc => {
    const data = doc.data();
    notes.push({id: doc.id,...data});

    const card = document.createElement('div');
    card.className = 'noteCard';
    card.onclick = () => loadNote(doc.id);

    const date = data.updatedAt?.toDate().toLocaleDateString() || 'Just now';

    card.innerHTML = `
      <div class="noteIcons"><i class="fa fa-star"></i></div>
      <div class="noteTitle">${data.title}</div>
      <div class="noteDate">Edited ${date}</div>
    `;
    notesList.appendChild(card);
  });
}

function loadNote(id){
  const note = notes.find(n => n.id === id);
  if(note){
    currentNoteId = id;
    noteTitle.value = note.title;
    editor.innerHTML = note.content;
    hideMenu();
    editor.focus();
  }
}

// ========== SEARCH ==========
searchBtn.onclick = () => {
  searchOverlay.classList.toggle('active');
  document.getElementById('searchInput').focus();
}

document.getElementById('searchInput').oninput = (e) => {
  const term = e.target.value.toLowerCase();
  const results = notes.filter(n => n.title.toLowerCase().includes(term));

  const resultsDiv = document.getElementById('searchResults');
  resultsDiv.innerHTML = results.map(n =>
    `<div class="noteCard" onclick="loadNote('${n.id}')">${n.title}</div>`
  ).join('');
}

// Auto-save every 10 seconds
setInterval(() => {
  if(noteTitle.value || editor.textContent.trim()){
    saveNote();
  }
}, 10000);
</script>
</body>
</html>
