<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Progress - Code Academy</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
  --bg:#020617;
  --card:#0f172a;
  --card-hover:#1e293b;
  --primary:#38bdf8;
  --primary-glow:rgba(56,189,248,0.4);
  --text:#f1f5f9;
  --text-dim:#94a3b8;
  --border:rgba(56,189,248,0.15);
  --success:#22c55e;
  --warning:#facc15;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',sans-serif;}

body{
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding-bottom:100px;
  overflow-x:hidden;
}

/* Animated gradient background */
body::before{
  content:'';
  position:fixed;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:radial-gradient(circle at 30% 20%, rgba(56,189,248,0.12) 0%, transparent 50%),
             radial-gradient(circle at 80% 80%, rgba(168,85,247,0.08) 0%, transparent 50%);
  z-index:-2;
  animation:float 20s ease-in-out infinite;
}
@keyframes float{
 0%,100%{transform:translate(0,0) rotate(0deg);}
  50%{transform:translate(30px,30px) rotate(5deg);}
}

/* NAVBAR */
.navbar{
  position:sticky;
  top:0;
  width:100%;
  height:75px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 20px;
  background:rgba(15,23,42,0.8);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  z-index:100;
}

.navBrand{
  display:flex;
  align-items:center;
  gap:12px;
}
.navBrand h2{
  font-size:20px;
  background:linear-gradient(135deg,var(--primary),#0ea5e9);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  font-weight:800;
}

.backBtn{
  width:44px;
  height:44px;
  border-radius:14px;
  background:rgba(30,41,59,0.6);
  border:1px solid var(--border);
  color:var(--primary);
  font-size:18px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all 0.3s;
}
.backBtn:hover{
  background:var(--primary);
  color:var(--bg);
  transform:translateX(-4px);
  box-shadow:0 8px 25px var(--primary-glow);
}

/* CONTAINER */
.container{
  max-width:700px;
  margin:30px auto;
  padding:0 20px;
}

/* GLASS CARD */
.glassCard{
  background:rgba(15,23,42,0.6);
  backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-radius:24px;
  padding:30px;
  margin-bottom:24px;
  box-shadow:0 20px 60px rgba(0,0,0,0.3);
  transition:all 0.4s;
}
.glassCard:hover{
  border-color:var(--primary);
  box-shadow:0 25px 70px rgba(56,189,248,0.15);
}

/* USER HEADER */
.userHeader{
  text-align:center;
  padding:20px 0;
}
.avatar{
  width:100px;
  height:100px;
  border-radius:50%;
  border:4px solid var(--primary);
  box-shadow:0 0 40px var(--primary-glow);
  margin-bottom:15px;
}
.userName{
  font-size:26px;
  font-weight:800;
  margin-bottom:5px;
  background:linear-gradient(135deg,var(--text),var(--primary));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.userEmail{
  font-size:13px;
  color:var(--text-dim);
}

/* XP SECTION */
.xpSection{
  margin-top:25px;
}
.xpHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}
.xpHeader h3{
  font-size:18px;
  font-weight:700;
}
.xpHeader span{
  font-size:14px;
  color:var(--text-dim);
}
.xpBar{
  height:14px;
  background:rgba(30,41,59,0.8);
  border-radius:14px;
  overflow:hidden;
  border:1px solid var(--border);
}
.xpFill{
  height:100%;
  background:linear-gradient(90deg,var(--primary),#0ea5e9);
  border-radius:14px;
  box-shadow:0 0 20px var(--primary-glow);
  transition:width 1s cubic-bezier(0.4,0,0.2,1);
}

/* STATS GRID */
.sectionHeader{
  font-size:20px;
  font-weight:800;
  margin:35px 0 20px;
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--primary);
}

.statsGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.statCard{
  background:rgba(15,23,42,0.6);
  backdrop-filter:blur(15px);
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px 15px;
  text-align:center;
  transition:all 0.3s;
}
.statCard:hover{
  transform:translateY(-8px);
  border-color:var(--primary);
  box-shadow:0 15px 40px var(--primary-glow);
}
.statCard i{
  font-size:24px;
  color:var(--primary);
  margin-bottom:10px;
}
.statCard h3{
  font-size:26px;
  font-weight:800;
  margin-bottom:5px;
}
.statCard p{
  font-size:12px;
  color:var(--text-dim);
  font-weight:600;
}

/* COURSE PROGRESS */
.courseCard{
  background:rgba(15,23,42,0.6);
  backdrop-filter:blur(15px);
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;
  margin-bottom:15px;
  transition:all 0.3s;
}
.courseCard:hover{
  border-color:var(--primary);
  transform:translateX(5px);
}

.courseTop{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:15px;
}
.courseIcon{
  width:50px;
  height:50px;
  padding:8px;
  background:rgba(56,189,248,0.1);
  border-radius:16px;
  border:1px solid var(--border);
}
.courseInfo{
  flex:1;
}
.courseInfo h4{
  font-size:16px;
  font-weight:700;
  margin-bottom:4px;
}
.courseInfo p{
  font-size:12px;
  color:var(--text-dim);
}

.progressWrapper{
  margin-top:12px;
}
.progressBar{
  height:10px;
  background:rgba(2,6,23,0.8);
  border-radius:10px;
  overflow:hidden;
  margin-bottom:8px;
}
.progressFill{
  height:100%;
  background:linear-gradient(90deg,var(--primary),#0ea5e9);
  border-radius:10px;
  transition:width 0.8s;
}
.progressText{
  font-size:11px;
  color:var(--text-dim);
  text-align:right;
  font-weight:700;
}

/* CERTIFICATES */
.certGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}
.certCard{
  background:linear-gradient(135deg,rgba(56,189,248,0.1),rgba(14,165,233,0.05));
  border:1px solid var(--primary);
  border-radius:18px;
  padding:20px;
  text-align:center;
  transition:all 0.3s;
}
.certCard:hover{
  transform:scale(1.05);
  box-shadow:0 15px 40px var(--primary-glow);
}
.certCard i{
  font-size:35px;
  color:var(--warning);
  margin-bottom:10px;
}
.certCard h4{
  font-size:14px;
  font-weight:700;
  margin-bottom:5px;
}
.certCard p{
  font-size:11px;
  color:var(--text-dim);
}

.loading{
  text-align:center;
  padding:100px 20px;
  color:var(--primary);
  font-size:16px;
}

@media(max-width:640px){
  .statsGrid{grid-template-columns:repeat(2,1fr);}
  .certGrid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <button class="backBtn" onclick="history.back()">
    <i class="fa fa-arrow-left"></i>
  </button>
  <div class="navBrand">
    <h2>Your Progress</h2>
  </div>
</nav>

<!-- CONTAINER -->
<div class="container">

  <!-- LOADING -->
  <div id="loading" class="loading">
    <i class="fa fa-spinner fa-spin"></i> Loading your progress...
  </div>

  <!-- CONTENT -->
  <div id="progressContent" style="display:none;">

    <!-- USER HEADER -->
    <div class="glassCard userHeader">
      <img id="userPhoto" src="" class="avatar" alt="User">
      <h1 id="userName" class="userName">Loading...</h1>
      <p id="userEmail" class="userEmail">loading...</p>

      <!-- XP SECTION -->
      <div class="xpSection">
        <div class="xpHeader">
          <h3><i class="fa fa-bolt"></i> Level <span id="userLevel">1</span> <span id="levelTitle">Beginner</span></h3>
          <span><b id="currentXP">0</b> / 100 XP</span>
        </div>
        <div class="xpBar">
          <div id="xpFill" class="xpFill" style="width:0%"></div>
        </div>
      </div>
    </div>

    <!-- OVERALL STATS -->
    <h2 class="sectionHeader"><i class="fa fa-chart-line"></i> Your Stats</h2>
    <div class="statsGrid">
      <div class="statCard">
        <i class="fa fa-fire"></i>
        <h3 id="streak">0</h3>
        <p>Day Streak</p>
      </div>
      <div class="statCard">
        <i class="fa fa-coins"></i>
        <h3 id="coins">0</h3>
        <p>Coins</p>
      </div>
      <div class="statCard">
        <i class="fa fa-award"></i>
        <h3 id="certCount">0</h3>
        <p>Certificates</p>
      </div>
      <div class="statCard">
        <i class="fa fa-check-circle"></i>
        <h3 id="lessonsDone">0</h3>
        <p>Lessons Done</p>
      </div>
    </div>

    <!-- COURSE PROGRESS -->
    <h2 class="sectionHeader"><i class="fa fa-graduation-cap"></i> Course Progress</h2>
    <div id="coursesProgress"></div>

    <!-- CERTIFICATES -->
    <h2 class="sectionHeader"><i class="fa fa-certificate"></i> Earned Certificates</h2>
    <div id="certificatesGrid" class="certGrid">
      <div style="grid-column:1/-1;text-align:center;color:var(--text-dim);padding:30px;">
        <i class="fa fa-lock"></i> Complete a course to earn your first certificate
      </div>
    </div>

  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// ============= FIREBASE CONFIG =============
const firebaseConfig = {
   apiKey: "AIzaSyDDHzPkR4jIMz6fcK7M_hdjQk2u6xk-efI",
  authDomain: "code-acada.firebaseapp.com",
  databaseURL: "https://code-acada-default-rtdb.firebaseio.com",
  projectId: "code-acada",
  storageBucket: "code-acada.appspot.com", // FIXED: was.firebasestorage.app
  messagingSenderId: "155763239454",
  appId: "1:155763239454:web:7fc20b0037dcd8e5621c0f",
  measurementId: "G-ZCV1ELNR0K"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loading = document.getElementById('loading');
const progressContent = document.getElementById('progressContent');

// Level system
function getLevel(xp){
  const level = Math.floor(xp / 100) + 1;
  const titles = ['Beginner','Learner','Coder','Developer','Expert','Master','Legend'];
  return {level, title: titles[Math.min(level-1, titles.length-1)]};
}

// Load progress
onAuthStateChanged(auth, async (user) => {
  if(user){
    try{
      const userRef = doc(db, "users", user.uid);
      const snap = await getDoc(userRef);
      
      if(snap.exists()){
        const data = snap.data();
        
        // User info
        document.getElementById('userPhoto').src = user.photoURL || 'https://i.pravatar.cc/150?u=' + user.uid;
        document.getElementById('userName').textContent = data.displayName || user.displayName || 'Coder';
        document.getElementById('userEmail').textContent = user.email;
        
        // XP & Level
        const xp = data.xp || 0;
        const coins = data.coins || 0;
        const {level, title} = getLevel(xp);
        const currentXP = xp % 100;
        
        document.getElementById('userLevel').textContent = level;
        document.getElementById('levelTitle').textContent = title;
        document.getElementById('currentXP').textContent = currentXP;
        document.getElementById('xpFill').style.width = currentXP + '%';
        
        // Stats
        const certs = data.certificates || {};
        const earnedCount = Object.values(certs).filter(v => v === true).length;
        const progress = data.progress || {};
        
        // Count total lessons completed
        let totalLessons = 0;
        Object.values(progress).forEach(course => {
          totalLessons += course.completed || 0;
        });
        
        document.getElementById('streak').textContent = data.streak || 0;
        document.getElementById('coins').textContent = coins;
        document.getElementById('certCount').textContent = earnedCount;
        document.getElementById('lessonsDone').textContent = totalLessons;
        
        // Courses
        const courses = [
          {id:'html', name:'HTML Fundamentals', icon:'https://cdn-icons-png.flaticon.com/512/732/732212.png', lessons:15},
          {id:'css', name:'CSS Styling', icon:'https://cdn-icons-png.flaticon.com/512/732/732190.png', lessons:15},
          {id:'javascript', name:'JavaScript', icon:'https://cdn-icons-png.flaticon.com/512/5968/5968292.png', lessons:15},
          {id:'python', name:'Python', icon:'https://cdn-icons-png.flaticon.com/512/5968/5968350.png', lessons:15},
          {id:'react', name:'React.js', icon:'https://cdn-icons-png.flaticon.com/512/1126/1126012.png', lessons:15}
        ];
        
        const coursesDiv = document.getElementById('coursesProgress');
        coursesDiv.innerHTML = '';
        
        courses.forEach(course => {
          const courseProgress = progress[course.id] || {};
          const completed = courseProgress.completed || 0;
          const percent = Math.min(Math.floor((completed / course.lessons) * 100), 100);
          
          const card = document.createElement('div');
          card.className = 'courseCard';
          card.innerHTML = `
            <div class="courseTop">
              <img src="${course.icon}" class="courseIcon">
              <div class="courseInfo">
                <h4>${course.name}</h4>
                <p>${certs[course.id] ? '✅ Certificate Earned' : completed > 0 ? '📚 In Progress' : '⏳ Not Started'}</p>
              </div>
            </div>
            <div class="progressWrapper">
              <div class="progressBar">
                <div class="progressFill" style="width:${percent}%"></div>
              </div>
              <div class="progressText">${completed} / ${course.lessons} lessons • ${percent}%</div>
            </div>
          `;
          coursesDiv.appendChild(card);
        });
        
        // Certificates
        const certGrid = document.getElementById('certificatesGrid');
        const earnedCerts = Object.keys(certs).filter(key => certs[key] === true);
        
        if(earnedCerts.length > 0){
          certGrid.innerHTML = '';
          earnedCerts.forEach(courseId => {
            const course = courses.find(c => c.id === courseId);
            if(course){
              const card = document.createElement('div');
              card.className = 'certCard';
              card.innerHTML = `
                <i class="fa fa-certificate"></i>
                <h4>${course.name}</h4>
                <p>Completed</p>
              `;
              certGrid.appendChild(card);
            }
          });
        }
        
        loading.style.display = 'none';
        progressContent.style.display = 'block';
        
      }
    } catch(error){
      console.error(error);
      alert('Error loading progress');
    }
  } else {
    window.location.href = 'login.html';
  }
});
</script>

</body>
</html>
