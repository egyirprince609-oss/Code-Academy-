<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Academy Dashboard</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
}

/* NAVBAR */
.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 20px;
background:#0f172a;
border-bottom:1px solid #1e293b;
position:sticky;
top:0;
}

.title{
color:#38bdf8;
font-weight:bold;
}

.xpBox{
background:#1e293b;
padding:8px 12px;
border-radius:10px;
font-size:13px;
}

/* GRID */
.container{
padding:20px;
max-width:1100px;
margin:auto;
}

h2{
color:#38bdf8;
margin-top:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
margin-top:20px;
}

/* CARD */
.card{
background:#111827;
padding:15px;
border-radius:15px;
border:1px solid #1f2937;
cursor:pointer;
transition:0.3s;
position:relative;
}

.card:hover{
transform:translateY(-5px);
border-color:#38bdf8;
}

.card h3{
margin:0;
color:#38bdf8;
}

.card p{
font-size:13px;
color:#94a3b8;
}

.badge{
position:absolute;
top:10px;
right:10px;
padding:5px 10px;
font-size:11px;
border-radius:20px;
background:#22c55e;
}

.locked .badge{
background:#ef4444;
}

.locked{
opacity:0.5;
cursor:not-allowed;
}
</style>
</head>

<body>

<div class="navbar">
<div class="title">Code Academy — All Courses</div>
<div class="xpBox" id="xpBox">XP: 0</div>
</div>

<div class="container">

<h2>📚 Choose Your Course</h2>

<div class="grid" id="courseGrid"></div>

</div>

<script>

/* =========================
USER SYSTEM
========================= */

let user = JSON.parse(localStorage.getItem("academy_user")) || {
xp:0,
progress:{
html:0,
css:0,
javascript:0,
python:0,
react:0
}
};

function saveUser(){
localStorage.setItem("academy_user", JSON.stringify(user));
}

/* =========================
COURSE DATA
========================= */

const courses = [
{
id:"html",
title:"HTML Mastery",
desc:"Learn structure, elements, forms & build real websites",
lessons:15,
page:"html_dashboard.html"
},
{
id:"css",
title:"CSS Mastery",
desc:"Learn styling, layouts, flexbox, grid & UI design",
lessons:15,
page:"css_dashboard.html"
},
{
id:"javascript",
title:"JavaScript Mastery",
desc:"Learn logic, DOM, APIs & app building",
lessons:15,
page:"js_dashboard.html"
},
{
id:"python",
title:"Python Mastery",
desc:"Learn programming, automation & backend basics",
lessons:15,
page:"python_dashboard.html"
},
{
id:"react",
title:"React Mastery",
desc:"Build modern UI apps using components",
lessons:15,
page:"react_dashboard.html"
}
];

/* =========================
RENDER COURSES
========================= */

const grid = document.getElementById("courseGrid");

function isUnlocked(courseId){
return true; // you can later add lock system
}

function render(){

grid.innerHTML = "";

courses.forEach(course=>{

const progress = user.progress[course.id] || 0;

const card = document.createElement("div");

card.className = "card";

card.innerHTML = `
<h3>${course.title}</h3>
<p>${course.desc}</p>
<div class="badge">${progress}/${course.lessons}</div>
`;

card.onclick = () => {
window.location.href = course.page;
};

grid.appendChild(card);

});

document.getElementById("xpBox").textContent =
"XP: " + user.xp;

}

render();

</script>

</body>
</html>
