<!-- REAL APP PWA ENGINE -->
<div id="pwaInstallBanner" style="display:none;position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;padding:14px 16px;border-radius:18px;background:linear-gradient(180deg,#1a2442,#151d33);border:1px solid rgba(148,163,184,.2);box-shadow:0 20px 60px rgba(0,0,0,.5);align-items:center;gap:12px">
  <div style="width:44px;height:44px;border-radius:12px;overflow:hidden;background:#0f172a;flex:none"><img src="./logo.png" style="width:100%;height:100%;object-fit:cover"></div>
  <div style="flex:1;min-width:0"><div style="font-weight:800;font-size:13px;color:#fff">Install Code Academy</div><div style="font-size:11px;color:#8a94a8">Real app • Offline lessons</div></div>
  <button id="pwaInstallBtn" style="padding:10px 14px;border-radius:10px;background:#fff;color:#000;font-weight:800;font-size:12px;border:0">Install</button>
  <button id="pwaDismissBtn" style="width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(148,163,184,.15);color:#8a94a8">✕</button>
</div>
<script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').then(()=>console.log('PWA Ready')); }
let deferredPrompt=null;
const banner=document.getElementById('pwaInstallBanner');
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredPrompt=e; banner.style.display='flex'; });
document.getElementById('pwaInstallBtn').onclick=async()=>{ if(!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; banner.style.display='none'; };
document.getElementById('pwaDismissBtn').onclick=()=>{ banner.style.display='none'; localStorage.setItem('pwa-dismissed',Date.now()); };
</script>
