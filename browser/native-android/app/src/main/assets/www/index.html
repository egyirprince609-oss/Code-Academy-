<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d19"><meta name="application-name" content="Code Academy Browser"><meta name="description" content="Code Academy Browser — your search, tabs, profile and privacy tools in one mobile-first browser workspace."><link rel="icon" href="./browser-icon-192.png"><link rel="apple-touch-icon" href="./browser-icon-192.png"><link rel="manifest" href="./browser-manifest.json"><link rel="stylesheet" href="./browser-auth.css"><title>Code Academy Browser</title><style>body{padding:16px}.splash{width:min(430px,100%);text-align:center}.splash-mark{width:96px;height:96px;border-radius:28px;object-fit:contain;filter:drop-shadow(0 20px 40px #0008);animation:float 2.4s ease-in-out infinite}.brandline{margin:20px 0 6px;font-size:30px;letter-spacing:-1.4px;font-weight:900}.brandline em{font-style:normal;color:#64dfe7}.tagline{color:#a9b9cf;font-size:13px}.loader{height:5px;width:min(230px,80%);margin:30px auto 12px;overflow:hidden;border-radius:99px;background:#1b2a40}.loader span{display:block;width:38%;height:100%;border-radius:99px;background:linear-gradient(90deg,#58dfe6,#7b9fff);animation:load 1.3s ease-in-out infinite}.status{max-width:360px;margin:0 auto;color:#9db0c9;font-size:12px;line-height:1.65;overflow-wrap:anywhere}.splash-actions{display:flex;gap:9px;justify-content:center;margin-top:20px;flex-wrap:wrap}.splash-actions a,.splash-actions button{background:#17283e;border:1px solid #324b67;color:#eef7ff;padding:10px 15px;border-radius:12px;font-size:12px;font-weight:800}.splash-actions a.primary,.splash-actions button.primary{background:linear-gradient(120deg,#5ce0e6,#6ea8ff);color:#08121f;border:0}.small-note{margin:30px auto 0;color:#7187a4;font-size:10px;line-height:1.7;max-width:340px}@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(360%)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style></head><body><main class="splash"><img class="splash-mark" src="./browser-icon-192.png" alt="Code Academy Browser"><div class="brandline">Code <em>Academy</em></div><div class="tagline">A browser workspace built for your next click.</div><div class="loader" aria-hidden="true"><span></span></div><p class="status" id="launchStatus" role="status" aria-live="polite">Starting your browser securely…</p><div class="splash-actions" id="launchActions" hidden><a class="primary" href="./login.html">Sign in</a><a href="./signup.html">Create account</a><button type="button" id="retryLaunch">Retry</button></div><p class="small-note">Your browsing workspace uses Code Academy Browser authentication and profile storage. Some browser or Android capabilities require device support.</p></main><script id="fallbackTimerScript">window.setTimeout(()=>{const status=document.getElementById('launchStatus');const actions=document.getElementById('launchActions');if(status&&!actions.hidden){status.textContent='The browser authentication module did not respond. Check the internet connection, Firebase availability, or the exact error from the browser console.';actions.hidden=false;const retry=document.getElementById('retryLaunch');if(retry)retry.onclick=()=>location.reload();}},18000);</script><script type="module" src="./index.js"></script></body></html>
