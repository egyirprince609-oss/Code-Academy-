services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SEARXNG_URL: http://searxng:8080
      DATABASE_PATH: /data/academy-browser.sqlite3
      QUARANTINE_DIR: /quarantine
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    ports:
      # Bind locally; publish through Caddy/Nginx HTTPS. Never expose 8000 publicly.
      - "127.0.0.1:8000:8000"
    volumes:
      - academy_data:/data
      - academy_quarantine:/quarantine
    depends_on:
      - searxng
      - clamav
    networks: [academy_private]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env}
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_LIMITER: "false"
      SEARXNG_PUBLIC_INSTANCE: "false"
      SEARXNG_IMAGE_PROXY: "true"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks: [academy_private]
    # Deliberately no published host port.

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    networks: [academy_private]
    # Deliberately no published host port; clamd TCP has no built-in authentication.
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=1 --host=127.0.0.1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 180s

networks:
  academy_private:
    internal: false

volumes:
  academy_data:
  academy_quarantine:
