services:
  - type: web
    name: code-academy-live-map-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ALLOWED_ORIGINS
        value: "https://codeacademybywm.web.app,https://codeacademybywm.firebaseapp.com,https://egyirprince609-oss.github.io,https://codeacademy.netlify.app,https://localhost,capacitor://localhost"
