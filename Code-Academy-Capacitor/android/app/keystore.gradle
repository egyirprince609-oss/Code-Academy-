// Applied from android/app/build.gradle. The keystore itself is never stored in this repository.
def caStorePath = System.getenv('ANDROID_KEYSTORE_PATH')
if (caStorePath != null && !caStorePath.trim().isEmpty()) {
    android {
        signingConfigs {
            release {
                storeFile file(caStorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }
}
