<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - Code Academy</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#020617;
  color:white;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.reset-card{
  width:100%;
  max-width:420px;
  background:#0f172a;
  border-radius:20px;
  padding:35px 30px;
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}

.logo{
  text-align:center;
  margin-bottom:25px;
}

.logo img{
  width:60px;
  height:60px;
  border-radius:50%;
  margin-bottom:12px;
}

.logo h1{
  font-size:22px;
  color:#38bdf8;
  margin-bottom:5px;
}

.logo p{
  font-size:12px;
  color:#94a3b8;
}

.form-group{
  margin-bottom:18px;
}

.input-box{
  position:relative;
}

.input-box i{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  color:#38bdf8;
  font-size:14px;
}

.input-box input{
  width:100%;
  padding:14px 14px 14px 42px;
  background:#1e293b;
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;
  color:white;
  font-size:14px;
  outline:none;
}

.btn-primary{
  width:100%;
  padding:15px;
  background:linear-gradient(135deg, #38bdf8, #0ea5e9);
  border:none;
  border-radius:12px;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

.btn-primary:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(56,189,248,0.4);
}

.back-link{
  text-align:center;
  margin-top:20px;
  font-size:13px;
  color:#94a3b8;
}

.back-link a{
  color:#38bdf8;
  text-decoration:none;
}

.success-msg{
  background:rgba(34,197,94,0.15);
  border:1px solid rgba(34,197,94,0.4);
  color:#86efac;
  padding:12px;
  border-radius:10px;
  font-size:12px;
  margin-bottom:15px;
  display:none;
}

.error-msg{
  background:rgba(239,68,68,0.15);
  border:1px solid rgba(239,68,68,0.4);
  color:#fca5a5;
  padding:12px;
  border-radius:10px;
  font-size:12px;
  margin-bottom:15px;
  display:none;
}
</style>
</head>
<body>

<div class="reset-card">

  <div class="logo">
    <img src="logo.png" alt="Code Academy">
    <h1>Reset Password</h1>
    <p>Enter your email to get reset link</p>
  </div>

  <div id="successMsg" class="success-msg"></div>
  <div id="errorMsg" class="error-msg"></div>

  <form id="resetForm">
    <div class="form-group">
      <div class="input-box">
        <i class="fa fa-envelope"></i>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>
    </div>

    <button type="submit" class="btn-primary" id="resetBtn">
      Send Reset Link
    </button>
  </form>

  <div class="back-link">
    Remember password? <a href="login.html">Back to Login</a>
  </div>

</div>

<script type="module">
import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

const firebaseConfig = {
  apiKey: "AIzaSyDDHzPkR4jIMz6fcK7M_hdjQk2u6xk-efI",
  authDomain: "code-acada.firebaseapp.com",
  projectId: "code-acada",
  storageBucket: "code-acada.firebasestorage.app",
  messagingSenderId: "155763239454",
  appId: "1:155763239454:web:7fc20b0037dcd8e5621c0f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const form = document.getElementById('resetForm');
const successMsg = document.getElementById('successMsg');
const errorMsg = document.getElementById('errorMsg');
const resetBtn = document.getElementById('resetBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  successMsg.style.display = 'none';
  errorMsg.style.display = 'none';
  
  const email = document.getElementById('email').value.trim();
  resetBtn.disabled = true;

  try{
    await sendPasswordResetEmail(auth, email);
    successMsg.textContent = 'Password reset link sent! Check your email.';
    successMsg.style.display = 'block';
    form.reset();
  } catch(error){
    if(error.code === 'auth/user-not-found'){
      errorMsg.textContent = 'No account found with this email';
    } else {
      errorMsg.textContent = error.message;
    }
    errorMsg.style.display = 'block';
  }
  
  resetBtn.disabled = false;
});
</script>
</body>
</html>
