<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up - Code Academy</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#020617;
  color:white;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

/* ============================================================
   SIGNUP CARD
   ============================================================ */

.signup-card{
  width:100%;
  max-width:420px;
  background:#0f172a;
  border-radius:20px;
  padding:35px 30px;
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}


/* ============================================================
   LOGO
   ============================================================ */

.logo{
  text-align:center;
  margin-bottom:25px;
}

.logo img{
  width:60px;
  height:60px;
  border-radius:50%;
  margin-bottom:12px;
}

.logo h1{
  font-size:24px;
  color:#38bdf8;
  margin-bottom:5px;
}

.logo p{
  font-size:12px;
  color:#94a3b8;
}


/* ============================================================
   FORM
   ============================================================ */

.form-group{
  margin-bottom:18px;
}

.form-group label{
  display:block;
  font-size:12px;
  color:#cbd5e1;
  margin-bottom:6px;
}

.input-box{
  position:relative;
}

.input-box i{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  color:#38bdf8;
  font-size:14px;
}

.input-box input{
  width:100%;
  padding:14px 14px 14px 42px;
  background:#1e293b;
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;
  color:white;
  font-size:14px;
  outline:none;
  transition:0.3s;
}

.input-box input:focus{
  border-color:#38bdf8;
  background:#0f172a;
}

.input-box input::placeholder{
  color:#64748b;
}


/* ============================================================
   PRIMARY BUTTON
   ============================================================ */

.btn-primary{
  width:100%;
  padding:15px;
  background:linear-gradient(135deg,#38bdf8,#0ea5e9);
  border:none;
  border-radius:12px;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  margin-top:8px;
  transition:0.3s;
}

.btn-primary:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(56,189,248,0.4);
}

.btn-primary:disabled{
  opacity:0.6;
  cursor:not-allowed;
  transform:none;
}


/* ============================================================
   DIVIDER
   ============================================================ */

.divider{
  display:flex;
  align-items:center;
  margin:25px 0;
  color:#64748b;
  font-size:12px;
}

.divider::before,
.divider::after{
  content:'';
  flex:1;
  height:1px;
  background:rgba(255,255,255,0.1);
}

.divider span{
  padding:0 12px;
}


/* ============================================================
   SOCIAL BUTTONS
   ============================================================ */

.social-btn{
  width:100%;
  padding:14px;
  background:#1e293b;
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;
  color:white;
  font-size:14px;
  cursor:pointer;
  margin-bottom:12px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  transition:0.3s;
}

.social-btn:hover{
  background:#334155;
  border-color:#38bdf8;
}

.social-btn:disabled{
  opacity:0.6;
  cursor:not-allowed;
}

.social-btn i{
  font-size:18px;
}

.google-btn i{
  color:#DB4437;
}

.yahoo-btn i{
  color:#720e9e;
}


/* ============================================================
   LOGIN LINK
   ============================================================ */

.login-link{
  text-align:center;
  margin-top:20px;
  font-size:13px;
  color:#94a3b8;
}

.login-link a{
  color:#38bdf8;
  text-decoration:none;
  font-weight:bold;
}

.login-link a:hover{
  text-decoration:underline;
}


/* ============================================================
   ERROR MESSAGE
   ============================================================ */

.error-msg{
  background:rgba(239,68,68,0.15);
  border:1px solid rgba(239,68,68,0.4);
  color:#fca5a5;

  padding:12px;

  border-radius:10px;

  font-size:12px;

  margin-bottom:15px;

  display:none;

  line-height:1.5;

  word-break:break-word;
}


/* ============================================================
   SUCCESS MESSAGE
   ============================================================ */

.success-msg{
  background:rgba(34,197,94,0.15);
  border:1px solid rgba(34,197,94,0.4);
  color:#86efac;

  padding:12px;

  border-radius:10px;

  font-size:12px;

  margin-bottom:15px;

  display:none;

  line-height:1.5;
}


/* ============================================================
   LOADING
   ============================================================ */

.loading{
  display:none;
  text-align:center;
  color:#38bdf8;
  font-size:12px;
  margin-top:10px;
}


/* ============================================================
   MOBILE
   ============================================================ */

@media(max-width:480px){

  .signup-card{
    padding:25px 20px;
  }

  .logo h1{
    font-size:20px;
  }

}

</style>
</head>


<body>


<div class="signup-card">


  <!-- ========================================================
       LOGO
       ======================================================== -->

  <div class="logo">

    <img
      src="logo.png"
      alt="Code Academy"
    >

    <h1>
      Code Academy
    </h1>

    <p>
      Create your account
    </p>

  </div>


  <!-- ========================================================
       ERROR MESSAGE
       ======================================================== -->

  <div
    id="errorMsg"
    class="error-msg"
    role="alert"
  ></div>


  <!-- ========================================================
       SUCCESS MESSAGE
       ======================================================== -->

  <div
    id="successMsg"
    class="success-msg"
    role="status"
  ></div>


  <!-- ========================================================
       EMAIL SIGNUP FORM
       ======================================================== -->

  <form
    id="signupForm"
    novalidate
  >


    <!-- FULL NAME -->

    <div class="form-group">

      <label for="name">
        Full Name
      </label>

      <div class="input-box">

        <i class="fa fa-user"></i>

        <input
          type="text"
          id="name"
          placeholder="John Doe"
          autocomplete="name"
          required
        >

      </div>

    </div>


    <!-- EMAIL -->

    <div class="form-group">

      <label for="email">
        Email
      </label>

      <div class="input-box">

        <i class="fa fa-envelope"></i>

        <input
          type="email"
          id="email"
          placeholder="you@email.com"
          autocomplete="email"
          required
        >

      </div>

    </div>


    <!-- PASSWORD -->

    <div class="form-group">

      <label for="password">
        Password
      </label>

      <div class="input-box">

        <i class="fa fa-lock"></i>

        <input
          type="password"
          id="password"
          placeholder="Min 6 characters"
          autocomplete="new-password"
          required
          minlength="6"
        >

      </div>

    </div>


    <!-- CREATE ACCOUNT -->

    <button
      type="submit"
      class="btn-primary"
      id="signupBtn"
    >
      Create Account
    </button>


    <!-- LOADING -->

    <div
      class="loading"
      id="loading"
    >
      Creating account...
    </div>


  </form>


  <!-- ========================================================
       DIVIDER
       ======================================================== -->

  <div class="divider">

    <span>
      Or sign up with
    </span>

  </div>


  <!-- ========================================================
       GOOGLE
       ======================================================== -->

  <button
    type="button"
    class="social-btn google-btn"
    id="googleBtn"
  >

    <i class="fab fa-google"></i>

    <span id="googleText">
      Continue with Google
    </span>

  </button>


  <!-- ========================================================
       YAHOO
       ======================================================== -->

  <button
    type="button"
    class="social-btn yahoo-btn"
    id="yahooBtn"
  >

    <i class="fab fa-yahoo"></i>

    <span id="yahooText">
      Continue with Yahoo
    </span>

  </button>


  <!-- ========================================================
       LOGIN LINK
       ======================================================== -->

  <div class="login-link">

    Already have an account?

    <a href="login.html">
      Log in
    </a>

  </div>


</div>



<!-- ============================================================
     JAVASCRIPT
     ============================================================ -->

<script type="module">


/* ============================================================
   IMPORT FIREBASE AUTHENTICATION FUNCTIONS
   ============================================================ */

import {
  signUp,
  signInWithGoogle,
  signInWithYahoo,
  completeGoogleRedirect
} from "./authentication.js";



/* ============================================================
   ELEMENTS
   ============================================================ */

const form =
  document.getElementById("signupForm");

const errorMsg =
  document.getElementById("errorMsg");

const successMsg =
  document.getElementById("successMsg");

const loading =
  document.getElementById("loading");

const signupBtn =
  document.getElementById("signupBtn");

const googleBtn =
  document.getElementById("googleBtn");

const yahooBtn =
  document.getElementById("yahooBtn");

const googleText =
  document.getElementById("googleText");

const yahooText =
  document.getElementById("yahooText");



/* ============================================================
   SHOW ERROR
   ============================================================ */

function showError(message){

  successMsg.style.display = "none";

  errorMsg.textContent = message;

  errorMsg.style.display = "block";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}



/* ============================================================
   SHOW SUCCESS
   ============================================================ */

function showSuccess(message){

  errorMsg.style.display = "none";

  successMsg.textContent = message;

  successMsg.style.display = "block";

}



/* ============================================================
   HIDE MESSAGES
   ============================================================ */

function hideMessages(){

  errorMsg.style.display = "none";

  successMsg.style.display = "none";

}



/* ============================================================
   CHECK INTERNET CONNECTION
   ============================================================ */

function hasInternet(){

  return navigator.onLine;

}



/* ============================================================
   CONVERT FIREBASE ERRORS INTO USER-FRIENDLY MESSAGES
   ============================================================ */

function getFirebaseErrorMessage(error, provider = "account"){

  console.error(
    `${provider} authentication error:`,
    error
  );


  const code =
    error?.code || "";


  const rawMessage =
    error?.message || "";


  /* ----------------------------------------------------------
     NO INTERNET
     ---------------------------------------------------------- */

  if(!navigator.onLine){

    return "No internet connection. Please check your internet connection and try again.";
  }


  /* ----------------------------------------------------------
     EMAIL AUTHENTICATION
     ---------------------------------------------------------- */

  if(code === "auth/email-already-in-use"){

    return "This email address is already registered. Please log in instead.";
  }


  if(code === "auth/invalid-email"){

    return "The email address you entered is not valid. Please check it and try again.";
  }


  if(code === "auth/weak-password"){

    return "Your password is too weak. Please choose a stronger password.";
  }


  if(code === "auth/missing-password"){

    return "Please enter a password.";
  }


  if(code === "auth/network-request-failed"){

    return "Network connection failed. Please check your internet connection and try again.";
  }


  if(code === "auth/too-many-requests"){

    return "Too many attempts have been made. Please wait a few minutes and try again.";
  }


  /* ----------------------------------------------------------
     GOOGLE AUTHENTICATION
     ---------------------------------------------------------- */

  if(code === "auth/unauthorized-domain"){

    return "Google sign-in is not authorized for this website domain. Please contact the Code Academy administrator.";
  }


  if(code === "auth/popup-blocked"){

    return "Your browser blocked the authentication window. Please allow pop-ups for Code Academy and try again.";
  }


  if(code === "auth/popup-closed-by-user"){

    return "The Google sign-in window was closed before sign-in was completed.";
  }


  if(code === "auth/cancelled-popup-request"){

    return "Another sign-in request is already running. Please wait and try again.";
  }


  if(code === "auth/account-exists-with-different-credential"){

    return "An account already exists with this email using a different sign-in method. Please use the original sign-in method.";
  }


  if(code === "auth/operation-not-allowed"){

    return `${provider} sign-in is not enabled in Firebase. Please contact the Code Academy administrator.`;
  }


  if(code === "auth/web-storage-unsupported"){

    return "Your browser does not support the storage required for sign-in. Please try another browser.";
  }


  if(code === "auth/internal-error"){

    return "Firebase encountered an internal error. Please try again in a moment.";
  }


  if(code === "auth/invalid-api-key"){

    return "The Firebase configuration is invalid. Please contact the Code Academy administrator.";
  }


  /* ----------------------------------------------------------
     OAUTH / REDIRECT ERRORS
     ---------------------------------------------------------- */

  if(
    code === "auth/redirect-cancelled-by-user"
  ){

    return "The sign-in process was cancelled. Please try again.";
  }


  if(
    code === "auth/redirect-operation-pending"
  ){

    return "A sign-in request is already in progress. Please wait a moment.";
  }


  /* ----------------------------------------------------------
     GENERIC NETWORK MESSAGE
     ---------------------------------------------------------- */

  if(
    rawMessage.toLowerCase().includes("network")
  ){

    return "A network connection problem occurred. Please check your internet connection and try again.";
  }


  /* ----------------------------------------------------------
     UNKNOWN ERROR
     ---------------------------------------------------------- */

  if(rawMessage){

    return `Sign-in failed: ${rawMessage}`;
  }


  return "Something went wrong while creating your account. Please try again.";

}



/* ============================================================
   GOOGLE REDIRECT RESULT
   ============================================================

   When Google sends the user back to signup.html,
   this code completes the authentication.

   ============================================================ */

async function checkGoogleRedirect(){

  try{

    const user =
      await completeGoogleRedirect();


    if(!user){

      return;
    }


    showSuccess(
      "Google account verified successfully. Opening your profile..."
    );


    /* --------------------------------------------------------
       Give the success message a moment to appear.
       -------------------------------------------------------- */

    setTimeout(() => {

      window.location.href =
        "profile.html";

    }, 700);


  }catch(error){

    googleBtn.disabled = false;

    yahooBtn.disabled = false;

    googleText.textContent =
      "Continue with Google";

    yahooText.textContent =
      "Continue with Yahoo";


    showError(
      getFirebaseErrorMessage(
        error,
        "Google"
      )
    );

  }

}



/* ============================================================
   RUN REDIRECT CHECK
   ============================================================ */

checkGoogleRedirect();



/* ============================================================
   EMAIL + PASSWORD SIGNUP
   ============================================================ */

form.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();

    hideMessages();


    /* --------------------------------------------------------
       GET VALUES
       -------------------------------------------------------- */

    const name =
      document
        .getElementById("name")
        .value
        .trim();

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;


    /* --------------------------------------------------------
       NAME VALIDATION
       -------------------------------------------------------- */

    if(!name){

      showError(
        "Please enter your full name."
      );

      return;
    }


    if(name.length < 2){

      showError(
        "Your name is too short. Please enter your full name."
      );

      return;
    }


    /* --------------------------------------------------------
       EMAIL VALIDATION
       -------------------------------------------------------- */

    if(!email){

      showError(
        "Please enter your email address."
      );

      return;
    }


    /* --------------------------------------------------------
       PASSWORD VALIDATION
       -------------------------------------------------------- */

    if(!password){

      showError(
        "Please enter a password."
      );

      return;
    }


    if(password.length < 6){

      showError(
        "Password must be at least 6 characters."
      );

      return;
    }


    /* --------------------------------------------------------
       INTERNET CHECK
       -------------------------------------------------------- */

    if(!hasInternet()){

      showError(
        "You are currently offline. Please connect to the internet before creating your account."
      );

      return;
    }


    /* --------------------------------------------------------
       DISABLE BUTTON
       -------------------------------------------------------- */

    signupBtn.disabled = true;

    loading.style.display = "block";

    loading.textContent =
      "Creating your account...";


    try{

      /* ------------------------------------------------------
         CREATE FIREBASE ACCOUNT
         ------------------------------------------------------ */

      await signUp(
        email,
        password,
        name
      );


      /* ------------------------------------------------------
         SUCCESS
         ------------------------------------------------------ */

      loading.textContent =
        "Account created successfully!";


      showSuccess(
        "Your Code Academy account has been created successfully. Opening your profile..."
      );


      /* ------------------------------------------------------
         GO TO PROFILE
         ------------------------------------------------------ */

      setTimeout(() => {

        window.location.href =
          "profile.html";

      }, 700);


    }catch(error){

      console.error(
        "Email signup failed:",
        error
      );


      signupBtn.disabled = false;

      loading.style.display = "none";


      showError(
        getFirebaseErrorMessage(
          error,
          "Email"
        )
      );

    }

  }
);



/* ============================================================
   GOOGLE SIGNUP
   ============================================================

   IMPORTANT:
   signInWithGoogle() now uses Firebase REDIRECT.

   Therefore we DO NOT redirect to profile.html here.

   Firebase sends the browser to Google, then Google sends
   the browser back to this signup.html page.

   checkGoogleRedirect() above then completes the login and
   sends the user to profile.html.

   ============================================================ */

googleBtn.addEventListener(
  "click",
  async () => {

    hideMessages();


    /* --------------------------------------------------------
       INTERNET CHECK
       -------------------------------------------------------- */

    if(!hasInternet()){

      showError(
        "You are offline. Please connect to the internet before using Google sign-up."
      );

      return;
    }


    /* --------------------------------------------------------
       DISABLE BOTH SOCIAL BUTTONS
       -------------------------------------------------------- */

    googleBtn.disabled = true;

    yahooBtn.disabled = true;


    googleText.textContent =
      "Connecting to Google...";


    showSuccess(
      "Connecting to Google securely. Please wait..."
    );


    try{

      /* ------------------------------------------------------
         START GOOGLE REDIRECT

         The browser will leave this page.

         DO NOT add:
         window.location.href = "profile.html";

         here.
         ------------------------------------------------------ */

      await signInWithGoogle();


    }catch(error){

      console.error(
        "Google signup failed:",
        error
      );


      googleBtn.disabled = false;

      yahooBtn.disabled = false;

      googleText.textContent =
        "Continue with Google";


      showError(
        getFirebaseErrorMessage(
          error,
          "Google"
        )
      );

    }

  }
);



/* ============================================================
   YAHOO SIGNUP
   ============================================================ */

yahooBtn.addEventListener(
  "click",
  async () => {

    hideMessages();


    /* --------------------------------------------------------
       INTERNET CHECK
       -------------------------------------------------------- */

    if(!hasInternet()){

      showError(
        "You are offline. Please connect to the internet before using Yahoo sign-up."
      );

      return;
    }


    /* --------------------------------------------------------
       DISABLE BUTTONS
       -------------------------------------------------------- */

    googleBtn.disabled = true;

    yahooBtn.disabled = true;


    yahooText.textContent =
      "Connecting to Yahoo...";


    showSuccess(
      "Connecting to Yahoo securely. Please wait..."
    );


    try{

      /* ------------------------------------------------------
         START YAHOO AUTHENTICATION
         ------------------------------------------------------ */

      await signInWithYahoo();


      /* ------------------------------------------------------
         SUCCESS
         ------------------------------------------------------ */

      showSuccess(
        "Yahoo sign-up successful. Opening your profile..."
      );


      setTimeout(() => {

        window.location.href =
          "profile.html";

      }, 700);


    }catch(error){

      console.error(
        "Yahoo signup failed:",
        error
      );


      googleBtn.disabled = false;

      yahooBtn.disabled = false;

      yahooText.textContent =
        "Continue with Yahoo";


      showError(
        getFirebaseErrorMessage(
          error,
          "Yahoo"
        )
      );

    }

  }
);



/* ============================================================
   ONLINE / OFFLINE DETECTION
   ============================================================ */

window.addEventListener(
  "offline",
  () => {

    showError(
      "Your internet connection was lost. Please reconnect before trying again."
    );

  }
);


window.addEventListener(
  "online",
  () => {

    hideMessages();

  }
);


</script>

</body>
</html>
