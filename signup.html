<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - Code Academy</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#020617;
  color:white;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

/* SIGNUP CARD */
.signup-card{
  width:100%;
  max-width:420px;
  background:#0f172a;
  border-radius:20px;
  padding:35px 30px;
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}

/* LOGO */
.logo{
  text-align:center;
  margin-bottom:25px;
}

.logo img{
  width:60px;
  height:60px;
  border-radius:50%;
  margin-bottom:12px;
}

.logo h1{
  font-size:24px;
  color:#38bdf8;
  margin-bottom:5px;
}

.logo p{
  font-size:12px;
  color:#94a3b8;
}

/* FORM */
.form-group{
  margin-bottom:18px;
}

.form-group label{
  display:block;
  font-size:12px;
  color:#cbd5e1;
  margin-bottom:6px;
}

.input-box{
  position:relative;
}

.input-box i{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  color:#38bdf8;
  font-size:14px;
}

.input-box input{
  width:100%;
  padding:14px 14px 14px 42px;
  background:#1e293b;
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;
  color:white;
  font-size:14px;
  outline:none;
  transition:0.3s;
}

.input-box input:focus{
  border-color:#38bdf8;
  background:#0f172a;
}

.input-box input::placeholder{
  color:#64748b;
}

/* BUTTON */
.btn-primary{
  width:100%;
  padding:15px;
  background:linear-gradient(135deg, #38bdf8, #0ea5e9);
  border:none;
  border-radius:12px;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  margin-top:8px;
  transition:0.3s;
}

.btn-primary:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(56,189,248,0.4);
}

.btn-primary:disabled{
  opacity:0.6;
  cursor:not-allowed;
}

/* DIVIDER */
.divider{
  display:flex;
  align-items:center;
  margin:25px 0;
  color:#64748b;
  font-size:12px;
}

.divider::before,
.divider::after{
  content:'';
  flex:1;
  height:1px;
  background:rgba(255,255,255,0.1);
}

.divider span{
  padding:0 12px;
}

/* SOCIAL BUTTONS */
.social-btn{
  width:100%;
  padding:14px;
  background:#1e293b;
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;
  color:white;
  font-size:14px;
  cursor:pointer;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  transition:0.3s;
}

.social-btn:hover{
  background:#334155;
  border-color:#38bdf8;
}

.social-btn i{
  font-size:18px;
}

.google-btn i{color:#DB4437}
.yahoo-btn i{color:#720e9e}

/* LOGIN LINK */
.login-link{
  text-align:center;
  margin-top:20px;
  font-size:13px;
  color:#94a3b8;
}

.login-link a{
  color:#38bdf8;
  text-decoration:none;
  font-weight:bold;
}

.login-link a:hover{
  text-decoration:underline;
}

/* ERROR MESSAGE */
.error-msg{
  background:rgba(239,68,68,0.15);
  border:1px solid rgba(239,68,68,0.4);
  color:#fca5a5;
  padding:12px;
  border-radius:10px;
  font-size:12px;
  margin-bottom:15px;
  display:none;
}

/* LOADING */
.loading{
  display:none;
  text-align:center;
  color:#38bdf8;
  font-size:12px;
  margin-top:10px;
}

/* MOBILE */
@media(max-width:480px){
  .signup-card{
    padding:25px 20px;
  }
  .logo h1{
    font-size:20px;
  }
}
</style>
</head>
<body>

<div class="signup-card">

  <!-- LOGO -->
  <div class="logo">
    <img src="logo.png" alt="Code Academy">
    <h1>Code Academy</h1>
    <p>Create your account</p>
  </div>

  <!-- ERROR MESSAGE -->
  <div id="errorMsg" class="error-msg"></div>

  <!-- EMAIL FORM -->
  <form id="signupForm">
    <div class="form-group">
      <label>Full Name</label>
      <div class="input-box">
        <i class="fa fa-user"></i>
        <input type="text" id="name" placeholder="John Doe" required>
      </div>
    </div>

    <div class="form-group">
      <label>Email</label>
      <div class="input-box">
        <i class="fa fa-envelope"></i>
        <input type="email" id="email" placeholder="you@email.com" required>
      </div>
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="input-box">
        <i class="fa fa-lock"></i>
        <input type="password" id="password" placeholder="Min 6 characters" required minlength="6">
      </div>
    </div>

    <button type="submit" class="btn-primary" id="signupBtn">
      Create Account
    </button>

    <div class="loading" id="loading">Creating account...</div>
  </form>

  <!-- DIVIDER -->
  <div class="divider">
    <span>Or sign up with</span>
  </div>

  <!-- SOCIAL BUTTONS -->
  <button class="social-btn google-btn" id="googleBtn">
    <i class="fab fa-google"></i>
    Continue with Google
  </button>

  <button class="social-btn yahoo-btn" id="yahooBtn">
    <i class="fab fa-yahoo"></i>
    Continue with Yahoo
  </button>

  <!-- LOGIN LINK -->
  <div class="login-link">
    Already have an account? <a href="login.html">Log in</a>
  </div>

</div>

<script type="module">
import { signUp, signInWithGoogle, signInWithYahoo } from './authentication.js';

const form = document.getElementById('signupForm');
const errorMsg = document.getElementById('errorMsg');
const loading = document.getElementById('loading');
const signupBtn = document.getElementById('signupBtn');

// Show error
function showError(msg){
  errorMsg.textContent = msg;
  errorMsg.style.display = 'block';
  setTimeout(() => errorMsg.style.display = 'none', 5000);
}

// Hide error
function hideError(){
  errorMsg.style.display = 'none';
}

// Email + Password Signup
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError();
  
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if(password.length < 6){
    showError('Password must be at least 6 characters');
    return;
  }

  signupBtn.disabled = true;
  loading.style.display = 'block';

  try{
    await signUp(email, password, name);
    window.location.href = 'profile.html';
  } catch(error){
    signupBtn.disabled = false;
    loading.style.display = 'none';
    
    if(error.code === 'auth/email-already-in-use'){
      showError('Email already exists. Try logging in.');
    } else if(error.code === 'auth/invalid-email'){
      showError('Invalid email address');
    } else {
      showError(error.message);
    }
  }
});

// Google Signup
document.getElementById('googleBtn').addEventListener('click', async () => {
  hideError();
  try{
    await signInWithGoogle();
    window.location.href = 'profile.html';
  } catch(error){
    showError('Google signup failed. Try again.');
  }
});

// Yahoo Signup
document.getElementById('yahooBtn').addEventListener('click', async () => {
  hideError();
  try{
    await signInWithYahoo();
    window.location.href = 'profile.html';
  } catch(error){
    showError('Yahoo signup failed. Try again.');
  }
});
</script>
</body>
</html>
