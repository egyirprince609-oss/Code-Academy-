<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Course Dashboard</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
}

/* =========================
NAVBAR
========================= */

.navbar{
display:flex;
align-items:center;
justify-content:space-between;
padding:15px 20px;
background:#0f172a;
border-bottom:1px solid #1e293b;
position:sticky;
top:0;
}

/* BACK BUTTON (UPGRADED) */
.backBtn{
background:linear-gradient(135deg,#38bdf8,#2563eb);
border:none;
color:white;
padding:10px 14px;
border-radius:12px;
cursor:pointer;
font-weight:bold;
display:flex;
align-items:center;
gap:8px;
transition:0.3s;
box-shadow:0 0 10px rgba(56,189,248,0.4);
}

.backBtn:hover{
transform:translateX(-5px);
box-shadow:0 0 18px rgba(56,189,248,0.7);
}

/* TITLE */
.title{
font-size:16px;
color:#38bdf8;
font-weight:bold;
}

/* XP BOX */
.xpBox{
background:#1e293b;
padding:8px 12px;
border-radius:10px;
font-size:13px;
}

/* =========================
CONTAINER
========================= */

.container{
padding:20px;
max-width:1100px;
margin:auto;
}

h2{
color:#38bdf8;
margin-top:20px;
}

/* =========================
GRID
========================= */

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
margin-top:20px;
}

/* =========================
CARD
========================= */

.card{
background:#111827;
padding:15px;
border-radius:15px;
border:1px solid #1f2937;
cursor:pointer;
transition:0.3s;
position:relative;
}

.card:hover{
transform:translateY(-5px);
border-color:#38bdf8;
box-shadow:0 0 15px rgba(56,189,248,0.2);
}

.card h3{
margin:0;
color:#38bdf8;
}

.card p{
font-size:13px;
color:#94a3b8;
margin-top:8px;
}

.badge{
position:absolute;
top:10px;
right:10px;
padding:5px 10px;
font-size:11px;
border-radius:20px;
background:#22c55e;
}

.locked .badge{
background:#ef4444;
}

.locked{
opacity:0.5;
cursor:not-allowed;
}

.progressBar{
height:6px;
background:#1e293b;
border-radius:10px;
margin-top:10px;
overflow:hidden;
}

.progress{
height:100%;
width:0%;
background:#38bdf8;
}

/* BACK ICON STYLE */
.backIcon{
font-size:18px;
}

</style>
</head>

<body>

<!-- =========================
NAVBAR
========================= -->

<div class="navbar">

<button class="backBtn" onclick="goBack()">
<span class="backIcon">⬅</span> Back
</button>

<div class="title">CSS Course</div>

<div class="xpBox" id="xpBox">XP: 0</div>

</div>

<!-- =========================
CONTENT
========================= -->

<div class="container">

<h2>CSS Mastery Path (15 Lessons)</h2>

<div class="grid" id="lessonGrid"></div>

</div>

<script>

/* =========================
BACK BUTTON LOGIC
========================= */

function goBack(){
window.history.back();
}

/* =========================
USER DATA
========================= */

let user = JSON.parse(localStorage.getItem("css_user")) || {
xp:0,
completed:[]
};

function saveUser(){
localStorage.setItem("css_user", JSON.stringify(user));
}

document.getElementById("xpBox").textContent = "XP: " + user.xp;

/* =========================
LESSONS
========================= */

const lessons = [
{
id:"css_lesson_1",
title:"Introduction to CSS",
desc:"Understand what CSS is and how it controls website design."
},
{
id:"css_lesson_2",
title:"CSS Syntax",
desc:"Learn selectors, properties, and values."
},
{
id:"css_lesson_3",
title:"Colors & Backgrounds",
desc:"Learn how to style colors and backgrounds."
},
{
id:"css_lesson_4",
title:"Box Model",
desc:"Understand padding, margin, border, content."
},
{
id:"css_lesson_5",
title:"Flexbox",
desc:"Master flexible layouts."
},
{
id:"css_lesson_6",
title:"Grid Layout",
desc:"Build modern grid-based designs."
},
{
id:"css_lesson_7",
title:"Typography",
desc:"Style fonts, text, spacing."
},
{
id:"css_lesson_8",
title:"Positioning",
desc:"Learn absolute, relative, fixed."
},
{
id:"css_lesson_9",
title:"Responsive Design",
desc:"Make websites mobile friendly."
},
{
id:"css_lesson_10",
title:"Transitions",
desc:"Add smooth animations."
},
{
id:"css_lesson_11",
title:"Transforms",
desc:"Rotate, scale, move elements."
},
{
id:"css_lesson_12",
title:"Animations",
desc:"Keyframes and motion design."
},
{
id:"css_lesson_13",
title:"Advanced Layouts",
desc:"Real-world UI structures."
},
{
id:"css_lesson_14",
title:"CSS Projects",
desc:"Mini real-world UI builds."
},
{
id:"css_lesson_15",
title:"Final Capstone Project",
desc:"Build a full modern UI system."
}
];

/* =========================
UNLOCK SYSTEM
========================= */

function isUnlocked(index){

if(index === 0) return true;

return user.completed.includes(lessons[index-1].id);
}

/* =========================
RENDER
========================= */

const grid = document.getElementById("lessonGrid");

function render(){

grid.innerHTML = "";

lessons.forEach((lesson,index)=>{

const unlocked = isUnlocked(index);

const card = document.createElement("div");

card.className = "card " + (!unlocked ? "locked" : "");

card.innerHTML = `
<h3>${lesson.title}</h3>
<p>${lesson.desc}</p>
<div class="badge">${unlocked ? "OPEN" : "LOCKED"}</div>
<div class="progressBar">
<div class="progress"></div>
</div>
`;

if(unlocked){
card.onclick = () => {
window.location.href = `css_lesson.html?lesson=${lesson.id}`;
};
}

grid.appendChild(card);

});

}

render();

</script>

</body>
</html>
