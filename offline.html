<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080c18">
<title>Offline - Code Academy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#080c18;color:#e8ebf2;font-family:Inter,sans-serif;padding:20px;text-align:center}
.card{width:min(400px,100%);padding:32px;border-radius:24px;background:linear-gradient(180deg,#151d33,#11162a);border:1px solid rgba(148,163,184,.15)}
.logo{width:72px;height:72px;margin:0 auto 16px;border-radius:18px;overflow:hidden;background:#0f172a;border:1px solid rgba(148,163,184,.15)}
.logo img{width:100%;height:100%;object-fit:cover}
h2{font-size:22px;font-weight:800;margin-bottom:8px}
p{color:#8a94a8;font-size:13px;line-height:1.6;margin-bottom:18px}
button{padding:12px 20px;border-radius:12px;border:0;background:#fff;color:#000;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<div class="logo"><img src="./logo.png" alt=""></div>
<h2>You're Offline</h2>
<p>Your hearts, XP and downloaded lessons are saved. Code Academy works offline like a real app.</p>
<button onclick="location.href='./index.html'">Go to Dashboard</button>
</div>
</body>
</html>
