<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Academy - Lesson Engine</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#020617;
color:white;
height:100vh;
overflow:hidden;
display:flex;
flex-direction:column;
}

header{
height:70px;
background:#0f172a;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
border-bottom:1px solid rgba(255,255,255,0.08);
}

.leftNav{
display:flex;
align-items:center;
gap:10px;
}

#backBtn{
background:#1e293b;
border:none;
color:white;
padding:10px 12px;
border-radius:10px;
cursor:pointer;
font-size:14px;
}

#lessonTitle{
font-size:15px;
color:#38bdf8;
font-weight:bold;
}

.rightNav{
display:flex;
align-items:center;
gap:10px;
}

#xpBox{
background:#1e293b;
padding:8px 12px;
border-radius:10px;
font-size:13px;
color:#38bdf8;
font-weight:bold;
}

.iconBtn{
width:80px;
height:40px;
border:none;
border-radius:10px;
cursor:pointer;
background:#1e293b;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:16px;
transition:0.2s;
}

.iconBtn:hover{
background:#38bdf8;
color:#020617;
}

#progressContainer{
height:6px;
background:#1e293b;
width:100%;
}

#progressBar{
height:100%;
width:0%;
background:linear-gradient(90deg,#38bdf8,#2563eb);
transition:0.3s;
}

main{
flex:1;
display:flex;
flex-direction:column;
padding:20px;
overflow:hidden;
}

#pageInfo{
font-size:12px;
color:#94a3b8;
margin-bottom:10px;
}

#lessonBox{
flex:1;
background:#0f172a;
border-radius:15px;
padding:20px;
display:flex;
flex-direction:column;
align-items:flex-start;
justify-content:flex-start;
overflow-y:auto;
}

#text{
font-size:18px;
line-height:1.8;
white-space:pre-wrap;
width:100%;
text-align:left;
}

#cursor{
color:#38bdf8;
font-weight:bold;
animation:blink 0.8s infinite;
}

@keyframes blink{
50%{opacity:0;}
}

footer{
height:80px;
display:flex;
align-items:center;
justify-content:space-between;
padding:10px 15px;
background:#0f172a;
border-top:1px solid rgba(255,255,255,0.08);
}

button.navBtn{
border:none;
padding:12px 18px;
border-radius:12px;
cursor:pointer;
font-size:14px;
width:48%;
}

#prev{
background:#1e293b;
color:white;
}

#next{
background:#38bdf8;
color:#020617;
font-weight:bold;
}

@media(max-width:600px){
#text{font-size:16px;}
#lessonTitle{font-size:13px;}
}
</style>
</head>

<body>

<header>
<div class="leftNav">
<button id="backBtn">← Back</button>
</div>
<div class="rightNav">
<div id="xpBox">XP: 0</div>
<button class="iconBtn" id="shareBtn">Share</button>
<button class="iconBtn" id="downloadBtn">Download</button>
</div>
</header>

<div id="progressContainer">
<div id="progressBar"></div>
</div>

<main>
<div id="pageInfo">Page 1</div>
<div id="lessonBox">
<div id="text"></div>
<div id="cursor">|</div>
</div>
</main>

<footer>
<button class="navBtn" id="prev">Previous</button>
<button class="navBtn" id="next">Next</button>
</footer>

<script type="module">
console.log("🚀 LESSON ENGINE - CLEAN TEST VERSION");

// DOM ELEMENTS
const textBox = document.getElementById("text");
const lessonTitle = document.getElementById("lessonTitle");
const nextBtn = document.getElementById("next");
const prevBtn = document.getElementById("prev");
const xpBox = document.getElementById("xpBox");
const progressBar = document.getElementById("progressBar");
const pageInfo = document.getElementById("pageInfo");
const shareBtn = document.getElementById("shareBtn");
const downloadBtn = document.getElementById("downloadBtn");
const backBtn = document.getElementById("backBtn");

// STATE
let course = "react";
let lesson = 8;
let lessonData = null;
let quizData = [];
let index = 0;
let typedText = "";
let userXP = 0;

// GET URL PARAMS
const params = new URLSearchParams(window.location.search);
course = params.get("course") || "react";
lesson = parseInt(params.get("lesson")) || 8;

// LOAD LESSON - DYNAMIC IMPORT NO FIREBASE
async function loadLesson() {
  try {
    const module = await import(`./${course}/lesson-${lesson}.js`);
    lessonData = module.lesson;

    if(!lessonData) throw new Error("Lesson object not found");

    lessonTitle.innerText = lessonData.title;
    startLesson();

  } catch (err) {
    console.error("Lesson load error:", err);
    textBox.innerText = `Error: Could not load ${course}/lesson-${lesson}.js\nMake sure:\n1. File exists\n2. Starts with 'export const lesson = {...}'`;
  }
}

// START LESSON
function startLesson() {
  index = 0;
  typedText = "";
  showNext();
}

// TYPEWRITER
async function typeText(text) {
  for (let i = 0; i < text.length; i++) {
    typedText += text[i];
    textBox.innerText = typedText;
    await new Promise(r => setTimeout(r, 18));
  }
}

// SHOW NEXT
async function showNext() {
  if (!lessonData) return;

  if (index >= lessonData.content.length) {
    textBox.innerText = "✅ Lesson Complete!\n\nClick 'Next' to load quiz or 'Back' to exit";
    return;
  }

  const sentence = lessonData.content[index];
  typedText = "";
  textBox.innerText = "";
  await typeText(sentence);
  index++;
  updateProgress();
}

// PROGRESS
function updateProgress() {
  const percent = Math.floor((index / lessonData.content.length) * 100);
  progressBar.style.width = percent + "%";
  pageInfo.innerText = `Page ${index} / ${lessonData.content.length}`;
}

// NAVIGATION
nextBtn.addEventListener("click", showNext);

prevBtn.addEventListener("click", () => {
  if (index <= 1) return;
  index -= 2;
  typedText = "";
  textBox.innerText = "";
  showNext();
});

backBtn.addEventListener("click", () => {
  window.history.back();
});

// DOWNLOAD
downloadBtn.addEventListener("click", () => {
  const blob = new Blob([typedText], { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${course}-lesson-${lesson}-page-${index}.txt`;
  a.click();
});

// SHARE
shareBtn.addEventListener("click", () => {
  alert("Share feature coming soon 🚀");
});

// START
loadLesson();
</script>
</body>
</html>
