<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050a14">
<title>Code Academy — Lesson</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#050a14;--panel:#0f182e;--panel2:#172344;--line:rgba(148,163,184,.13);--line2:rgba(148,163,184,.22);--text:#f1f5ff;--muted:#8fa0b8;--dim:#5a6a84;--cyan:#38bdf8;--violet:#a78bfa;--green:#22c55e;--red:#ff4567;--heart:#ff2e63;--top:62px;--hud:56px;--bot:74px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,sans-serif}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(1000px 600px at 20% -10%, rgba(56,189,248,.18), transparent 60%),radial-gradient(800px 600px at 90% 110%, rgba(167,139,250,.14), transparent 60%),var(--bg)}
/* LOADER */
#loader{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:.45s}
#loader.hide{opacity:0;pointer-events:none}
.loader-card{width:min(420px,92%);padding:28px;border-radius:28px;background:linear-gradient(180deg,#121c36,#0a1022);border:1px solid var(--line2);box-shadow:0 30px 90px rgba(0,0,0,.6);text-align:center}
.loader-logo{width:72px;height:72px;margin:0 auto 14px;border-radius:18px;overflow:hidden;border:1px solid var(--line2);box-shadow:0 0 30px rgba(56,189,248,.25)}
.loader-logo img{width:100%;height:100%;object-fit:cover}
.loader-bar{height:5px;background:rgba(255,255,255,.08);border-radius:99px;margin-top:18px;overflow:hidden}
.loader-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width.5s}
.loader-step{text-align:left;display:flex;gap:8px;font-size:11px;color:var(--dim);padding:6px 0}
.loader-step.active{color:var(--text)}.loader-step.done{color:var(--green)}
/* TOPBAR */
.topbar{position:absolute;top:0;left:0;right:0;height:var(--top);z-index:500;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(5,10,20,.86);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{width:38px;height:38px;border-radius:12px;overflow:hidden;border:1px solid var(--line2);background:#0f182e;flex:none}
.brand-logo img{width:100%;height:100%;object-fit:cover}
.brand-title{font-size:12px;font-weight:900;letter-spacing:.02em}
.brand-path{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.nav-actions{display:flex;gap:6px}
.nav-btn{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.18s}
.nav-btn.active{color:var(--cyan);background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.25)}
/* HUD */
.hud{position:absolute;top:var(--top);left:0;right:0;height:var(--hud);z-index:450;display:flex;align-items:center;gap:12px;padding:0 14px;background:rgba(5,10,20,.75);backdrop-filter:blur(16px);border-bottom:1px solid rgba(148,163,184,.08)}
.hearts{display:flex;gap:5px}
.heart{width:27px;height:27px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:rgba(255,46,99,.11);border:1px solid rgba(255,46,99,.18);color:var(--heart);font-size:11px;transition:.25s}
.heart.empty{background:rgba(255,255,255,.03);color:#3a455c;filter:grayscale(1)}
.hud-mid{flex:1}
.progress-track{width:100%;height:5px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width.3s}
.hud-right{font-size:10px;color:var(--muted);text-align:right;min-width:70px}
.hud-right strong{display:block;color:var(--text);font-size:12px}
/* STAGE */
.lesson-stage{position:absolute;left:0;right:0;top:calc(var(--top) + var(--hud));bottom:var(--bot);display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden}
.scene{width:min(920px,100%);height:100%;max-height:780px;display:flex;flex-direction:column;border-radius:26px;background:linear-gradient(180deg, rgba(19,30,57,.98), rgba(11,18,36,.99));border:1px solid var(--line);box-shadow:0 30px 90px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);overflow:hidden;position:relative;animation:in.35s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.scene::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg, transparent, var(--cyan), var(--violet), transparent);opacity:.8}
.scene-head{padding:20px 22px 14px;border-bottom:1px solid var(--line);flex:none}
.scene-meta{display:flex;justify-content:space-between;font-size:9px;font-weight:800;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.scene-title{margin-top:10px;font-size:clamp(22px,5vw,32px);font-weight:900;letter-spacing:-.03em;line-height:1.1}
.scene-body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden}
.content{width:min(760px,100%);max-height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:14px}
/* TEXT */
.text-card{padding:26px 24px;border-radius:20px;background:radial-gradient(400px 200px at 0% 0%, rgba(56,189,248,.08), transparent 60%), rgba(255,255,255,.03);border:1px solid var(--line)}
.text-kicker{font-size:9px;font-weight:800;color:var(--cyan);letter-spacing:.12em;display:flex;align-items:center;gap:8px;text-transform:uppercase;margin-bottom:14px}
.text-body{font-size:clamp(16px,3.9vw,21px);line-height:1.75;color:#e6ecf8;font-weight:500}
/* CODE */
.code-card{width:100%;border-radius:18px;overflow:hidden;background:#080c16;border:1px solid #1d2740;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.code-top{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#0e1526;border-bottom:1px solid #1d2740}
.code-content pre{margin:0;padding:16px;overflow:hidden}
.code-content code{font-family:JetBrains Mono,monospace;font-size:clamp(11px,2.8vw,13.5px);line-height:1.7;white-space:pre-wrap}
/* QUIZ - POWERFUL */
.quiz-badge{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:99px;background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.22);color:#c4b5fd;font-size:9px;font-weight:900;letter-spacing:.06em}
.quiz-q{padding:20px;border-radius:18px;background:linear-gradient(135deg, rgba(167,139,250,.14), rgba(56,189,248,.08));border:1px solid rgba(167,139,250,.22);font-size:clamp(18px,4.2vw,22px);font-weight:800;line-height:1.35}
.quiz-options{display:grid;gap:10px;margin-top:4px}
.quiz-option{width:100%;min-height:52px;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line);cursor:pointer;text-align:left;transition:.18s}
.quiz-option:hover{background:rgba(56,189,248,.06);border-color:rgba(56,189,248,.28);transform:translateY(-1px)}
.quiz-option.selected{border-color:var(--cyan);background:rgba(56,189,248,.11);box-shadow:0 0 0 4px rgba(56,189,248,.08)}
.quiz-option.correct{background:rgba(34,197,94,.12);border-color:var(--green)}
.quiz-option.wrong{background:rgba(255,69,103,.12);border-color:var(--red)}
.quiz-option.disabled{pointer-events:none}
.opt-letter{width:32px;height:32px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:11px;font-weight:900;color:var(--muted)}
.opt-text{font-size:13px;line-height:1.4;color:var(--text);flex:1}
.quiz-submit{width:100%;height:48px;margin-top:12px;border-radius:13px;background:linear-gradient(135deg,#fff,#e2e8f0);color:#050a14;font-weight:900;font-size:12px;border:none;cursor:pointer}
.quiz-submit:disabled{opacity:.3;pointer-events:none}
/* BOTTOM */
.bottom-nav{position:absolute;left:0;right:0;bottom:0;height:var(--bot);z-index:500;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 14px calc(6px + env(safe-area-inset-bottom));background:rgba(5,10,20,.92);backdrop-filter:blur(20px);border-top:1px solid var(--line)}
.btn{height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:12px;cursor:pointer;border:none;transition:.18s}
.btn-prev{width:100px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.btn-next{flex:1;max-width:280px;background:#fff;color:#050a14}
.btn:disabled{opacity:.25;pointer-events:none}
/* PANELS & MODALS */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1400;display:none}#overlay.active{display:block}
#historyPanel{position:fixed;top:0;right:-400px;width:380px;max-width:100%;height:100%;background:#050a14;z-index:1500;border-left:1px solid var(--line);transition:.32s;display:flex;flex-direction:column}#historyPanel.active{right:0}
.modal{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.7);backdrop-filter:blur(14px)}.modal.show{display:flex}
.modal-card{width:min(440px,100%);border-radius:24px;background:linear-gradient(180deg,#17223d,#0f172b);border:1px solid var(--line2);padding:22px;box-shadow:0 40px 100px rgba(0,0,0,.7)}
#measure{position:fixed;top:-9999px;left:-9999px;width:760px;visibility:hidden}
#toastBox{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:5000;width:min(360px,90%)}.toast{background:#10182e;border:1px solid rgba(56,189,248,.28);padding:12px 14px;border-radius:12px;display:flex;gap:8px;margin-top:8px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div id="app">
<div id="loader">
<div class="loader-card">
<div class="loader-logo"><img src="logo.png" alt=""></div>
<div style="font-size:20px;font-weight:900">Code <span style="background:linear-gradient(90deg,#38bdf8,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Academy</span></div>
<div class="loader-bar"><div class="loader-fill" id="loaderFill"></div></div>
<div id="loaderStatus" style="margin-top:10px;font-size:10px;color:#8fa0b8;font-weight:700">Initializing engine...</div>
<div id="loaderSteps" style="margin-top:14px"></div>
</div>
</div>

<div class="topbar">
<div class="brand"><div class="brand-logo"><img src="logo.png" alt=""></div><div><div class="brand-title" id="brandTitle">HTML • L1</div><div class="brand-path" id="brandPath">Loading engine...</div></div></div>
<div class="nav-actions">
<button class="nav-btn" id="voiceBtn" aria-label="Voice"><i class="fa-solid fa-volume-high"></i></button>
<button class="nav-btn" id="historyBtn" aria-label="History"><i class="fa-solid fa-clock-rotate-left"></i></button>
<button class="nav-btn" id="aiBtn" aria-label="AI Mentor"><i class="fa-solid fa-robot"></i></button>
<button class="nav-btn" id="shareBtn" aria-label="Share"><i class="fa-solid fa-share-nodes"></i></button>
<button class="nav-btn" id="exitBtn" aria-label="Exit"><i class="fa-solid fa-xmark"></i></button>
</div>
</div>

<div class="hud">
<div class="hearts" id="hearts"></div>
<div class="hud-mid"><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div><div id="progressLabel" style="margin-top:5px;font-size:8px;color:#5a6a84;font-weight:700;text-align:right">Page 1/1</div></div>
<div class="hud-right"><strong id="xpLive">0 XP</strong><span id="qualLive">0/0 XP</span></div>
</div>

<div class="lesson-stage" id="lessonStage"></div>

<div class="bottom-nav">
<button class="btn btn-prev" id="prevBtn"><i class="fa-solid fa-chevron-left"></i> Prev</button>
<button class="btn btn-next" id="nextBtn">Next <i class="fa-solid fa-chevron-right"></i></button>
</div>
</div>

<div id="overlay"></div>
<aside id="historyPanel">
<div style="padding:16px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)"><h3 style="font-size:14px"><i class="fa-solid fa-clock-rotate-left" style="color:#38bdf8"></i> History</h3><button id="closeHistory" style="width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:white">×</button></div>
<div style="padding:10px"><input id="historySearch" placeholder="Search..." style="width:100%;padding:11px;border-radius:11px;background:#0f182e;border:1px solid var(--line);color:white"></div>
<div id="historyList" style="flex:1;overflow:auto;padding:10px"></div>
</aside>

<div class="modal" id="exitModal"><div class="modal-card"><h3 style="font-weight:900">Leave Lesson?</h3><p style="font-size:12px;color:#8fa0b8;margin:10px 0;line-height:1.6">Your progress and quiz results are saved. Fresh start = Page 1 next time. Shared link keeps page.</p><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button id="stayBtn" class="btn btn-prev" style="width:auto;padding:0 18px">Stay</button><button id="confirmExit" class="btn btn-next" style="width:auto;padding:0 18px;background:#38bdf8">Exit</button></div></div></div>
<div class="modal" id="noHeartsModal"><div class="modal-card" style="text-align:center"><h3 style="color:#ff4567">0 / 5 Hearts</h3><p style="font-size:12px;color:#8fa0b8;margin:10px 0">1 heart every 6 min • Full in 30 min</p><div id="heartTimer" style="font-size:26px;font-weight:900;margin:14px 0">06:00</div><button id="refillBtn" class="btn btn-next" style="width:100%;background:linear-gradient(135deg,#38bdf8,#a78bfa)">Refill 200 XP + 100 Coins</button><button onclick="document.getElementById('noHeartsModal').classList.remove('show')" class="btn btn-prev" style="width:100%;margin-top:8px">Close</button></div></div>
<div class="modal" id="completeModal"><div class="modal-card" id="completeBox"></div></div>

<div id="measure"></div>
<div id="toastBox"></div>

<script type="module">
import { auth, db, onAuthStateChanged } from "./authentication.js";
import { doc, getDoc, runTransaction, serverTimestamp, collection, setDoc, query, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const params=new URLSearchParams(location.search);
let course=(params.get('course')||'html').toLowerCase().trim();
let lessonNum=parseInt(params.get('lesson')||'1');
let explicitPage=params.get('page')?parseInt(params.get('page')):null;
let fromParam=params.get('from');
const courseMap={html:'html',css:'css',javascript:'javascript',js:'javascript',python:'python',py:'python',react:'react'};
const baseCourse=courseMap[course]||course;
const dashboardMap={html:'html_dashboard.html',css:'css_dashboard.html',javascript:'javascript_dashboard.html',python:'python_dashboard.html',react:'react_dashboard.html'};

let currentUser=null,userData={},lessonJSON=null,pages=[],currentPage=0,totalXP=0,earnedXP=0,hearts=5,heartsDepletedAt=null,questionResults={},historyCache=[],isVoiceOn=false;

const el=id=>document.getElementById(id);
const stage=el('lessonStage'),measure=el('measure');

function toast(m){let b=el('toastBox');let d=document.createElement('div');d.className='toast';d.innerHTML=`<i class="fa-solid fa-bell" style="color:#38bdf8"></i><span>${m}</span>`;b.appendChild(d);setTimeout(()=>d.remove(),3800)}
function stepLog(t,pct,msg){
 el('loaderFill').style.width=pct+'%'; el('loaderStatus').textContent=msg;
 let c=el('loaderSteps'); let div=document.createElement('div'); div.className='loader-step active'; div.textContent='● '+t; c.appendChild(div);
}
function setHearts(){
 let h=el('hearts'); h.innerHTML=''; for(let i=0;i<5;i++){let d=document.createElement('div');d.className='heart'+(i>=hearts?' empty':'');d.textContent='♥';h.appendChild(d)}
 el('xpLive').textContent=earnedXP+' XP'; el('qualLive').textContent=`${earnedXP}/${totalXP}`;
 if(hearts<=0) el('noHeartsModal').classList.add('show');
}

onAuthStateChanged(auth, async user=>{
 stepLog('Auth check',20,'Checking login');
 if(!user){location.href='login.html';return}
 currentUser=user;
 stepLog('Profile load',40,'Loading profile');
 try{
  let snap=await getDoc(doc(db,'users',user.uid)); userData=snap.exists()?snap.data():{};
  hearts=userData.hearts??5; heartsDepletedAt=userData.heartsDepletedAt?.toMillis?.()||(userData.heartsDepletedAt?.seconds?userData.heartsDepletedAt.seconds*1000:null)||null;
  await handleRegen();
  stepLog('Lesson JSON',65,'Finding '+baseCourse+'_lesson_'+lessonNum+'.json');
  await loadLesson();
 }catch(e){ showError('Firebase: '+e.message)}
});

async function handleRegen(){
 if(hearts>=5||!heartsDepletedAt) return;
 let elapsed=Math.floor((Date.now()-heartsDepletedAt)/60000);
 let regen=Math.min(5, Math.floor(elapsed/6));
 if(regen>0){ hearts=Math.min(5,hearts+regen); if(hearts>=5) heartsDepletedAt=null; try{await setDoc(doc(db,'users',currentUser.uid),{hearts, heartsDepletedAt:hearts>=5?null:heartsDepletedAt},{merge:true})}catch{} toast(regen>=5?'Hearts fully restored':`+${regen} heart`); }
 if(hearts<5) setInterval(()=>{ let next=6*60*1000 - ((Date.now()-(heartsDepletedAt||Date.now()))%(6*60*1000)); let m=Math.floor(next/60000), s=Math.floor((next%60000)/1000); el('heartTimer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` },1000);
}

async function loadLesson(){
 // YOUR EXACT LOCATION - ROOT - html_lesson_1.json
 const variants=[
  `${baseCourse}_lesson_${lessonNum}.json`,
  `${baseCourse}_lesson_${lessonNum}.JSON`,
  `${baseCourse}_Lesson_${lessonNum}.json`,
  `${baseCourse}-lesson-${lessonNum}.json`,
  `${baseCourse}lesson${lessonNum}.json`,
  `${course}_lesson_${lessonNum}.json`,
  `${course}_Lesson_${lessonNum}.json`,
  `html_lesson_${lessonNum}.json`.replace('html',baseCourse),
  `${baseCourse}_${lessonNum}.json`
 ];
 for(let p of variants){
  try{ let r=await fetch(p,{cache:'no-store'}); if(r.ok){ lessonJSON=await r.json(); console.log('Found:',p); localStorage.setItem(`lesson_${baseCourse}_${lessonNum}`, JSON.stringify(lessonJSON)); break } }catch{}
 }
 if(!lessonJSON){ let cached=localStorage.getItem(`lesson_${baseCourse}_${lessonNum}`); if(cached) lessonJSON=JSON.parse(cached); }
 if(!lessonJSON){ showError(`Lesson not found. Tried:<br>${variants.join('<br>')}<br><br>Put your file as <b>${baseCourse}_lesson_${lessonNum}.json</b> in root (same folder as lesson.html)`); return }
 // preload next
 fetch(`${baseCourse}_lesson_${lessonNum+1}.json`).then(r=>r.ok&&r.json()).then(j=>{ if(j) localStorage.setItem(`lesson_${baseCourse}_${lessonNum+1}`, JSON.stringify(j)) }).catch(()=>{});
 stepLog('Normalize',80,'Parsing blocks');
 normalize();
 await loadResults();
 stepLog('Pack pages',95,'Intelligent packing');
 buildPages();
 currentPage=explicitPage? Math.max(0,Math.min(explicitPage-1,pages.length-1)) : 0;
 render(); setHearts();
 setTimeout(()=>el('loader').classList.add('hide'),350);
}

function normalize(){
 let blocks=[]; let src=lessonJSON.blocks||lessonJSON.content||lessonJSON.data||lessonJSON.lessons||lessonJSON;
 let arr=Array.isArray(src)? src : (Array.isArray(lessonJSON)? lessonJSON : []);
 if(arr.length===0 && (lessonJSON.title||lessonJSON.heading)) blocks.push({type:'heading', text:lessonJSON.title||lessonJSON.heading});
 for(let b of arr){
  if(!b) continue;
  if(b.heading||b.title) blocks.push({type:'heading', text:b.heading||b.title});
  if(b.text||b.content) blocks.push({type:'text', text:b.text||b.content});
  if(b.code||b.example) blocks.push({type:'code', code:b.code||b.example, language:b.language||b.lang||'html'});
  if(b.output) blocks.push({type:'output', text:b.output});
  if(b.tip) blocks.push({type:'tip', text:b.tip});
  if(b.note) blocks.push({type:'note', text:b.note});
  if(b.question||b.q){
   let q=b.question||b.q; let txt=typeof q==='string'? q : (b.question||b.text||'');
   let opts=b.options||b.choices||b.answers||[];
   if(typeof q==='object'&&q.question){ txt=q.question; opts=q.options||opts }
   let id=b.id||b.questionId||`q_${baseCourse}_${lessonNum}_${hash(txt)}`;
   blocks.push({type:'quiz', id, question:txt, options:opts, correctAnswer:b.correctAnswer??b.correct??b.answer??0, xp:b.xp||b.rewardXP||b.points||10, explanation:b.explanation||''});
  }
 }
 if(blocks.length===0 && lessonJSON.questions){ lessonJSON.questions.forEach((q,i)=>blocks.push({type:'quiz', id:q.id||`q_${baseCourse}_${lessonNum}_${i}`, question:q.question, options:q.options||[], correctAnswer:q.correctAnswer??0, xp:q.xp||10})) }
 lessonJSON._blocks=blocks;
 totalXP=blocks.filter(b=>b.type==='quiz').reduce((s,b)=>s+(b.xp||10),0);
 el('brandTitle').textContent=`${baseCourse.toUpperCase()} • L${lessonNum}`; el('brandPath').textContent=lessonJSON.title||`${baseCourse} lesson ${lessonNum}`;
}
function hash(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}return Math.abs(h).toString(36)}

async function loadResults(){
 try{ let snap=await getDoc(doc(db,'users',currentUser.uid)); if(!snap.exists()) return; let d=snap.data(); let key=`${baseCourse}_${lessonNum}`; let alt=`${course}_${lessonNum}`; questionResults=d.lessonQuestionResults?.[key]||d.lessonQuestionResults?.[alt]||{}; earnedXP=0; Object.values(questionResults).forEach(r=>{if(r.correct) earnedXP+=r.xpEarned||0}) }catch{}
}

function buildPages(){
 pages=[]; let cur=[]; let curH=0;
 let maxH=(el('lessonStage').clientHeight||700)-140;
 measure.style.width='760px';
 for(let b of lessonJSON._blocks){
  if(b.type==='quiz'){ if(cur.length){pages.push(cur); cur=[]; curH=0} pages.push([b]); continue }
  let tmp=document.createElement('div'); tmp.innerHTML=renderBlock(b,true); measure.appendChild(tmp);
  let h=tmp.getBoundingClientRect().height+18; measure.innerHTML='';
  if(h>maxH && b.type==='code'){ let lines=b.code.split('\n'); for(let i=0;i<lines.length;i+=14){ pages.push([{type:'code', code:lines.slice(i,i+14).join('\n'), language:b.language}]) } continue }
  if(curH+h>maxH && cur.length>0){ pages.push(cur); cur=[b]; curH=h } else { cur.push(b); curH+=h }
 }
 if(cur.length) pages.push(cur);
}

function renderBlock(b, measuring=false){
 if(b.type==='heading') return `<div class="text-card" style="text-align:center"><div class="text-kicker" style="justify-content:center"><i class="fa-solid fa-sparkles"></i> LESSON ${lessonNum}</div><div style="font-size:clamp(24px,6vw,36px);font-weight:900;letter-spacing:-.04em">${esc(b.text)}</div></div>`;
 if(b.type==='text') return `<div class="text-card"><div class="text-kicker"><i class="fa-solid fa-book-open"></i> LEARN</div><div class="text-body">${esc(b.text)}</div></div>`;
 if(b.type==='tip') return `<div class="text-card" style="border-left:3px solid #38bdf8;background:rgba(56,189,248,.06)"><div class="text-kicker"><i class="fa-solid fa-lightbulb"></i> TIP</div><div style="font-size:14px;line-height:1.6">${esc(b.text)}</div></div>`;
 if(b.type==='note') return `<div class="text-card" style="border-left:3px solid #a78bfa;background:rgba(167,139,250,.06)"><div class="text-kicker"><i class="fa-solid fa-circle-info"></i> NOTE</div><div style="font-size:14px;line-height:1.6">${esc(b.text)}</div></div>`;
 if(b.type==='code') return `<div class="code-card"><div class="code-top"><div style="display:flex;align-items:center;gap:7px"><span style="width:10px;height:10px;border-radius:50%;background:#ff5f57"></span><span style="width:10px;height:10px;border-radius:50%;background:#febc2e"></span><span style="width:10px;height:10px;border-radius:50%;background:#28c840"></span><span style="margin-left:8px;font-family:JetBrains Mono;font-size:9px;color:#8fa0b8;text-transform:uppercase">${esc(b.language||'code')}</span></div><div style="display:flex;gap:6px"><button onclick="window.copyCode('${encodeURIComponent(b.code)}')" style="padding:7px 10px;border-radius:9px;background:#1a2338;border:1px solid #2a3655;color:#8fa0b8;font-size:10px;font-weight:700">Copy</button><button onclick="window.previewCode('${encodeURIComponent(b.code)}')" style="padding:7px 10px;border-radius:9px;background:#1a2338;border:1px solid #2a3655;color:#8fa0b8;font-size:10px;font-weight:700">Preview</button></div></div><div class="code-content"><pre><code>${esc(b.code)}</code></pre></div></div>`;
 if(b.type==='output') return `<div style="width:100%;border-radius:18px;background:#07140e;border:1px solid rgba(34,197,94,.18)"><div style="height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;color:#4ade80;background:rgba(34,197,94,.07);font-size:10px;font-weight:800"><i class="fa-solid fa-terminal"></i> OUTPUT</div><div style="padding:16px;color:#bbf7d0;font-family:JetBrains Mono;font-size:12px;white-space:pre-wrap">${esc(b.text)}</div></div>`;
 if(b.type==='quiz'){
  let saved=questionResults[b.id]; let letters=['A','B','C','D','E','F'];
  let opts=(b.options||[]).map((o,i)=>{ let st=''; if(saved){ if(i===saved.correctIndex) st=' correct'; else if(i===saved.selectedIndex&&!saved.correct) st=' wrong'; } return `<button class="quiz-option ${saved?'disabled':''}${st}" data-qid="${b.id}" data-idx="${i}" aria-label="Option ${letters[i]}"><div class="opt-letter">${letters[i]}</div><div class="opt-text">${esc(typeof o==='string'?o:o.text||o)}</div></button>`}).join('');
  return `<div style="width:100%"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span class="quiz-badge"><i class="fa-solid fa-bolt"></i> QUESTION • ${b.xp||10} XP</span><span style="font-size:10px;color:#facc15;font-weight:800">${saved? (saved.correct? '+'+saved.xpEarned+' XP' : '-1 ♥') : ''}</span></div><div class="quiz-q">${esc(b.question)}</div><div class="quiz-options" style="margin-top:12px">${opts}</div>${saved? `<div style="margin-top:12px;padding:12px;border-radius:12px;font-size:11px;background:${saved.correct?'rgba(34,197,94,.1)':'rgba(255,69,103,.1)'};border:1px solid ${saved.correct?'rgba(34,197,94,.2)':'rgba(255,69,103,.2)'};color:${saved.correct?'#bbf7d0':'#fecaca'}">${saved.correct? '✓ Correct +'+saved.xpEarned+' XP' : '✗ Incorrect -1 Heart'} ${b.explanation? '• '+b.explanation:''}</div>` : `<button class="quiz-submit" disabled style="opacity:.3">Select an answer</button>`}</div>`;
 }
 return '';
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function render(){
 if(!pages.length) return;
 let page=pages[currentPage];
 let html=`<div class="scene"><div class="scene-head"><div class="scene-meta"><span><i class="fa-solid fa-layer-group" style="color:#38bdf8"></i> ${baseCourse.toUpperCase()} • LESSON ${lessonNum}</span><span>PAGE ${currentPage+1} / ${pages.length}</span></div><div class="scene-title">${lessonJSON.title||`Lesson ${lessonNum}`}</div></div><div class="scene-body"><div class="content">${page.map(b=>renderBlock(b)).join('')}</div></div></div>`;
 stage.innerHTML=html;
 el('progressFill').style.width=((currentPage+1)/pages.length*100)+'%'; el('progressLabel').textContent=`Page ${currentPage+1} of ${pages.length}`;
 el('prevBtn').disabled=currentPage===0;
 let hasUnanswered=page.some(b=>b.type==='quiz'&&!questionResults[b.id]);
 el('nextBtn').disabled= hasUnanswered && hearts>0;
 setTimeout(()=>{ stage.querySelectorAll('pre code').forEach(c=>hljs.highlightElement(c)) },20);
 stage.querySelectorAll('.quiz-option').forEach(btn=>{
  btn.addEventListener('click',()=>{
   stage.querySelectorAll('.quiz-option').forEach(b=>b.classList.remove('selected'));
   btn.classList.add('selected');
   let sub=stage.querySelector('.quiz-submit'); if(sub){ sub.disabled=false; sub.style.opacity='1'; sub.textContent='Submit Answer'; sub.onclick=()=>handleAnswer(btn.dataset.qid, parseInt(btn.dataset.idx)) }
  });
 });
 if(currentPage===pages.length-1 && lessonJSON._blocks.filter(b=>b.type==='quiz').every(b=>questionResults[b.id])) showComplete();
}

async function handleAnswer(qId, idx){
 if(questionResults[qId]||hearts<=0) return;
 let block=lessonJSON._blocks.find(b=>b.id===qId); if(!block) return;
 let correctIdx=typeof block.correctAnswer==='number'? block.correctAnswer : 0;
 // try to find correct if options have correct flag
 if(block.options&&block.options.some(o=>typeof o==='object'&&o.correct)){ correctIdx=block.options.findIndex(o=>o.correct) }
 let isCorrect=idx===correctIdx; let xpEarn=isCorrect?(block.xp||10):0;
 try{
  await runTransaction(db, async(tx)=>{
   let ref=doc(db,'users',currentUser.uid); let snap=await tx.get(ref); if(!snap.exists()) throw 'No user';
   let data=snap.data(); let key=`${baseCourse}_${lessonNum}`; if(data.lessonQuestionResults?.[key]?.[qId]) throw 'Already';
   let newHearts=data.hearts??hearts; let newXP=data.xp??0;
   if(isCorrect) newXP+=xpEarn; else newHearts=Math.max(0,newHearts-1);
   let newResults={...(data.lessonQuestionResults||{})}; if(!newResults[key]) newResults[key]={};
   newResults[key][qId]={answered:true, correct:isCorrect, xpEarned:xpEarn, selectedIndex:idx, correctIndex:correctIdx, question:block.question, createdAt:serverTimestamp()};
   let upd={hearts:newHearts, xp:newXP, lessonQuestionResults:newResults};
   if(newHearts===0) upd.heartsDepletedAt=serverTimestamp();
   let histRef=doc(collection(db,'users',currentUser.uid,'lessonHistory'));
   tx.set(histRef,{course:baseCourse, lesson:lessonNum, questionId:qId, question:block.question, selected:idx, correct:correctIdx, isCorrect, xpEarned:xpEarn, heartsAfter:newHearts, createdAt:serverTimestamp()});
   tx.update(ref, upd);
  });
  questionResults[qId]={correct:isCorrect, xpEarned:xpEarn, selectedIndex:idx, correctIndex:correctIdx};
  if(isCorrect){ earnedXP+=xpEarn; toast(`✓ Correct +${xpEarn} XP`)} else { hearts=Math.max(0,hearts-1); toast('✗ Incorrect -1 Heart'); if(hearts===0) heartsDepletedAt=Date.now(); }
  setHearts(); render();
 }catch(e){ if(String(e).includes('Already')){ toast('Already answered'); render() } else toast('Save failed: '+e) }
}

el('nextBtn').addEventListener('click',()=>{ if(currentPage<pages.length-1){ currentPage++; render(); stopVoice() } });
el('prevBtn').addEventListener('click',()=>{ if(currentPage>0){ currentPage--; render(); stopVoice() } });
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT') return; if(e.key==='ArrowRight') el('nextBtn').click(); if(e.key==='ArrowLeft') el('prevBtn').click(); if(e.key.toLowerCase()==='h') el('historyBtn').click(); if(e.key.toLowerCase()==='v') el('voiceBtn').click(); if(e.key==='Escape'){ el('exitModal').classList.remove('show'); el('noHeartsModal').classList.remove('show'); closeHist() } });

el('exitBtn').addEventListener('click',()=>el('exitModal').classList.add('show'));
el('stayBtn').addEventListener('click',()=>el('exitModal').classList.remove('show'));
el('confirmExit').addEventListener('click',()=>{ let dash=dashboardMap[baseCourse]||'course.html'; let url=fromParam &&!fromParam.includes('http')&&!fromParam.includes('..')? fromParam : dash; location.href=url });

el('voiceBtn').addEventListener('click',()=>{ if(isVoiceOn) stopVoice(); else startVoice() });
function startVoice(){
 let txt=pages[currentPage].map(b=>b.text||b.question||'').join('. '); if(!txt) return;
 stopVoice(); isVoiceOn=true; el('voiceBtn').classList.add('active');
 let chunks=txt.match(/[^.!?]+[.!?]+/g)||[txt]; let i=0;
 function nxt(){ if(i>=chunks.length||!isVoiceOn){stopVoice(); return} let u=new SpeechSynthesisUtterance(chunks[i].trim()); let vs=speechSynthesis.getVoices(); let en=vs.find(v=>v.lang.startsWith('en'))||vs[0]; if(en) u.voice=en; u.onend=()=>{i++; nxt()}; speechSynthesis.speak(u) }
 nxt();
}
function stopVoice(){ isVoiceOn=false; el('voiceBtn').classList.remove('active'); speechSynthesis.cancel() }

el('shareBtn').addEventListener('click', async()=>{
 let url=`${location.origin}${location.pathname}?course=${course}&lesson=${lessonNum}&page=${currentPage+1}`+(fromParam?`&from=${fromParam}`:'');
 let code=userData.referralCode||''; let text=`Learn ${baseCourse.toUpperCase()} L${lessonNum} on Code Academy! ${url} ${code?'Code: '+code:''}`;
 try{ if(navigator.share){ await navigator.share({title:'Code Academy', text, url}) } else { await navigator.clipboard.writeText(url); toast('Share link copied') } }catch{ await navigator.clipboard.writeText(url); toast('Share link copied') }
});
el('aiBtn').addEventListener('click',()=>toast('AI Mentor — Coming soon'));

el('historyBtn').addEventListener('click',()=>{ el('historyPanel').classList.add('active'); el('overlay').classList.add('active'); loadHist() });
el('closeHistory').addEventListener('click',closeHist); el('overlay').addEventListener('click',closeHist);
function closeHist(){ el('historyPanel').classList.remove('active'); el('overlay').classList.remove('active') }
async function loadHist(){ try{ let q=query(collection(db,'users',currentUser.uid,'lessonHistory'), limit(100)); let snap=await getDocs(q); let items=snap.docs.map(d=>d.data()).filter(d=>d.course===baseCourse&&d.lesson===lessonNum); historyCache=items; renderHist(items) }catch{ el('historyList').innerHTML='<div style="color:#ff4567;font-size:11px">Failed</div>' } }
function renderHist(items){
 let s=(el('historySearch').value||'').toLowerCase(); let f=items.filter(i=>!s||(i.question||'').toLowerCase().includes(s));
 el('historyList').innerHTML=f.map(i=>`<div style="background:#0f182e;padding:11px;border-radius:12px;margin-bottom:8px;border:1px solid var(--line)"><div style="font-size:11px;font-weight:700">${esc(i.question||'').slice(0,90)}</div><div style="font-size:10px;color:${i.isCorrect?'#22c55e':'#ff4567'};margin-top:4px">${i.isCorrect?'✓ Correct +'+(i.xpEarned||0)+' XP':'✗ Wrong'}</div></div>`).join('')||'<div style="text-align:center;color:#5a6a84;padding:20px;font-size:11px">No history</div>';
}
el('historySearch').addEventListener('input',()=>renderHist(historyCache));

el('refillBtn').addEventListener('click', async()=>{
 if((userData.xp||0)<200||(userData.coins||0)<100){ toast('Need 200 XP + 100 Coins'); return }
 try{ await runTransaction(db, async(tx)=>{ let ref=doc(db,'users',currentUser.uid); let snap=await tx.get(ref); let d=snap.data(); if(d.xp<200||d.coins<100) throw 'No funds'; tx.update(ref,{xp:d.xp-200, coins:d.coins-100, hearts:5, heartsDepletedAt:null}) }); hearts=5; setHearts(); el('noHeartsModal').classList.remove('show'); toast('♥ Hearts restored') }catch(e){ toast('Refill failed: '+e) }
});

function showComplete(){
 let need=Math.ceil(totalXP/2); let qual=earnedXP>=need;
 el('completeBox').innerHTML=`<h2 style="font-weight:900">${qual?'Lesson Complete 🎉':'Not Qualified'}</h2><div style="margin:14px 0;font-size:13px;line-height:1.7"><div>Earned: <b style="color:#38bdf8">${earnedXP} XP</b> / ${totalXP}</div><div>Required: <b>${need} XP</b></div><div style="margin-top:8px;color:${qual?'#22c55e':'#ff4567'};font-weight:700">${qual?'Qualified for next lesson!':'Need more XP'}</div></div><div style="display:flex;gap:8px;margin-top:18px"><button onclick="location.href='lesson.html?course=${baseCourse}&lesson=${lessonNum+1}'" style="flex:1;padding:12px;border-radius:12px;background:${qual?'#fff':'#1a2338'};color:${qual?'#050a14':'white'};font-weight:900;border:none">${qual?'Next Lesson':'Repeat'}</button><button onclick="location.href='${fromParam&&!fromParam.includes('http')? fromParam : dashboardMap[baseCourse]||'course.html'}'" style="padding:12px 16px;border-radius:12px;background:#0f182e;color:white;border:1px solid var(--line);font-weight:800">Dashboard</button></div>`;
 el('completeModal').classList.add('show');
 (async()=>{ try{ let ref=doc(db,'users',currentUser.uid); await setDoc(ref,{[`progress.${baseCourse}.${lessonNum}`]:{earnedXP,totalXP,thresholdXP:need,qualified:qual,completed:true,updatedAt:serverTimestamp()}},{merge:true}) }catch{} })();
}

function showError(m){ el('loader').classList.add('hide'); stage.innerHTML=`<div class="scene" style="align-items:center;justify-content:center;text-align:center;padding:30px"><i class="fa-solid fa-triangle-exclamation" style="font-size:36px;color:#ff4567"></i><h3 style="margin-top:14px;font-weight:900">Lesson couldn't be loaded</h3><p style="font-size:12px;color:#8fa0b8;margin-top:10px;line-height:1.6">${m}</p><button onclick="location.href='${dashboardMap[baseCourse]||'course.html'}'" style="margin-top:18px;padding:11px 18px;border-radius:11px;background:#38bdf8;color:#050a14;font-weight:900;border:none">Return to Dashboard</button></div>` }

window.copyCode=async(c)=>{ try{ await navigator.clipboard.writeText(decodeURIComponent(c)); toast('✓ Code copied') }catch{ toast('Copy failed') } }
window.previewCode=(c)=>{ let code=decodeURIComponent(c); let w=window.open(); w.document.write(`<html><body style="margin:0;padding:20px;background:#050a14;color:#f1f5ff;font-family:JetBrains Mono;white-space:pre-wrap">${esc(code)}</body></html>`) }

let ro=new ResizeObserver(()=>{ if(lessonJSON){ buildPages(); if(currentPage>=pages.length) currentPage=pages.length-1; render() } }); ro.observe(el('lessonStage'));
</script>
</body>
</html>
