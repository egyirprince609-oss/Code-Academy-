<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<title>Code Academy — Lesson Engine</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo.png">
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#070b16;--panel:#11182b;--panel2:#17213a;--text:#f1f5ff;--muted:#8d98ad;--dim:#59657b;--primary:#38bdf8;--primary2:#818cf8;--purple:#a855f7;--success:#22c55e;--danger:#ff4567;--heart:#ff2e63;--line:rgba(148,163,184,.12);--line2:rgba(148,163,184,.22);--code:#0b0f16;--top:64px;--bottom:76px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,sans-serif;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(900px 500px at 10% -10%, rgba(56,189,248,.14), transparent 65%),radial-gradient(700px 500px at 100% 100%, rgba(129,140,248,.10), transparent 65%),var(--bg)}
#loader{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(700px 500px at 50% 0%, rgba(56,189,248,.15), transparent 70%),var(--bg);transition:opacity.4s}
#loader.hide{opacity:0;pointer-events:none}
.loader-orbit{position:absolute;width:280px;height:280px;border-radius:50%;border:1px solid rgba(56,189,248,.10);animation:orbit 8s linear infinite}
.loader-orbit::before{content:"";position:absolute;width:6px;height:6px;top:20px;left:50%;border-radius:50%;background:var(--primary);box-shadow:0 0 25px rgba(56,189,248,.8)}
@keyframes orbit{to{transform:rotate(360deg)}}
.loader-card{position:relative;z-index:2;width:min(430px,100%);padding:28px 22px;border-radius:28px;background:linear-gradient(180deg, rgba(20,29,51,.96), rgba(10,16,32,.98));border:1px solid var(--line2);text-align:center;box-shadow:0 40px 100px rgba(0,0,0,.65)}
.loader-logo{width:76px;height:76px;margin:0 auto 15px;border-radius:21px;overflow:hidden;background:#0d1425;border:1px solid var(--line2)}
.loader-logo img{width:100%;height:100%;object-fit:cover}
.loader-title{font-size:20px;font-weight:900}.loader-title span{background:linear-gradient(90deg,var(--primary),var(--primary2),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.loader-progress{height:5px;margin-top:20px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.06)}.loader-fill{width:0;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2),var(--purple));transition:width.5s}
.loader-step{display:flex;gap:10px;padding:7px 3px;color:var(--dim);font-size:11px}.loader-step.active{color:var(--text)}.loader-step.done{color:var(--success)}
.topbar{position:absolute;left:0;right:0;top:0;z-index:500;height:var(--top);display:flex;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top) 12px 0 12px;background:rgba(7,11,22,.88);backdrop-filter:blur(22px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;min-width:0}.brand-logo{width:37px;height:37px;border-radius:11px;overflow:hidden;background:var(--panel);border:1px solid var(--line);flex:none}.brand-logo img{width:100%;height:100%;object-fit:cover}
.brand-title{font-size:11px;font-weight:900}.brand-path{max-width:150px;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-actions{display:flex;gap:5px}.nav-btn{width:35px;height:35px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--muted);background:rgba(255,255,255,.045);border:1px solid var(--line);cursor:pointer}.nav-btn.active{color:var(--primary);background:rgba(56,189,248,.08);border-color:rgba(56,189,248,.24)}
.hud{position:absolute;left:0;right:0;top:var(--top);z-index:450;height:57px;display:flex;align-items:center;gap:9px;padding:7px 12px;background:rgba(7,11,22,.80);backdrop-filter:blur(18px);border-bottom:1px solid rgba(148,163,184,.07)}
.hearts{display:flex;gap:4px}.heart{width:25px;height:25px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--heart);background:rgba(255,46,99,.09);border:1px solid rgba(255,46,99,.16);font-size:10px;transition:.25s}.heart.empty{color:#4d5668;background:rgba(255,255,255,.025);filter:grayscale(1)}
.lesson-progress{flex:1}.progress-track{width:100%;height:4px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));transition:width.3s}
.lesson-stage{position:absolute;left:0;right:0;top:calc(var(--top) + 57px);bottom:var(--bottom);display:flex;align-items:center;justify-content:center;padding:10px 12px;overflow:hidden}
.scene{position:relative;width:min(900px,100%);height:100%;max-height:760px;display:flex;flex-direction:column;overflow:hidden;border-radius:24px;background:linear-gradient(180deg, rgba(18,26,47,.97), rgba(11,17,33,.98));border:1px solid var(--line);box-shadow:0 25px 80px rgba(0,0,0,.35);animation:sceneIn.35s}
@keyframes sceneIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.scene-header{padding:18px 20px 13px;border-bottom:1px solid var(--line);flex:none}
.scene-meta{display:flex;justify-content:space-between;font-size:9px;color:var(--dim);font-weight:700}
.scene-title{margin-top:10px;font-size:clamp(21px,5vw,31px);font-weight:900;letter-spacing:-.03em}
.scene-body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:18px;overflow:hidden}
.content{width:min(760px,100%);max-height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.text-scene{padding:26px 22px;border-radius:20px;background:rgba(255,255,255,.025);border:1px solid var(--line)}
.text-body{color:#e1e7f3;font-size:clamp(16px,3.8vw,20px);line-height:1.75;font-weight:500}
.code-scene{width:100%;border-radius:17px;background:var(--code);border:1px solid #1e2633;overflow:hidden}
.code-top{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#111720;border-bottom:1px solid #1e2633}
.code-content pre{margin:0;padding:15px;overflow:hidden}.code-content code{display:block;font-family:JetBrains Mono,monospace;font-size:clamp(11px,2.7vw,13px);line-height:1.65;white-space:pre-wrap}
.quiz-scene{width:100%}.quiz-badge{display:inline-flex;gap:6px;padding:6px 9px;border-radius:99px;color:#c4b5fd;background:rgba(139,92,246,.10);border:1px solid rgba(139,92,246,.18);font-size:9px;font-weight:900}
.quiz-question{padding:18px;border-radius:16px;background:linear-gradient(135deg, rgba(129,140,248,.10), rgba(56,189,248,.045));border:1px solid rgba(129,140,248,.17)}
.quiz-question-text{font-size:clamp(17px,4vw,21px);font-weight:800}
.quiz-options{display:grid;gap:8px;margin-top:11px}.quiz-option{width:100%;min-height:47px;display:flex;align-items:center;gap:10px;padding:10px;border-radius:13px;background:rgba(255,255,255,.025);border:1px solid var(--line);cursor:pointer;text-align:left;transition:.16s}
.quiz-option:hover{border-color:rgba(56,189,248,.24);transform:translateY(-1px)}.quiz-option.selected{border-color:var(--primary);box-shadow:0 0 0 3px rgba(56,189,248,.07)}.quiz-option.correct{background:rgba(34,197,94,.10);border-color:var(--success)}.quiz-option.wrong{background:rgba(255,69,103,.10);border-color:var(--danger)}.quiz-option.disabled{pointer-events:none}
.option-letter{width:29px;height:29px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:rgba(255,255,255,.055);border:1px solid var(--line);font-size:10px;font-weight:900;flex:none}
.bottom-nav{position:absolute;left:0;right:0;bottom:0;z-index:500;height:var(--bottom);display:flex;align-items:center;justify-content:center;gap:9px;padding:6px 12px calc(6px + env(safe-area-inset-bottom));background:rgba(7,11,22,.92);backdrop-filter:blur(20px);border-top:1px solid var(--line)}
.bottom-button{height:43px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:11px;font-weight:900;cursor:pointer}
.prev-button{width:92px;color:var(--muted);background:var(--panel);border:1px solid var(--line)}.next-button{flex:1;max-width:260px;color:#06111c;background:#fff;border:1px solid #fff}.bottom-button:disabled{opacity:.25;pointer-events:none}
.modal{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.72);backdrop-filter:blur(13px)}.modal.show{display:flex}
.modal-card{width:min(440px,100%);max-height:90dvh;overflow:hidden;border-radius:22px;background:linear-gradient(180deg, #17223d, #0f172b);border:1px solid var(--line2);box-shadow:0 35px 100px rgba(0,0,0,.7)}
#historyPanel{position:fixed;top:0;right:-420px;width:380px;max-width:100%;height:100%;background:#070b16;z-index:1500;transition:.3s;border-left:1px solid var(--line);display:flex;flex-direction:column}#historyPanel.active{right:0}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1400;display:none}#overlay.active{display:block}
#measure{position:fixed;top:-9999px;left:-9999px;width:780px;visibility:hidden}
#toastBox{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:4000;width:min(360px,90%)}.toast{background:#11182b;border:1px solid rgba(56,189,248,.25);padding:12px;border-radius:12px;display:flex;gap:8px;margin-top:8px;font-size:12px}
</style>
</head>
<body>
<div id="app">
<div id="loader">
<div class="loader-orbit"></div>
<div class="loader-card">
<div class="loader-logo"><img src="logo.png" alt=""></div>
<div class="loader-title">Code <span>Academy</span></div>
<div class="loader-progress"><div class="loader-fill" id="loaderFill"></div></div>
<div id="loaderStatus" style="margin-top:9px;color:#8d98ad;font-size:10px;font-weight:700">Initializing...</div>
<div id="loaderSteps" style="margin-top:12px;text-align:left"></div>
</div>
</div>

<div class="topbar">
<div class="brand"><div class="brand-logo"><img src="logo.png" alt=""></div><div><div class="brand-title" id="brandTitle">HTML • Lesson 1</div><div class="brand-path" id="brandPath">Loading lesson engine...</div></div></div>
<div class="nav-actions">
<button class="nav-btn" id="voiceBtn" aria-label="Voice"><i class="fa-solid fa-volume-high"></i></button>
<button class="nav-btn" id="historyBtn" aria-label="History"><i class="fa-solid fa-clock-rotate-left"></i></button>
<button class="nav-btn" id="aiBtn" aria-label="AI Mentor"><i class="fa-solid fa-robot"></i></button>
<button class="nav-btn" id="shareBtn" aria-label="Share"><i class="fa-solid fa-share-nodes"></i></button>
<button class="nav-btn" id="exitBtn" aria-label="Exit"><i class="fa-solid fa-xmark"></i></button>
</div>
</div>

<div class="hud">
<div class="hearts" id="hearts"></div>
<div style="min-width:52px;font-size:9px;color:#8d98ad"><strong id="xpLive" style="display:block;color:#f1f5ff;font-size:11px">0 XP</strong><span id="qualLive">0/0</span></div>
<div class="lesson-progress"><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div><div id="progressLabel" style="margin-top:4px;text-align:right;color:#59657b;font-size:8px">Page 1/1</div></div>
</div>

<div class="lesson-stage" id="lessonStage"></div>

<div class="bottom-nav">
<button class="bottom-button prev-button" id="prevBtn" disabled><i class="fa-solid fa-chevron-left"></i> Prev</button>
<button class="bottom-button next-button" id="nextBtn">Next <i class="fa-solid fa-chevron-right"></i></button>
</div>
</div>

<div id="overlay"></div>
<aside id="historyPanel">
<div style="padding:16px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)"><h3 style="font-size:14px"><i class="fa-solid fa-clock-rotate-left" style="color:#38bdf8"></i> History</h3><button id="closeHistory" style="width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:white">×</button></div>
<div style="padding:10px"><input id="historySearch" placeholder="Search questions..." style="width:100%;padding:10px;border-radius:10px;background:#11182b;border:1px solid var(--line);color:white"></div>
<div id="historyList" style="flex:1;overflow:auto;padding:10px"></div>
</aside>

<div class="modal" id="exitModal" role="dialog"><div class="modal-card" style="padding:20px"><h3>Leave Lesson?</h3><p style="font-size:12px;color:#8d98ad;margin:10px 0">Progress is saved. You will start from Page 1 next time unless opened via shared link.</p><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button id="stayBtn" style="padding:10px 16px;border-radius:10px;background:#11182b;color:white;border:1px solid var(--line)">Stay</button><button id="confirmExit" style="padding:10px 16px;border-radius:10px;background:#38bdf8;color:#070b16;font-weight:800">Exit</button></div></div></div>
<div class="modal" id="noHeartsModal" role="dialog"><div class="modal-card" style="padding:20px;text-align:center"><h3 style="color:#ff4567">0 / 5 Hearts</h3><p style="font-size:12px;color:#8d98ad;margin:10px 0">Next heart regenerates every 6 min</p><div id="heartTimer" style="font-size:22px;font-weight:900;margin:10px 0">06:00</div><button id="refillBtn" style="width:100%;padding:12px;border-radius:12px;background:#38bdf8;color:#070b16;font-weight:800">Refill 200 XP + 100 Coins</button><button onclick="document.getElementById('noHeartsModal').classList.remove('show')" style="width:100%;padding:10px;margin-top:8px;border-radius:10px;background:#11182b;color:white;border:1px solid var(--line)">Close</button></div></div>
<div class="modal" id="completeModal" role="dialog"><div class="modal-card" style="padding:20px" id="completeBox"></div></div>
<div id="measure"></div>
<div id="toastBox"></div>

<script type="module">
import { auth, db, onAuthStateChanged } from "./authentication.js";
import { doc, getDoc, runTransaction, serverTimestamp, collection, setDoc, query, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const params=new URLSearchParams(location.search);
let course=(params.get('course')||'html').toLowerCase();
let lessonNum=parseInt(params.get('lesson')||'1');
let explicitPage=params.get('page')?parseInt(params.get('page')):null;
let fromParam=params.get('from');
const courseMap={html:'html',css:'css',javascript:'js',js:'js',python:'py',py:'py',react:'react'};
const folder=courseMap[course]||'html';
const dashboardMap={html:'html_dashboard.html',css:'css_dashboard.html',js:'javascript_dashboard.html',javascript:'javascript_dashboard.html',py:'python_dashboard.html',python:'python_dashboard.html',react:'react_dashboard.html'};

let currentUser=null,userData={},lessonJSON=null,pages=[],currentPage=0,totalXP=0,earnedXP=0,hearts=5,heartsDepletedAt=null,questionResults={},historyCache=[];
let isVoiceOn=false;

const el=id=>document.getElementById(id);
const stage=el('lessonStage'),measure=el('measure'),progressFill=el('progressFill'),progressLabel=el('progressLabel');

function toast(m){let b=el('toastBox');let d=document.createElement('div');d.className='toast';d.innerHTML=`<i class="fa-solid fa-bell" style="color:#38bdf8"></i><span>${m}</span>`;b.appendChild(d);setTimeout(()=>d.remove(),3500)}
function setLoader(step,pct,msg){
 el('loaderFill').style.width=pct+'%'; el('loaderStatus').textContent=msg;
 let c=el('loaderSteps'); let div=document.createElement('div'); div.className='loader-step active'; div.innerHTML=`<span style="width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.2)">●</span> ${step}`; c.appendChild(div);
}
function setHeartsUI(){
 let h=el('hearts'); h.innerHTML=''; for(let i=0;i<5;i++){let s=document.createElement('div');s.className='heart'+(i>=hearts?' empty':'');s.textContent='♥';h.appendChild(s)} el('xpLive').textContent=earnedXP+' XP'; el('qualLive').textContent=`${earnedXP}/${totalXP}`;
 if(hearts<=0) el('noHeartsModal').classList.add('show');
}

// AUTH
onAuthStateChanged(auth, async user=>{
 setLoader('Checking authentication...',20,'Auth');
 if(!user){location.href='login.html';return}
 currentUser=user;
 setLoader('Loading user profile...',40,'Firestore');
 try{
  let snap=await getDoc(doc(db,'users',user.uid)); userData=snap.exists()?snap.data():{};
  hearts=userData.hearts??5; heartsDepletedAt=userData.heartsDepletedAt?.toMillis?.()||userData.heartsDepletedAt?.seconds*1000||null;
  await handleHeartRegen();
  setLoader('Loading lesson JSON...',65,'Content');
  await loadLesson();
 }catch(e){ showError('Firebase: '+e.message)}
});

async function handleHeartRegen(){
 if(hearts>=5||!heartsDepletedAt) return;
 let elapsed=Math.floor((Date.now()-heartsDepletedAt)/60000);
 let regen=Math.min(5, Math.floor(elapsed/6));
 if(regen>0){ hearts=Math.min(5,hearts+regen); if(hearts>=5) heartsDepletedAt=null; try{await setDoc(doc(db,'users',currentUser.uid),{hearts, heartsDepletedAt:hearts>=5?null:heartsDepletedAt},{merge:true})}catch{} toast(regen>=5?'Hearts fully restored':`+${regen} heart`); }
 if(hearts<5) startHeartTimer();
}
function startHeartTimer(){
 setInterval(async()=>{
  if(hearts>=5) return;
  let next=6*60*1000 - ((Date.now()-(heartsDepletedAt||Date.now()))%(6*60*1000));
  let m=Math.floor(next/60000), s=Math.floor((next%60000)/1000);
  el('heartTimer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
 },1000);
}

async function loadLesson(){
 let paths=[`${folder}/Lesson ${lessonNum}.json`, `${folder}/lesson ${lessonNum}.json`, `${folder}/${lessonNum}.json`, `lessons/${folder}/Lesson ${lessonNum}.json`];
 for(let p of paths){ try{ let r=await fetch(p); if(r.ok){ lessonJSON=await r.json(); localStorage.setItem(`lesson_${folder}_${lessonNum}`, JSON.stringify(lessonJSON)); break } }catch{} }
 if(!lessonJSON){ let cached=localStorage.getItem(`lesson_${folder}_${lessonNum}`); if(cached) lessonJSON=JSON.parse(cached); }
 if(!lessonJSON){ showError('Lesson JSON not found: '+paths.join(', ')); return }
 // preload next lesson
 fetch(`${folder}/Lesson ${lessonNum+1}.json`).then(r=>r.ok&&r.json()).then(j=>{ if(j) localStorage.setItem(`lesson_${folder}_${lessonNum+1}`, JSON.stringify(j)) }).catch(()=>{});
 setLoader('Normalizing blocks...',80,'Engine');
 normalize();
 await loadResults();
 setLoader('Building pages...',95,'Layout');
 buildPages();
 currentPage=explicitPage? Math.max(0,Math.min(explicitPage-1,pages.length-1)) : 0;
 renderPage(); setHeartsUI();
 setTimeout(()=>{el('loader').classList.add('hide')},400);
}
function normalize(){
 let blocks=[]; let src=lessonJSON.blocks||lessonJSON.content||lessonJSON.data||lessonJSON;
 if(Array.isArray(src)&&src.length&&!src[0].type) { /* if array of questions */ }
 let arr=Array.isArray(lessonJSON)? lessonJSON : (lessonJSON.blocks||lessonJSON.content||lessonJSON.lessons||[]);
 if(arr.length===0 && lessonJSON.title) blocks.push({type:'heading', text:lessonJSON.title});
 for(let b of arr){
  if(b.heading||b.title) blocks.push({type:'heading', text:b.heading||b.title});
  if(b.text||b.content) blocks.push({type:'text', text:b.text||b.content});
  if(b.code||b.example) blocks.push({type:'code', code:b.code||b.example, language:b.language||'html'});
  if(b.output) blocks.push({type:'output', text:b.output});
  if(b.tip) blocks.push({type:'tip', text:b.tip});
  if(b.note) blocks.push({type:'note', text:b.note});
  if(b.question){
   let id=b.id||b.questionId||`q_${folder}_${lessonNum}_${hash(b.question)}`;
   blocks.push({type:'quiz', id, question:b.question||b.text, options:b.options||b.choices||[], correctAnswer:b.correctAnswer??b.correct??0, xp:b.xp||b.rewardXP||10, explanation:b.explanation||''});
  }
 }
 if(blocks.length===0 && lessonJSON.questions){ lessonJSON.questions.forEach((q,i)=>blocks.push({type:'quiz', id:q.id||`q_${folder}_${lessonNum}_${i}`, question:q.question, options:q.options, correctAnswer:q.correctAnswer??0, xp:q.xp||10})) }
 lessonJSON._blocks=blocks;
 totalXP=blocks.filter(b=>b.type==='quiz').reduce((s,b)=>s+(b.xp||10),0);
 el('brandTitle').textContent=`${course.toUpperCase()} • Lesson ${lessonNum}`; el('brandPath').textContent=lessonJSON.title||'Code Academy Lesson';
}
function hash(s){let h=0; for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i); h|=0} return Math.abs(h).toString(36)}

async function loadResults(){
 try{ let snap=await getDoc(doc(db,'users',currentUser.uid)); if(!snap.exists()) return; let d=snap.data(); let key=`${folder}_${lessonNum}`; questionResults=d.lessonQuestionResults?.[key]||{}; earnedXP=0; Object.values(questionResults).forEach(r=>{if(r.correct) earnedXP+=r.xpEarned||0}) }catch{}
}

function buildPages(){
 pages=[]; let cur=[]; let curH=0;
 let container=el('lessonStage'); let maxH=Math.min(760, container.clientHeight||600)-120;
 measure.style.width='760px';
 for(let b of lessonJSON._blocks){
  if(b.type==='quiz'){ if(cur.length){pages.push(cur); cur=[]; curH=0} pages.push([b]); continue }
  let tmp=document.createElement('div'); tmp.innerHTML=renderBlock(b,true); measure.appendChild(tmp);
  let h=tmp.getBoundingClientRect().height+16; measure.innerHTML='';
  // emergency scaling: if block too tall, split code
  if(h>maxH && b.type==='code'){ let lines=b.code.split('\n'); for(let i=0;i<lines.length;i+=15){ pages.push([{type:'code', code:lines.slice(i,i+15).join('\n'), language:b.language}]) } continue }
  if(curH+h>maxH && cur.length>0){ pages.push(cur); cur=[b]; curH=h } else { cur.push(b); curH+=h }
 }
 if(cur.length) pages.push(cur);
 if(pages.length===0) pages=[[{type:'text', text:'Empty lesson'}]];
}

function renderBlock(b, measuring=false){
 if(b.type==='heading') return `<div style="text-align:center;padding:20px"><div style="width:62px;height:62px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;border-radius:20px;background:linear-gradient(135deg,rgba(56,189,248,.14),rgba(129,140,248,.12));border:1px solid rgba(56,189,248,.18);color:#38bdf8"><i class="fa-solid fa-code"></i></div><h2 style="font-size:clamp(24px,6vw,36px);font-weight:900;letter-spacing:-.04em">${esc(b.text)}</h2></div>`;
 if(b.type==='text') return `<div class="text-scene"><div class="text-body">${esc(b.text)}</div></div>`;
 if(b.type==='tip'||b.type==='note') return `<div class="text-scene" style="border-left:3px solid ${b.type==='tip'?'#38bdf8':'#a855f7'}"><div class="text-body" style="font-size:14px">${esc(b.text)}</div></div>`;
 if(b.type==='code') return `<div class="code-scene"><div class="code-top"><div style="display:flex;align-items:center;gap:6px"><span style="width:9px;height:9px;border-radius:50%;background:#ff5f57"></span><span style="width:9px;height:9px;border-radius:50%;background:#febc2e"></span><span style="width:9px;height:9px;border-radius:50%;background:#28c840"></span><span style="margin-left:6px;color:#8b949e;font-family:JetBrains Mono;font-size:9px">${b.language||'code'}</span></div><div style="display:flex;gap:6px"><button onclick="window.copyCode('${encodeURIComponent(b.code)}')" style="padding:6px 9px;border-radius:7px;background:#1c232d;border:1px solid #303844;color:#9aa4b3;font-size:9px">Copy</button><button onclick="window.previewCode('${encodeURIComponent(b.code)}')" style="padding:6px 9px;border-radius:7px;background:#1c232d;border:1px solid #303844;color:#9aa4b3;font-size:9px">Preview</button></div></div><div class="code-content"><pre><code>${esc(b.code)}</code></pre></div></div>`;
 if(b.type==='output') return `<div style="width:100%;border-radius:17px;background:#08100c;border:1px solid rgba(34,197,94,.16)"><div style="height:42px;display:flex;align-items:center;gap:8px;padding:0 13px;color:#4ade80;background:rgba(34,197,94,.055);font-size:10px;font-weight:800"><i class="fa-solid fa-terminal"></i> Output</div><div style="padding:18px;color:#bbf7d0;font-family:JetBrains Mono;font-size:12px;white-space:pre-wrap">${esc(b.text)}</div></div>`;
 if(b.type==='quiz'){
  let saved=questionResults[b.id]; let letters=['A','B','C','D','E','F'];
  let opts=b.options.map((o,i)=>{ let state=''; if(saved){ if(i===saved.correctIndex) state=' correct'; else if(i===saved.selectedIndex&&!saved.correct) state=' wrong'; } return `<button class="quiz-option ${saved?'disabled':''}${state}" data-qid="${b.id}" data-idx="${i}" aria-label="Option ${letters[i]}" aria-pressed="${saved?'true':'false'}"><div class="option-letter">${letters[i]}</div><div style="flex:1;font-size:12px">${esc(typeof o==='string'?o:o.text||o)}</div></button>`}).join('');
  return `<div class="quiz-scene"><div style="display:flex;justify-content:space-between;margin-bottom:12px"><span class="quiz-badge"><i class="fa-solid fa-star"></i> QUESTION • ${b.xp||10} XP</span><span style="color:#facc15;font-size:9px;font-weight:800">${saved? (saved.correct? '+'+saved.xpEarned+' XP' : '-1 Heart') : ''}</span></div><div class="quiz-question"><div class="quiz-question-text">${esc(b.question)}</div></div><div class="quiz-options">${opts}</div>${saved? `<div style="margin-top:10px;padding:10px;border-radius:10px;font-size:11px;background:${saved.correct?'rgba(34,197,94,.08)':'rgba(255,69,103,.08)'};border:1px solid ${saved.correct?'rgba(34,197,94,.17)':'rgba(255,69,103,.17)'}">${saved.correct? 'Correct! +'+saved.xpEarned+' XP':'Incorrect -1 Heart'} ${b.explanation? '• '+b.explanation:''}</div>` : `<button class="quiz-submit" style="width:100%;height:44px;margin-top:10px;border-radius:12px;background:linear-gradient(135deg,#38bdf8,#818cf8);color:#06111c;font-weight:900;opacity:.3" disabled>Select an answer</button>`}</div>`;
 }
 return '';
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function renderPage(){
 if(!pages.length) return;
 let page=pages[currentPage];
 let scene=document.createElement('div'); scene.className='scene';
 scene.innerHTML=`<div class="scene-header"><div class="scene-meta"><span class="lesson-chip"><i class="fa-solid fa-book"></i> ${folder.toUpperCase()} • L${lessonNum}</span><span class="block-number">PAGE ${currentPage+1} / ${pages.length}</span></div><div class="scene-title">${lessonJSON.title||`Lesson ${lessonNum}`}</div></div><div class="scene-body"><div class="content">${page.map(b=>renderBlock(b)).join('')}</div></div><div style="padding:8px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:8px;color:#59657b"><span>${earnedXP}/${totalXP} XP • Need ${Math.ceil(totalXP/2)}</span><span>${page.some(b=>b.type==='quiz')? 'Quiz Page' : 'Reading'}</span></div>`;
 stage.innerHTML=''; stage.appendChild(scene);
 progressFill.style.width=((currentPage+1)/pages.length*100)+'%'; progressLabel.textContent=`Page ${currentPage+1} of ${pages.length}`;
 el('prevBtn').disabled=currentPage===0;
 let hasUnanswered=page.some(b=>b.type==='quiz'&&!questionResults[b.id]);
 el('nextBtn').disabled= hasUnanswered && hearts>0;
 el('nextBtn').classList.toggle('locked', hasUnanswered);
 setTimeout(()=>{ stage.querySelectorAll('pre code').forEach(c=>hljs.highlightElement(c)) },30);
 stage.querySelectorAll('.quiz-option').forEach(btn=>{ btn.addEventListener('click',()=>{ stage.querySelectorAll('.quiz-option').forEach(b=>b.classList.remove('selected')); btn.classList.add('selected'); let submit=stage.querySelector('.quiz-submit'); if(submit){ submit.disabled=false; submit.style.opacity='1'; submit.textContent='Submit Answer'; submit.onclick=()=>handleAnswer(btn.dataset.qid, parseInt(btn.dataset.idx)) } }) });
 if(currentPage===pages.length-1 && lessonJSON._blocks.filter(b=>b.type==='quiz').every(b=>questionResults[b.id])) showCompletion();
}

async function handleAnswer(qId, idx){
 if(questionResults[qId]||hearts<=0) return;
 let block=lessonJSON._blocks.find(b=>b.id===qId); if(!block) return;
 let correctIdx=typeof block.correctAnswer==='number'? block.correctAnswer : block.options.findIndex(o=>o.correct||o===block.correctAnswer);
 let isCorrect=idx===correctIdx; let xpEarn=isCorrect?(block.xp||10):0;
 try{
  await runTransaction(db, async(tx)=>{
   let ref=doc(db,'users',currentUser.uid); let snap=await tx.get(ref); if(!snap.exists()) throw 'No user';
   let data=snap.data(); let key=`${folder}_${lessonNum}`; if(data.lessonQuestionResults?.[key]?.[qId]) throw 'Already';
   let newHearts=data.hearts??hearts; let newXP=data.xp??0;
   if(isCorrect) newXP+=xpEarn; else newHearts=Math.max(0,newHearts-1);
   let newResults={...(data.lessonQuestionResults||{})}; if(!newResults[key]) newResults[key]={};
   newResults[key][qId]={answered:true, correct:isCorrect, xpEarned:xpEarn, selectedIndex:idx, correctIndex:correctIdx, question:block.question, createdAt:serverTimestamp()};
   let upd={hearts:newHearts, xp:newXP, lessonQuestionResults:newResults};
   if(newHearts===0) upd.heartsDepletedAt=serverTimestamp();
   let histRef=doc(collection(db,'users',currentUser.uid,'lessonHistory'));
   tx.set(histRef,{course:folder, lesson:lessonNum, questionId:qId, question:block.question, selected:idx, correct:correctIdx, isCorrect, xpEarned:xpEarn, heartsAfter:newHearts, createdAt:serverTimestamp()});
   tx.update(ref, upd);
  });
  questionResults[qId]={correct:isCorrect, xpEarned:xpEarn, selectedIndex:idx, correctIndex:correctIdx};
  if(isCorrect){ earnedXP+=xpEarn; toast(`Correct +${xpEarn} XP`)} else { hearts=Math.max(0,hearts-1); toast('Incorrect -1 Heart'); if(hearts===0) heartsDepletedAt=Date.now(); }
  setHeartsUI(); renderPage();
 }catch(e){ if(String(e).includes('Already')){ toast('Already answered'); renderPage() } else toast('Save failed: '+e) }
}

el('nextBtn').addEventListener('click',()=>{ if(currentPage<pages.length-1){ currentPage++; renderPage(); stopVoice() } });
el('prevBtn').addEventListener('click',()=>{ if(currentPage>0){ currentPage--; renderPage(); stopVoice() } });
document.addEventListener('keydown',e=>{
 if(e.target.tagName==='INPUT') return;
 if(e.key==='ArrowRight') el('nextBtn').click();
 if(e.key==='ArrowLeft') el('prevBtn').click();
 if(e.key.toLowerCase()==='h') el('historyBtn').click();
 if(e.key.toLowerCase()==='v') el('voiceBtn').click();
 if(e.key==='Escape'){ el('exitModal').classList.remove('show'); el('noHeartsModal').classList.remove('show'); closeHistory() }
});

el('exitBtn').addEventListener('click',()=>el('exitModal').classList.add('show'));
el('stayBtn').addEventListener('click',()=>el('exitModal').classList.remove('show'));
el('confirmExit').addEventListener('click',()=>{ let dash=dashboardMap[folder]||'course.html'; let url=fromParam &&!fromParam.includes('http') &&!fromParam.includes('..')? fromParam : dash; location.href=url });

el('voiceBtn').addEventListener('click',()=>{ if(isVoiceOn) stopVoice(); else startVoice() });
function startVoice(){
 let text=pages[currentPage].map(b=>b.text||b.question||'').join('. '); if(!text) return;
 stopVoice(); isVoiceOn=true; el('voiceBtn').classList.add('active');
 let chunks=text.match(/[^.!?]+[.!?]+/g)||[text]; let i=0;
 function next(){ if(i>=chunks.length||!isVoiceOn){stopVoice(); return} let u=new SpeechSynthesisUtterance(chunks[i].trim()); let vs=speechSynthesis.getVoices(); let en=vs.find(v=>v.lang.startsWith('en'))||vs[0]; if(en) u.voice=en; u.onend=()=>{i++; next()}; speechSynthesis.speak(u) }
 next();
}
function stopVoice(){ isVoiceOn=false; el('voiceBtn').classList.remove('active'); speechSynthesis.cancel() }

el('shareBtn').addEventListener('click', async()=>{
 let url=`${location.origin}${location.pathname}?course=${course}&lesson=${lessonNum}&page=${currentPage+1}`+(fromParam?`&from=${fromParam}`:'');
 let code=userData.referralCode||userData.referral?.code||''; let text=`Learn ${course.toUpperCase()} Lesson ${lessonNum} on Code Academy! ${url} ${code? 'My code: '+code : ''}`;
 try{ if(navigator.share){ await navigator.share({title:'Code Academy', text, url}) } else { await navigator.clipboard.writeText(url); toast('Share link copied') } }catch{ await navigator.clipboard.writeText(url); toast('Share link copied') }
});
el('aiBtn').addEventListener('click',()=>toast('AI Mentor — Coming soon'));

el('historyBtn').addEventListener('click',()=>{ el('historyPanel').classList.add('active'); el('overlay').classList.add('active'); loadHistory() });
el('closeHistory').addEventListener('click',closeHistory); el('overlay').addEventListener('click',closeHistory);
function closeHistory(){ el('historyPanel').classList.remove('active'); el('overlay').classList.remove('active') }
async function loadHistory(){ try{ let q=query(collection(db,'users',currentUser.uid,'lessonHistory'), limit(100)); let snap=await getDocs(q); let items=snap.docs.map(d=>d.data()).filter(d=>d.course===folder&&d.lesson===lessonNum); historyCache=items; renderHistory(items) }catch{ el('historyList').innerHTML='<div style="color:#ef4444;font-size:11px">Failed</div>' } }
function renderHistory(items){
 let s=(el('historySearch').value||'').toLowerCase(); let f=items.filter(i=>!s||(i.question||'').toLowerCase().includes(s));
 el('historyList').innerHTML=f.map(i=>`<div style="background:#11182b;padding:10px;border-radius:10px;margin-bottom:8px"><div style="font-size:11px;font-weight:700">${esc(i.question||'').slice(0,80)}</div><div style="font-size:10px;color:${i.isCorrect?'#22c55e':'#ff4567'}">${i.isCorrect?'Correct +'+(i.xpEarned||0)+' XP':'Wrong'}</div></div>`).join('')||'<div style="text-align:center;color:#59657b;font-size:11px;padding:20px">No history</div>';
}
el('historySearch').addEventListener('input',()=>renderHistory(historyCache));

el('refillBtn').addEventListener('click', async()=>{
 if((userData.xp||0)<200||(userData.coins||0)<100){ toast('Need 200 XP + 100 Coins'); return }
 try{ await runTransaction(db, async(tx)=>{ let ref=doc(db,'users',currentUser.uid); let snap=await tx.get(ref); let d=snap.data(); if(d.xp<200||d.coins<100) throw 'No funds'; tx.update(ref,{xp:d.xp-200, coins:d.coins-100, hearts:5, heartsDepletedAt:null}) }); hearts=5; setHeartsUI(); el('noHeartsModal').classList.remove('show'); toast('Hearts restored') }catch(e){ toast('Refill failed: '+e) }
});

function showCompletion(){
 let need=Math.ceil(totalXP/2); let qual=earnedXP>=need;
 el('completeBox').innerHTML=`<h2>${qual?'Lesson Complete 🎉':'Not Qualified'}</h2><div style="margin:12px 0;font-size:13px;line-height:1.6"><div>Earned: <b style="color:#38bdf8">${earnedXP} XP</b> / ${totalXP}</div><div>Required: <b>${need} XP</b></div><div style="margin-top:8px;color:${qual?'#22c55e':'#ff4567'}">${qual?'Qualified for next lesson!':'Need more XP'}</div></div><div style="display:flex;gap:8px;margin-top:16px"><button onclick="location.href='lesson.html?course=${course}&lesson=${lessonNum+1}'" style="padding:10px 16px;border-radius:10px;background:${qual?'#38bdf8':'#1e293b'};color:${qual?'#070b16':'white'};font-weight:800;border:none">${qual?'Next Lesson':'Repeat'}</button><button onclick="location.href='${fromParam&&!fromParam.includes('http')? fromParam : dashboardMap[folder]}'" style="padding:10px 16px;border-radius:10px;background:#11182b;color:white;border:1px solid var(--line)">Dashboard</button></div>`;
 el('completeModal').classList.add('show');
 (async()=>{ try{ let ref=doc(db,'users',currentUser.uid); await setDoc(ref,{[`progress.${folder}.${lessonNum}`]:{earnedXP,totalXP,thresholdXP:need,qualified:qual,completed:true,updatedAt:serverTimestamp()}},{merge:true}) }catch{} })();
}

function showError(m){ el('loader').classList.add('hide'); stage.innerHTML=`<div style="text-align:center;padding:30px"><i class="fa-solid fa-triangle-exclamation" style="font-size:32px;color:#ff4567"></i><h3 style="margin-top:12px">Lesson couldn't be loaded</h3><p style="font-size:12px;color:#8d98ad;margin-top:8px">${m}</p><button onclick="location.href='${dashboardMap[folder]||'course.html'}'" style="margin-top:16px;padding:10px 16px;border-radius:10px;background:#38bdf8;color:#070b16;font-weight:800;border:none">Return to Dashboard</button></div>` }

window.copyCode=async(c)=>{ try{ await navigator.clipboard.writeText(decodeURIComponent(c)); toast('✓ Code copied') }catch{ toast('Copy failed') } }
window.previewCode=(c)=>{ let code=decodeURIComponent(c); let w=window.open(); w.document.write(`<pre style="padding:20px;background:#070b16;color:white;font-family:JetBrains Mono">${code}</pre>`) }

let ro=new ResizeObserver(()=>{ if(lessonJSON){ buildPages(); if(currentPage>=pages.length) currentPage=pages.length-1; renderPage() } }); ro.observe(el('lessonStage'));
</script>
</body>
</html>
