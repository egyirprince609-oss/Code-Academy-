<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020617"><meta name="robots" content="noindex,nofollow"><meta name="description" content="Opening Code Academy learning workspace."><link rel="manifest" href="./manifest.json"><link rel="icon" href="./logo.png"><title>Opening Code Academy</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 20%,#152957 0,transparent 43%),#020617;color:#edf5ff;font-family:system-ui,sans-serif}.splash{width:min(430px,100%);text-align:center;padding:34px 25px;border:1px solid #ffffff20;border-radius:28px;background:#0b1326d9;box-shadow:0 30px 100px #0008}.logo{width:105px;height:105px;object-fit:contain;margin:0 auto 20px;animation:float 2.2s ease-in-out infinite;filter:drop-shadow(0 14px 24px #22d3ee33)}h1{margin:0;font-size:28px;letter-spacing:-.04em}.motto{color:#9fb2d0;font-size:13px;margin:9px 0 24px}.load{height:5px;background:#1d2b45;border-radius:99px;overflow:hidden;margin:24px 0}.load span{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,#22d3ee,#818cf8);animation:load 1.8s ease-in-out infinite}.status{color:#a8bbd5;font-size:12px;min-height:20px}.fallback{display:none;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:20px}.fallback a{color:white;background:#14233b;border:1px solid #334766;padding:10px 14px;border-radius:12px;font-size:13px;font-weight:700;text-decoration:none}.fallback.show{display:flex}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}@keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}@media(prefers-reduced-motion:reduce){.logo,.load span{animation:none}} </style></head><body><main class="splash"><img class="logo" src="./logo.png" alt="Code Academy logo"><h1>Code Academy</h1><p class="motto">We Learn. We Code. We Succeed.</p><div class="load" aria-hidden="true"><span></span></div><p id="status" class="status" role="status" aria-live="polite">Preparing your learning space…</p><div id="fallback" class="fallback"><a href="./signup.html">Create account</a><a href="./login.html">Sign in</a><a href="./menu.html">Open dashboard</a></div></main><script type="module">import {auth,onAuthStateChanged,rememberReferral} from './authentication.js';const status=document.getElementById('status'),fallback=document.getElementById('fallback');const params=new URLSearchParams(location.search);const intent=params.get('intent')==='login'?'login':'signup';let done=false;let timer;function route(user){if(done)return;done=true;clearTimeout(timer);status.textContent=user?'Account found. Opening your dashboard…':intent==='login'?'Opening secure sign-in…':'Preparing your account setup…';setTimeout(()=>{if(user){const requiresVerification=(user.providerData||[]).some(p=>p.providerId==='password')&&!user.emailVerified;location.replace(requiresVerification?'./verify-email.html':'./menu.html');}else location.replace(intent==='login'?'./login.html':'./signup.html');},850);}try{rememberReferral?.()}catch(e){}timer=setTimeout(()=>{if(done)return;status.textContent='Connection is taking longer than expected. Choose where to continue.';fallback.classList.add('show');},6500);onAuthStateChanged(auth,user=>route(user),error=>{console.warn('Authentication state is temporarily unavailable:',error);if(done)return;clearTimeout(timer);status.textContent='We could not confirm your sign-in state. Continue securely below.';fallback.classList.add('show');});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
