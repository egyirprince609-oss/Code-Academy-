<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Code Academy</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://www.google.com/recaptcha/api.js" async defer></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#020617;
  color:white;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-card{
  width:100%;
  max-width:420px;
  background:#0f172a;
  border-radius:20px;
  padding:35px 30px;
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}

.logo{
  text-align:center;
  margin-bottom:25px;
}

.logo img{
  width:60px;
  height:60px;
  border-radius:50%;
  margin-bottom:12px;
}

.logo h1{
  font-size:24px;
  color:#38bdf8;
  margin-bottom:5px;
}

.logo p{
  font-size:12px;
  color:#94a3b8;
}

.form-group{
  margin-bottom:18px;
}

.input-box{
  position:relative;
}

.input-box i{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  color:#38bdf8;
  font-size:14px;
}

.input-box input{
  width:100%;
  padding:14px 14px 14px 42px;
  background:#1e293b;
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;
  color:white;
  font-size:14px;
  outline:none;
  transition:0.3s;
}

.input-box input:focus{
  border-color:#38bdf8;
  background:#0f172a;
}

/* REMEMBER ME + FORGOT */
.options-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
  font-size:12px;
}

.checkbox-wrapper{
  display:flex;
  align-items:center;
  gap:6px;
  color:#cbd5e1;
  cursor:pointer;
}

.checkbox-wrapper input[type="checkbox"]{
  width:16px;
  height:16px;
  cursor:pointer;
  accent-color:#38bdf8;
}

.forgot-row a{
  color:#38bdf8;
  text-decoration:none;
}

.forgot-row a:hover{
  text-decoration:underline;
}

/* RECAPTCHA */
.recaptcha-box{
  display:flex;
  justify-content:center;
  margin:20px 0;
}

/* BUTTON */
.btn-primary{
  width:100%;
  padding:15px;
  background:linear-gradient(135deg, #38bdf8, #0ea5e9);
  border:none;
  border-radius:12px;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

.btn-primary:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(56,189,248,0.4);
}

.btn-primary:disabled{
  opacity:0.5;
  cursor:not-allowed;
}

/* DIVIDER */
.divider{
  display:flex;
  align-items:center;
  margin:25px 0;
  color:#64748b;
  font-size:12px;
}

.divider::before,
.divider::after{
  content:'';
  flex:1;
  height:1px;
  background:rgba(255,255,255,0.1);
}

.divider span{
  padding:0 12px;
}

/* SOCIAL BUTTONS */
.social-btn{
  width:100%;
  padding:14px;
  background:#1e293b;
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;
  color:white;
  font-size:14px;
  cursor:pointer;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  transition:0.3s;
}

.social-btn:hover{
  background:#334155;
  border-color:#38bdf8;
}

.google-btn i{color:#DB4437}
.yahoo-btn i{color:#720e9e}

.signup-link{
  text-align:center;
  margin-top:20px;
  font-size:13px;
  color:#94a3b8;
}

.signup-link a{
  color:#38bdf8;
  text-decoration:none;
  font-weight:bold;
}

.error-msg{
  background:rgba(239,68,68,0.15);
  border:1px solid rgba(239,68,68,0.4);
  color:#fca5a5;
  padding:12px;
  border-radius:10px;
  font-size:12px;
  margin-bottom:15px;
  display:none;
}

.loading{
  display:none;
  text-align:center;
  color:#38bdf8;
  font-size:12px;
  margin-top:10px;
}
</style>
</head>
<body>

<div class="login-card">

  <div class="logo">
    <img src="logo.png" alt="Code Academy">
    <h1>Welcome Back</h1>
    <p>Login to continue learning</p>
  </div>

  <div id="errorMsg" class="error-msg"></div>

  <form id="loginForm">
    <div class="form-group">
      <div class="input-box">
        <i class="fa fa-envelope"></i>
        <input type="email" id="email" placeholder="you@email.com" required>
      </div>
    </div>

    <div class="form-group">
      <div class="input-box">
        <i class="fa fa-lock"></i>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>
    </div>

    <!-- REMEMBER ME + FORGOT PASSWORD -->
    <div class="options-row">
      <label class="checkbox-wrapper">
        <input type="checkbox" id="rememberMe">
        <span>Remember me</span>
      </label>
      <div class="forgot-row">
        <a href="forgot.html">Forgot Password?</a>
      </div>
    </div>

    <!-- GOOGLE RECAPTCHA -->
    <div class="recaptcha-box">

      <div class="g-recaptcha" data-sitekey="6LeBaj4tAAAAAG4tn09wVhqz5INyaJgfl-5S9Efh"></div>
    </div>

    <button type="submit" class="btn-primary" id="loginBtn">
      Log In
    </button>

    <div class="loading" id="loading">Verifying...</div>
  </form>

  <div class="divider">
    <span>Or login with</span>
  </div>

  <button class="social-btn google-btn" id="googleBtn">
    <i class="fab fa-google"></i>
    Continue with Google
  </button>

  <button class="social-btn yahoo-btn" id="yahooBtn">
    <i class="fab fa-yahoo"></i>
    Continue with Yahoo
  </button>

  <div class="signup-link">
    Don't have an account? <a href="signup.html">Sign up</a>
  </div>

</div>

<script type="module">
import { logIn, signInWithGoogle, signInWithYahoo, auth } from './authentication.js';
import { setPersistence, browserLocalPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const form = document.getElementById('loginForm');
const errorMsg = document.getElementById('errorMsg');
const loading = document.getElementById('loading');
const loginBtn = document.getElementById('loginBtn');

function showError(msg){
  errorMsg.textContent = msg;
  errorMsg.style.display = 'block';
  setTimeout(() => errorMsg.style.display = 'none', 5000);
}

// Email + Password Login with reCAPTCHA + Remember Me
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorMsg.style.display = 'none';
  
  const recaptchaResponse = grecaptcha.getResponse();
  if(!recaptchaResponse){
    showError('Please verify you are not a robot');
    return;
  }
  
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const rememberMe = document.getElementById('rememberMe').checked;

  loginBtn.disabled = true;
  loading.style.display = 'block';

  try{
    // Use the auth instance from authentication.js
    const persistenceType = rememberMe ? browserLocalPersistence : browserSessionPersistence;
    await setPersistence(auth, persistenceType);
    
    await logIn(email, password);
    window.location.href = 'menu.html';
  } catch(error){
    loginBtn.disabled = false;
    loading.style.display = 'none';
    grecaptcha.reset();
    
    if(error.code === 'auth/user-not-found'){
      showError('No account found with this email');
    } else if(error.code === 'auth/wrong-password'){
      showError('Wrong password');
    } else {
      showError(error.message);
    }
  }
});

document.getElementById('googleBtn').addEventListener('click', async () => {
  try{
    await signInWithGoogle();
    window.location.href = 'menu.html';
  } catch(error){
    showError('Google login failed');
  }
});

document.getElementById('yahooBtn').addEventListener('click', async () => {
  try{
    await signInWithYahoo();
    window.location.href = 'menu.html';
  } catch(error){
    showError('Yahoo login failed');
  }
});
</script>

</script>
</body>
</html>
