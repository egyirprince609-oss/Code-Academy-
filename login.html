<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Login - Code Academy</title>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
>

<script
  src="https://www.google.com/recaptcha/api.js"
  async
  defer
></script>


<style>

/* ============================================================
   RESET
============================================================ */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}


/* ============================================================
   BODY
============================================================ */

body{

  background:#020617;

  color:white;

  min-height:100vh;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:20px;
}


/* ============================================================
   LOGIN CARD
============================================================ */

.login-card{

  width:100%;

  max-width:420px;

  background:#0f172a;

  border-radius:20px;

  padding:35px 30px;

  border:1px solid rgba(255,255,255,0.08);

  box-shadow:
    0 20px 60px rgba(0,0,0,0.5);
}


/* ============================================================
   LOGO
============================================================ */

.logo{

  text-align:center;

  margin-bottom:25px;
}


.logo img{

  width:60px;

  height:60px;

  border-radius:50%;

  margin-bottom:12px;
}


.logo h1{

  font-size:24px;

  color:#38bdf8;

  margin-bottom:5px;
}


.logo p{

  font-size:12px;

  color:#94a3b8;
}


/* ============================================================
   ERROR MESSAGE
============================================================ */

.error-msg{

  background:rgba(239,68,68,0.15);

  border:1px solid rgba(239,68,68,0.4);

  color:#fca5a5;

  padding:12px;

  border-radius:10px;

  font-size:12px;

  margin-bottom:15px;

  display:none;

  line-height:1.5;
}


/* ============================================================
   SUCCESS MESSAGE
============================================================ */

.success-msg{

  background:rgba(34,197,94,0.15);

  border:1px solid rgba(34,197,94,0.4);

  color:#86efac;

  padding:12px;

  border-radius:10px;

  font-size:12px;

  margin-bottom:15px;

  display:none;

  line-height:1.5;
}


/* ============================================================
   FORM GROUP
============================================================ */

.form-group{

  margin-bottom:18px;
}


/* ============================================================
   INPUT
============================================================ */

.input-box{

  position:relative;
}


.input-box i{

  position:absolute;

  left:14px;

  top:50%;

  transform:translateY(-50%);

  color:#38bdf8;

  font-size:14px;
}


.input-box input{

  width:100%;

  padding:14px 14px 14px 42px;

  background:#1e293b;

  border:1px solid rgba(255,255,255,0.1);

  border-radius:12px;

  color:white;

  font-size:14px;

  outline:none;

  transition:0.3s;
}


.input-box input:focus{

  border-color:#38bdf8;

  background:#0f172a;

  box-shadow:
    0 0 0 2px rgba(56,189,248,0.08);
}


.input-box input::placeholder{

  color:#64748b;
}


/* ============================================================
   REMEMBER ME + FORGOT PASSWORD
============================================================ */

.options-row{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:18px;

  font-size:12px;
}


.checkbox-wrapper{

  display:flex;

  align-items:center;

  gap:6px;

  color:#cbd5e1;

  cursor:pointer;
}


.checkbox-wrapper input[type="checkbox"]{

  width:16px;

  height:16px;

  cursor:pointer;

  accent-color:#38bdf8;
}


.forgot-row a{

  color:#38bdf8;

  text-decoration:none;
}


.forgot-row a:hover{

  text-decoration:underline;
}


/* ============================================================
   RECAPTCHA
============================================================ */

.recaptcha-box{

  display:flex;

  justify-content:center;

  margin:20px 0;

  overflow:hidden;
}


/* ============================================================
   PRIMARY BUTTON
============================================================ */

.btn-primary{

  width:100%;

  padding:15px;

  background:
    linear-gradient(
      135deg,
      #38bdf8,
      #0ea5e9
    );

  border:none;

  border-radius:12px;

  color:white;

  font-size:15px;

  font-weight:bold;

  cursor:pointer;

  transition:0.3s;
}


.btn-primary:hover{

  transform:translateY(-2px);

  box-shadow:
    0 10px 25px rgba(56,189,248,0.4);
}


.btn-primary:disabled{

  opacity:0.5;

  cursor:not-allowed;

  transform:none;

  box-shadow:none;
}


/* ============================================================
   DIVIDER
============================================================ */

.divider{

  display:flex;

  align-items:center;

  margin:25px 0;

  color:#64748b;

  font-size:12px;
}


.divider::before,
.divider::after{

  content:'';

  flex:1;

  height:1px;

  background:rgba(255,255,255,0.1);
}


.divider span{

  padding:0 12px;
}


/* ============================================================
   SOCIAL BUTTONS
============================================================ */

.social-btn{

  width:100%;

  padding:14px;

  background:#1e293b;

  border:1px solid rgba(255,255,255,0.1);

  border-radius:12px;

  color:white;

  font-size:14px;

  cursor:pointer;

  margin-bottom:12px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:10px;

  transition:0.3s;
}


.social-btn:hover{

  background:#334155;

  border-color:#38bdf8;
}


.social-btn:disabled{

  opacity:0.5;

  cursor:not-allowed;
}


.google-btn i{

  color:#DB4437;
}


.yahoo-btn i{

  color:#720e9e;
}


/* ============================================================
   LOADING
============================================================ */

.loading{

  display:none;

  text-align:center;

  color:#38bdf8;

  font-size:12px;

  margin-top:10px;
}


/* ============================================================
   SIGNUP LINK
============================================================ */

.signup-link{

  text-align:center;

  margin-top:20px;

  font-size:13px;

  color:#94a3b8;
}


.signup-link a{

  color:#38bdf8;

  text-decoration:none;

  font-weight:bold;
}


.signup-link a:hover{

  text-decoration:underline;
}


/* ============================================================
   MOBILE
============================================================ */

@media(max-width:480px){

  body{

    padding:12px;
  }


  .login-card{

    padding:28px 20px;

    border-radius:16px;
  }


  .logo h1{

    font-size:22px;
  }

}

</style>

</head>


<body>


<div class="login-card">


  <!-- ========================================================
       LOGO
  ========================================================= -->

  <div class="logo">

    <img
      src="logo.png"
      alt="Code Academy"
    >

    <h1>Welcome Back</h1>

    <p>
      Login to continue learning
    </p>

  </div>


  <!-- ========================================================
       ERROR MESSAGE
  ========================================================= -->

  <div
    id="errorMsg"
    class="error-msg"
  ></div>


  <!-- ========================================================
       SUCCESS MESSAGE
  ========================================================= -->

  <div
    id="successMsg"
    class="success-msg"
  ></div>


  <!-- ========================================================
       LOGIN FORM
  ========================================================= -->

  <form id="loginForm">


    <!-- EMAIL -->

    <div class="form-group">

      <div class="input-box">

        <i class="fa fa-envelope"></i>

        <input
          type="email"
          id="email"
          placeholder="you@email.com"
          autocomplete="email"
          required
        >

      </div>

    </div>


    <!-- PASSWORD -->

    <div class="form-group">

      <div class="input-box">

        <i class="fa fa-lock"></i>

        <input
          type="password"
          id="password"
          placeholder="Enter password"
          autocomplete="current-password"
          required
        >

      </div>

    </div>


    <!-- ======================================================
         REMEMBER ME + FORGOT PASSWORD
    ======================================================= -->

    <div class="options-row">

      <label class="checkbox-wrapper">

        <input
          type="checkbox"
          id="rememberMe"
        >

        <span>
          Remember me
        </span>

      </label>


      <div class="forgot-row">

        <a href="forgot.html">
          Forgot Password?
        </a>

      </div>

    </div>


    <!-- ======================================================
         RECAPTCHA
    ======================================================= -->

    <div class="recaptcha-box">

      <div
        class="g-recaptcha"
        data-sitekey="6LeBaj4tAAAAAG4tn09wVhqz5INyaJgfl-5S9Efh"
      ></div>

    </div>


    <!-- ======================================================
         LOGIN BUTTON
    ======================================================= -->

    <button
      type="submit"
      class="btn-primary"
      id="loginBtn"
    >

      Log In

    </button>


    <!-- ======================================================
         LOADING
    ======================================================= -->

    <div
      class="loading"
      id="loading"
    >

      Signing you in...

    </div>


  </form>


  <!-- ========================================================
       DIVIDER
  ========================================================= -->

  <div class="divider">

    <span>
      Or login with
    </span>

  </div>


  <!-- ========================================================
       GOOGLE
  ========================================================= -->

  <button
    type="button"
    class="social-btn google-btn"
    id="googleBtn"
  >

    <i class="fab fa-google"></i>

    <span id="googleText">
      Continue with Google
    </span>

  </button>


  <!-- ========================================================
       YAHOO
  ========================================================= -->

  <button
    type="button"
    class="social-btn yahoo-btn"
    id="yahooBtn"
  >

    <i class="fab fa-yahoo"></i>

    <span id="yahooText">
      Continue with Yahoo
    </span>

  </button>


  <!-- ========================================================
       SIGN UP
  ========================================================= -->

  <div class="signup-link">

    Don't have an account?

    <a href="signup.html">
      Sign up
    </a>

  </div>


</div>



<!-- ==========================================================
     FIREBASE LOGIN SCRIPT
=========================================================== -->

<script type="module">


/* ============================================================
   IMPORT YOUR EXISTING AUTHENTICATION SYSTEM
============================================================ */

import {

  logIn,

  signInWithGoogle,

  signInWithYahoo,

  auth

} from "./authentication.js";


/* ============================================================
   FIREBASE PERSISTENCE
============================================================ */

import {

  setPersistence,

  browserLocalPersistence,

  browserSessionPersistence

} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";



/* ============================================================
   ELEMENTS
============================================================ */

const form =
  document.getElementById("loginForm");

const errorMsg =
  document.getElementById("errorMsg");

const successMsg =
  document.getElementById("successMsg");

const loading =
  document.getElementById("loading");

const loginBtn =
  document.getElementById("loginBtn");

const googleBtn =
  document.getElementById("googleBtn");

const yahooBtn =
  document.getElementById("yahooBtn");

const googleText =
  document.getElementById("googleText");

const yahooText =
  document.getElementById("yahooText");



/* ============================================================
   SHOW ERROR
============================================================ */

function showError(message){

  successMsg.style.display = "none";

  errorMsg.textContent = message;

  errorMsg.style.display = "block";

}



/* ============================================================
   SHOW SUCCESS
============================================================ */

function showSuccess(message){

  errorMsg.style.display = "none";

  successMsg.textContent = message;

  successMsg.style.display = "block";

}



/* ============================================================
   HIDE MESSAGES
============================================================ */

function hideMessages(){

  errorMsg.style.display = "none";

  successMsg.style.display = "none";

}



/* ============================================================
   FIREBASE ERROR MESSAGE
============================================================ */

function getFirebaseErrorMessage(error, provider = "login"){

  console.error(
    `${provider} authentication error:`,
    error
  );


  const code =
    error?.code || "";


  /* ----------------------------------------------------------
     EMAIL AUTH ERRORS
  ---------------------------------------------------------- */

  if(code === "auth/user-not-found"){

    return "No Code Academy account was found with this email address.";

  }


  if(code === "auth/wrong-password"){

    return "The password you entered is incorrect.";

  }


  if(code === "auth/invalid-credential"){

    return "The email or password is incorrect. Please check your details and try again.";

  }


  if(code === "auth/invalid-email"){

    return "Please enter a valid email address.";

  }


  if(code === "auth/missing-password"){

    return "Please enter your password.";

  }


  if(code === "auth/user-disabled"){

    return "This account has been disabled. Please contact Code Academy support.";

  }


  /* ----------------------------------------------------------
     NETWORK
  ---------------------------------------------------------- */

  if(code === "auth/network-request-failed"){

    return "Network connection failed. Please check your internet connection and try again.";

  }


  /* ----------------------------------------------------------
     TOO MANY ATTEMPTS
  ---------------------------------------------------------- */

  if(code === "auth/too-many-requests"){

    return "Too many login attempts were made. Please wait a while before trying again.";

  }


  /* ----------------------------------------------------------
     GOOGLE
  ---------------------------------------------------------- */

  if(code === "auth/popup-closed-by-user"){

    return "The Google login window was closed before sign-in was completed.";

  }


  if(code === "auth/popup-blocked"){

    return "Your browser blocked the Google login popup. Please allow popups for this site and try again.";

  }


  if(code === "auth/cancelled-popup-request"){

    return "Another login popup is already open. Please finish that login first.";

  }


  if(code === "auth/account-exists-with-different-credential"){

    return "An account already exists with this email using a different sign-in method.";

  }


  /* ----------------------------------------------------------
     PROVIDER
  ---------------------------------------------------------- */

  if(code === "auth/operation-not-allowed"){

    return `${provider} login is currently not enabled in Firebase.`;

  }


  if(code === "auth/unauthorized-domain"){

    return "This website domain is not authorized in Firebase Authentication.";

  }


  /* ----------------------------------------------------------
     FIREBASE CONFIG
  ---------------------------------------------------------- */

  if(code === "auth/invalid-api-key"){

    return "Firebase configuration error. Please contact the site administrator.";

  }


  if(code === "auth/app-not-authorized"){

    return "This application is not authorized to use Firebase Authentication.";

  }


  /* ----------------------------------------------------------
     STORAGE / BROWSER
  ---------------------------------------------------------- */

  if(code === "auth/web-storage-unsupported"){

    return "Your browser does not support the required storage features. Please try another browser.";

  }


  /* ----------------------------------------------------------
     OFFLINE
  ---------------------------------------------------------- */

  if(!navigator.onLine){

    return "You are currently offline. Please connect to the internet and try again.";

  }


  /* ----------------------------------------------------------
     GENERIC ERROR MESSAGE
  ---------------------------------------------------------- */

  if(error?.message){

    return error.message;

  }


  return `${provider} login failed. Please try again.`;

}



/* ============================================================
   SET BUTTON STATE
============================================================ */

function setSocialButtonsDisabled(disabled){

  googleBtn.disabled = disabled;

  yahooBtn.disabled = disabled;

}



/* ============================================================
   EMAIL + PASSWORD LOGIN
============================================================ */

form.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();

    hideMessages();


    /* --------------------------------------------------------
       CHECK INTERNET
    -------------------------------------------------------- */

    if(!navigator.onLine){

      showError(
        "You are offline. Please connect to the internet before logging in."
      );

      return;
    }


    /* --------------------------------------------------------
       CHECK RECAPTCHA
    -------------------------------------------------------- */

    if(
      typeof grecaptcha === "undefined"
    ){

      showError(
        "reCAPTCHA could not load. Please refresh the page and try again."
      );

      return;
    }


    let recaptchaResponse = "";

    try{

      recaptchaResponse =
        grecaptcha.getResponse();

    }catch(error){

      console.error(
        "reCAPTCHA error:",
        error
      );

      showError(
        "reCAPTCHA is not ready. Please refresh the page and try again."
      );

      return;
    }


    if(!recaptchaResponse){

      showError(
        "Please complete the reCAPTCHA verification before logging in."
      );

      return;
    }


    /* --------------------------------------------------------
       GET FORM VALUES
    -------------------------------------------------------- */

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;

    const rememberMe =
      document
        .getElementById("rememberMe")
        .checked;


    /* --------------------------------------------------------
       BASIC VALIDATION
    -------------------------------------------------------- */

    if(!email){

      showError(
        "Please enter your email address."
      );

      return;
    }


    if(!password){

      showError(
        "Please enter your password."
      );

      return;
    }


    /* --------------------------------------------------------
       START LOADING
    -------------------------------------------------------- */

    loginBtn.disabled = true;

    setSocialButtonsDisabled(true);

    loading.textContent =
      "Signing you in...";

    loading.style.display =
      "block";


    try{


      /* ------------------------------------------------------
         REMEMBER ME
      ------------------------------------------------------ */

      const persistenceType =
        rememberMe
          ? browserLocalPersistence
          : browserSessionPersistence;


      await setPersistence(
        auth,
        persistenceType
      );


      /* ------------------------------------------------------
         FIREBASE EMAIL LOGIN
      ------------------------------------------------------ */

      await logIn(
        email,
        password
      );


      /* ------------------------------------------------------
         SUCCESS
      ------------------------------------------------------ */

      showSuccess(
        "Login successful! Opening Code Academy..."
      );


      loading.textContent =
        "Opening your account...";


      /* ------------------------------------------------------
         GO TO MENU
      ------------------------------------------------------ */

      setTimeout(
        () => {

          window.location.href =
            "menu.html";

        },
        500
      );


    }catch(error){


      console.error(
        "Email login failed:",
        error
      );


      loginBtn.disabled =
        false;

      setSocialButtonsDisabled(
        false
      );

      loading.style.display =
        "none";


      /* ------------------------------------------------------
         RESET RECAPTCHA
      ------------------------------------------------------ */

      if(
        typeof grecaptcha !== "undefined"
      ){

        try{

          grecaptcha.reset();

        }catch(recaptchaError){

          console.warn(
            "Could not reset reCAPTCHA:",
            recaptchaError
          );

        }

      }


      /* ------------------------------------------------------
         SHOW ERROR
      ------------------------------------------------------ */

      showError(
        getFirebaseErrorMessage(
          error,
          "Email"
        )
      );

    }

  }
);



/* ============================================================
   GOOGLE LOGIN
============================================================ */

googleBtn.addEventListener(
  "click",
  async () => {

    hideMessages();


    /* --------------------------------------------------------
       CHECK INTERNET
    -------------------------------------------------------- */

    if(!navigator.onLine){

      showError(
        "You are offline. Please connect to the internet before using Google login."
      );

      return;
    }


    /* --------------------------------------------------------
       BUTTON STATE
    -------------------------------------------------------- */

    setSocialButtonsDisabled(
      true
    );

    loginBtn.disabled =
      true;

    googleText.textContent =
      "Connecting to Google...";


    try{


      /* ------------------------------------------------------
         GOOGLE POPUP LOGIN

         signInWithGoogle() in authentication.js uses
         signInWithPopup().
      ------------------------------------------------------ */

      const user =
        await signInWithGoogle();


      /* ------------------------------------------------------
         SUCCESS
      ------------------------------------------------------ */

      showSuccess(
        `Welcome back ${
          user?.displayName || "to Code Academy"
        }! Opening your account...`
      );


      googleText.textContent =
        "Login successful";


      /* ------------------------------------------------------
         GO TO MENU
      ------------------------------------------------------ */

      setTimeout(
        () => {

          window.location.href =
            "menu.html";

        },
        500
      );


    }catch(error){


      console.error(
        "Google login failed:",
        error
      );


      /* ------------------------------------------------------
         RESTORE BUTTONS
      ------------------------------------------------------ */

      setSocialButtonsDisabled(
        false
      );

      loginBtn.disabled =
        false;

      googleText.textContent =
        "Continue with Google";


      /* ------------------------------------------------------
         SHOW ERROR
      ------------------------------------------------------ */

      showError(
        getFirebaseErrorMessage(
          error,
          "Google"
        )
      );

    }

  }
);



/* ============================================================
   YAHOO LOGIN
============================================================ */

yahooBtn.addEventListener(
  "click",
  async () => {

    hideMessages();


    /* --------------------------------------------------------
       CHECK INTERNET
    -------------------------------------------------------- */

    if(!navigator.onLine){

      showError(
        "You are offline. Please connect to the internet before using Yahoo login."
      );

      return;
    }


    /* --------------------------------------------------------
       BUTTON STATE
    -------------------------------------------------------- */

    setSocialButtonsDisabled(
      true
    );

    loginBtn.disabled =
      true;

    yahooText.textContent =
      "Connecting to Yahoo...";


    try{


      /* ------------------------------------------------------
         YAHOO POPUP LOGIN
      ------------------------------------------------------ */

      const user =
        await signInWithYahoo();


      /* ------------------------------------------------------
         SUCCESS
      ------------------------------------------------------ */

      showSuccess(
        `Welcome back ${
          user?.displayName || "to Code Academy"
        }! Opening your account...`
      );


      yahooText.textContent =
        "Login successful";


      /* ------------------------------------------------------
         GO TO MENU
      ------------------------------------------------------ */

      setTimeout(
        () => {

          window.location.href =
            "menu.html";

        },
        500
      );


    }catch(error){


      console.error(
        "Yahoo login failed:",
        error
      );


      /* ------------------------------------------------------
         RESTORE BUTTONS
      ------------------------------------------------------ */

      setSocialButtonsDisabled(
        false
      );

      loginBtn.disabled =
        false;

      yahooText.textContent =
        "Continue with Yahoo";


      /* ------------------------------------------------------
         SHOW ERROR
      ------------------------------------------------------ */

      showError(
        getFirebaseErrorMessage(
          error,
          "Yahoo"
        )
      );

    }

  }
);



/* ============================================================
   PREVENT STALE LOADING STATE
============================================================ */

window.addEventListener(
  "pageshow",
  () => {

    loginBtn.disabled =
      false;

    googleBtn.disabled =
      false;

    yahooBtn.disabled =
      false;

    loading.style.display =
      "none";

    googleText.textContent =
      "Continue with Google";

    yahooText.textContent =
      "Continue with Yahoo";

  }
);


</script>

</body>

</html>
