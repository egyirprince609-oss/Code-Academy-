<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Code Academy Editor</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
  --bg:#0d1117;
  --sidebar:#161b22;
  --editor:#0d1117;
  --border:#30363d;
  --primary:#1f6feb;
  --success:#3fb950;
  --danger:#f85149;
  --warning:#d29922;
  --text:#c9d1d9;
  --text-dim:#8b949e;
  --active:#21262d;
  --hover:#30363d;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'JetBrains Mono','Consolas',monospace;
}

html,
body{
  width:100%;
  height:100dvh;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
}

button,
input{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
  height:56px;
  background:var(--sidebar);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 16px;
  gap:10px;
  flex-shrink:0;
}

.menuBtn,
.soundBtn{
  width:42px;
  height:42px;
  background:var(--active);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  flex-shrink:0;
}

.menuBtn:hover,
.soundBtn:hover{
  border-color:var(--primary);
  background:var(--hover);
}

.soundBtn.muted{
  opacity:.4;
}

.projectName{
  flex:1;
  min-width:0;
  font-size:15px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin:0 12px;
}

.actionBtn{
  padding:8px 14px;
  background:var(--active);
  border:1px solid var(--border);
  border-radius:6px;
  color:var(--text);
  font-size:12px;
  font-weight:600;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  white-space:nowrap;
}

.actionBtn:hover{
  background:var(--hover);
  border-color:var(--primary);
}

.actionBtn.primary{
  background:var(--primary);
  border-color:var(--primary);
  color:white;
}

.actionBtn.play{
  background:var(--success);
  border-color:var(--success);
  color:white;
}

.actionBtn.danger{
  background:var(--danger);
  border-color:var(--danger);
  color:white;
}

.actionBtn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
  width:280px;
  background:var(--sidebar);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  position:fixed;
  left:-280px;
  top:0;
  height:100dvh;
  z-index:1000;
  transition:left .3s ease;
  box-shadow:10px 0 30px rgba(0,0,0,.25);
}

.sidebar.active{
  left:0;
}

.sidebarHeader{
  height:56px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
  font-weight:700;
  font-size:14px;
  flex-shrink:0;
}

.sidebarActions{
  display:flex;
  gap:6px;
}

.sidebarBtn{
  width:34px;
  height:34px;
  background:var(--active);
  border:1px solid var(--border);
  border-radius:6px;
  color:var(--text);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
}

.sidebarBtn:hover{
  background:var(--primary);
  border-color:var(--primary);
  color:white;
}

.projectsSection{
  border-bottom:1px solid var(--border);
  max-height:220px;
  overflow-y:auto;
  flex-shrink:0;
}

.sectionTitle{
  padding:12px 16px 8px;
  font-size:11px;
  color:var(--text-dim);
  text-transform:uppercase;
  font-weight:700;
  letter-spacing:.5px;
}

.projectItem,
.fileItem{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  cursor:pointer;
  border-radius:6px;
  margin:2px 8px;
  position:relative;
  user-select:none;
}

.projectItem{
  padding:8px 16px;
}

.fileItem{
  padding:8px 16px 8px 32px;
  font-size:13px;
}

.projectItem:hover,
.fileItem:hover{
  background:var(--hover);
}

.projectItem.active,
.fileItem.active{
  background:var(--active);
  color:var(--primary);
}

.projectItem.active{
  border-left:3px solid var(--primary);
}

.fileItem.active::before{
  content:'';
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:3px;
  background:var(--primary);
}

.itemText{
  flex:1;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.deleteBtn{
  width:26px;
  height:26px;
  background:transparent;
  border:none;
  color:var(--text-dim);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:4px;
  margin-left:auto;
  opacity:0;
  flex-shrink:0;
}

.projectItem:hover .deleteBtn,
.fileItem:hover .deleteBtn,
.editorTab:hover .deleteBtn{
  opacity:1;
}

.deleteBtn:hover{
  background:var(--danger);
  color:white;
}

.fileExplorer{
  flex:1;
  overflow-y:auto;
  padding:10px 0;
  min-height:0;
}

/* =========================================================
   MAIN
========================================================= */

.main{
  display:flex;
  flex-direction:column;
  width:100%;
  height:100dvh;
  transition:margin-left .3s ease;
}

.main.shifted{
  margin-left:280px;
  width:calc(100% - 280px);
}

.workspace{
  flex:1;
  display:flex;
  overflow:hidden;
  position:relative;
  min-height:0;
}

.editorPane{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
  min-height:0;
}

.editorTabs{
  height:42px;
  background:var(--sidebar);
  display:flex;
  border-bottom:1px solid var(--border);
  overflow-x:auto;
  flex-shrink:0;
}

.editorTab{
  padding:0 14px;
  height:100%;
  display:flex;
  align-items:center;
  font-size:12px;
  cursor:pointer;
  border-right:1px solid var(--border);
  color:var(--text-dim);
  white-space:nowrap;
  position:relative;
  gap:8px;
}

.editorTab:hover{
  color:var(--text);
  background:var(--hover);
}

.editorTab.active{
  background:var(--editor);
  color:var(--text);
}

.editorTab.active::after{
  content:'';
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:2px;
  background:var(--primary);
}

#monacoEditor{
  flex:1;
  min-height:0;
  width:100%;
}

#fallbackEditor{
  flex:1;
  display:none;
  width:100%;
  background:var(--editor);
  color:var(--text);
  border:none;
  padding:16px;
  font-family:'JetBrains Mono',monospace;
  font-size:14px;
  line-height:1.6;
  resize:none;
  outline:none;
  min-height:0;
}

.loadingBox{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:15px;
  color:var(--primary);
  min-height:200px;
}

/* =========================================================
   PREVIEW
========================================================= */

.rightPane{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100dvh;
  background:var(--bg);
  z-index:1500;
  flex-direction:column;
}

.rightPane.active{
  display:flex;
}

.previewHeader{
  height:56px;
  background:var(--sidebar);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  border-bottom:2px solid var(--primary);
  font-size:14px;
  flex-shrink:0;
}

.previewHeaderLeft{
  display:flex;
  align-items:center;
  gap:12px;
}

#previewFrame{
  flex:1;
  border:none;
  background:white;
  min-height:0;
  width:100%;
}

/* =========================================================
   CONSOLE
========================================================= */

.consolePanel{
  height:0;
  background:var(--sidebar);
  border-top:2px solid var(--border);
  display:none;
  flex-direction:column;
  flex-shrink:0;
}

.consolePanel.active{
  height:210px;
  display:flex;
}

.consoleHeader{
  height:42px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
  font-size:12px;
  color:var(--text-dim);
  flex-shrink:0;
}

.consoleOutput{
  flex:1;
  overflow-y:auto;
  padding:12px 16px;
  font-size:12px;
  font-family:'JetBrains Mono',monospace;
  min-height:0;
}

.consoleLine{
  margin:4px 0;
  white-space:pre-wrap;
  word-break:break-word;
}

.console-log{
  color:var(--text);
}

.console-error{
  color:var(--danger);
}

.console-warn{
  color:var(--warning);
}

.console-info{
  color:var(--primary);
}

/* =========================================================
   MODALS
========================================================= */

.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100dvh;
  background:rgba(0,0,0,.9);
  backdrop-filter:blur(5px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:3000;
  padding:20px;
}

.modal.active{
  display:flex;
}

.modalBox{
  background:var(--sidebar);
  border:1px solid var(--border);
  border-radius:16px;
  padding:30px;
  width:100%;
  max-width:420px;
  animation:scaleIn .2s ease;
}

@keyframes scaleIn{
  from{
    transform:scale(.9);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}

.modalBox h3{
  margin-bottom:12px;
  font-size:20px;
  text-align:center;
}

.modalBox p{
  color:var(--text-dim);
  font-size:14px;
  margin-bottom:20px;
  text-align:center;
  line-height:1.6;
}

.modalBox input{
  width:100%;
  padding:12px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  margin-bottom:15px;
  font-size:14px;
  outline:none;
}

.modalBox input:focus{
  border-color:var(--primary);
}

.modalActions{
  display:flex;
  gap:10px;
}

.btn{
  flex:1;
  padding:12px;
  border-radius:8px;
  border:none;
  font-weight:600;
  cursor:pointer;
  font-size:14px;
}

.btn-primary{
  background:var(--primary);
  color:white;
}

.btn-secondary{
  background:var(--active);
  color:var(--text);
}

.btn-danger{
  background:var(--danger);
  color:white;
}

.btn:hover{
  filter:brightness(1.1);
}

/* =========================================================
   STATUS
========================================================= */

.statusBar{
  height:28px;
  background:var(--sidebar);
  border-top:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 16px;
  font-size:11px;
  color:var(--text-dim);
  gap:20px;
  flex-shrink:0;
}

.saveIndicator{
  margin-left:auto;
}

.saveIndicator.saved{
  color:var(--success);
}

.saveIndicator.unsaved{
  color:var(--warning);
}

.saveIndicator.error{
  color:var(--danger);
}

/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;
  left:50%;
  bottom:45px;
  transform:translateX(-50%) translateY(20px);
  background:var(--sidebar);
  border:1px solid var(--border);
  color:var(--text);
  padding:12px 18px;
  border-radius:10px;
  font-size:12px;
  z-index:5000;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  max-width:90%;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.toast.success{
  border-color:var(--success);
}

.toast.error{
  border-color:var(--danger);
}

.toast.warning{
  border-color:var(--warning);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:768px){

  .topbar{
    padding:0 8px;
    gap:5px;
  }

  .projectName{
    margin:0 4px;
    font-size:13px;
  }

  .actionBtn{
    padding:8px 10px;
  }

  .actionBtn span{
    display:none;
  }

  .sidebar{
    width:270px;
    left:-270px;
  }

  .sidebar.active{
    left:0;
  }

  .main.shifted{
    margin-left:0;
    width:100%;
  }

  .previewHeader{
    padding:0 10px;
  }

  .previewHeaderLeft{
    gap:6px;
  }

  .statusBar{
    padding:0 8px;
    gap:10px;
  }
}
</style>
</head>

<body>

<!-- =========================================================
     SIDEBAR
========================================================= -->

<div class="sidebar" id="sidebar">

  <div class="sidebarHeader">

    <span>
      <i class="fa fa-folder-open"></i>
      EXPLORER
    </span>

    <div class="sidebarActions">

      <button class="sidebarBtn"
              id="newProjectBtn"
              title="New Project">
        <i class="fa fa-plus-square"></i>
      </button>

      <button class="sidebarBtn"
              id="newFileBtn"
              title="New File">
        <i class="fa fa-file"></i>
      </button>

      <button class="sidebarBtn"
              id="newFolderBtn"
              title="New Folder">
        <i class="fa fa-folder-plus"></i>
      </button>

    </div>

  </div>

  <div class="projectsSection">

    <div class="sectionTitle">
      Projects
    </div>

    <div id="projectsList"></div>

  </div>

  <div class="fileExplorer"
       id="fileExplorer"></div>

</div>


<!-- =========================================================
     MAIN
========================================================= -->

<div class="main" id="main">

  <div class="topbar">

    <button class="menuBtn"
            id="menuBtn"
            title="Explorer">
      <i class="fa fa-bars"></i>
    </button>

    <div class="projectName"
         id="projectName">
      Loading...
    </div>

    <button class="actionBtn"
            id="formatBtn">
      <i class="fa fa-magic"></i>
      <span>Format</span>
    </button>

    <button class="actionBtn play"
            id="playBtn">
      <i class="fa fa-play"></i>
      <span>RUN</span>
    </button>

    <button class="actionBtn primary"
            id="saveBtn">
      <i class="fa fa-save"></i>
      <span>Save</span>
    </button>

    <button class="soundBtn"
            id="soundBtn"
            title="Sound">
      <i class="fa fa-volume-up"></i>
    </button>

  </div>


  <div class="workspace">

    <div class="editorPane">

      <div class="editorTabs"
           id="editorTabs"></div>

      <div id="monacoEditor">

        <div class="loadingBox">

          <i class="fa fa-spinner fa-spin fa-2x"></i>

          <p>
            Loading Monaco Editor...
          </p>

        </div>

      </div>

      <textarea
        id="fallbackEditor"
        placeholder="Basic editor active..."></textarea>

    </div>


    <!-- =====================================================
         PREVIEW
    ====================================================== -->

    <div class="rightPane"
         id="rightPane">

      <div class="previewHeader">

        <div class="previewHeaderLeft">

          <span>
            <i class="fa fa-expand"></i>
            Live Preview
          </span>

          <button class="actionBtn"
                  id="toggleConsole">

            <i class="fa fa-terminal"></i>

            Console

          </button>

        </div>

        <button class="actionBtn"
                id="closePreview">

          <i class="fa fa-times"></i>

          Close

        </button>

      </div>

      <iframe
        id="previewFrame"
        sandbox="allow-scripts allow-modals"></iframe>


      <div class="consolePanel"
           id="consolePanel">

        <div class="consoleHeader">

          <span>
            <i class="fa fa-terminal"></i>
            Console Output
          </span>

          <button class="actionBtn"
                  id="clearConsole">

            <i class="fa fa-trash"></i>

            Clear

          </button>

        </div>

        <div class="consoleOutput"
             id="consoleOutput">

          <div class="consoleLine console-info">
            Click RUN to execute code...
          </div>

        </div>

      </div>

    </div>

  </div>


  <!-- STATUS -->

  <div class="statusBar">

    <span id="lineCol">
      Line 1, Column 1
    </span>

    <span id="langType">
      HTML
    </span>

    <span class="saveIndicator"
          id="saveStatus">
      Checking account...
    </span>

  </div>

</div>


<!-- =========================================================
     NEW PROJECT MODAL
========================================================= -->

<div class="modal"
     id="newProjectModal">

  <div class="modalBox">

    <h3>
      <i class="fa fa-plus-square"></i>
      Create New Project
    </h3>

    <input
      type="text"
      id="projName"
      maxlength="80"
      placeholder="Enter project name">

    <div class="modalActions">

      <button class="btn btn-secondary"
              id="cancelProjectBtn">
        Cancel
      </button>

      <button class="btn btn-primary"
              id="createProjectBtn">
        Create
      </button>

    </div>

  </div>

</div>


<!-- =========================================================
     NEW FILE/FOLDER MODAL
========================================================= -->

<div class="modal"
     id="newItemModal">

  <div class="modalBox">

    <h3 id="itemModalTitle">
      <i class="fa fa-file"></i>
      Create New File
    </h3>

    <input
      type="text"
      id="newItemName"
      maxlength="120"
      placeholder="filename.html">

    <div class="modalActions">

      <button class="btn btn-secondary"
              id="cancelItemBtn">
        Cancel
      </button>

      <button class="btn btn-primary"
              id="createItemBtn">
        Create
      </button>

    </div>

  </div>

</div>


<!-- =========================================================
     DELETE MODAL
========================================================= -->

<div class="modal"
     id="deleteModal">

  <div class="modalBox">

    <h3 id="deleteTitle">
      Delete Item
    </h3>

    <p id="deleteMsg">
      Are you sure?
    </p>

    <div class="modalActions">

      <button class="btn btn-secondary"
              id="cancelDeleteBtn">
        Cancel
      </button>

      <button class="btn btn-danger"
              id="confirmDeleteBtn">
        Delete
      </button>

    </div>

  </div>

</div>


<!-- =========================================================
     TOAST
========================================================= -->

<div class="toast"
     id="toast"></div>


<script type="module">
/* ============================================================
   CODE ACADEMY EDITOR
   IMPORTANT:
   This page uses the SAME Firebase instance as the rest
   of Code Academy through ./authentication.js.

   There is NO initializeApp() here.
   There is NO separate Firebase configuration here.
============================================================ */

"use strict";


/* ============================================================
   MONACO WORKER
============================================================ */

self.MonacoEnvironment = {

  getWorkerUrl:function(){

    return "data:text/javascript;charset=utf-8," +
      encodeURIComponent(`
        self.MonacoEnvironment = {
          baseUrl:
          "https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/"
        };

        importScripts(
          "https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/base/worker/workerMain.js"
        );
      `);
  }

};


/* ============================================================
   FIREBASE IMPORTS

   authentication.js is the SINGLE source of truth for:
   - auth
   - db
   - storage
============================================================ */

import {
  auth,
  db,
  storage,
  onAuthStateChanged
} from "./authentication.js";


import {
  collection,
  doc,
  getDoc,
  getDocs,
  setDoc,
  deleteDoc,
  query,
  orderBy,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


/* ============================================================
   GLOBAL STATE
============================================================ */

let editor = null;

let fallbackEditor = null;

let useFallback = false;

let editorReady = false;

let currentUser = null;

let currentFile = "index.html";

let files = {};

let folders = {};

let allProjects = [];

let projectId =
  new URLSearchParams(location.search).get("id");

let creatingType = "file";

let deleteTarget = null;

let soundEnabled = true;

let consoleVisible = false;

let dirty = false;

let authResolved = false;

let saveInProgress = false;

let monacoFallbackTimer = null;

let toastTimer = null;


/*
   If no project ID was supplied, create/use a local default
   project identifier. The project is still stored privately
   inside the authenticated user's account.
*/

if(!projectId){
  projectId = "default";
}


/* ============================================================
   DOM SHORTCUT
============================================================ */

const $ = id => document.getElementById(id);


/* ============================================================
   TOAST SYSTEM
============================================================ */

function showToast(message, type = "info"){

  const toast = $("toast");

  clearTimeout(toastTimer);

  toast.textContent = message;

  toast.className =
    "toast show " + type;

  toastTimer = setTimeout(() => {

    toast.className = "toast";

  }, 3500);
}


/* ============================================================
   SAVE STATUS
============================================================ */

function setSaveStatus(message, type = ""){

  const el = $("saveStatus");

  el.textContent = message;

  el.className =
    "saveIndicator " + type;
}


function markUnsaved(){

  dirty = true;

  setSaveStatus(
    "● Unsaved changes",
    "unsaved"
  );
}


/* ============================================================
   SOUND
============================================================ */

let audioCtx = null;


function getAudioContext(){

  if(!audioCtx){

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if(AudioContext){

      audioCtx =
        new AudioContext();

    }

  }

  return audioCtx;
}


function playSound(type = "click"){

  if(!soundEnabled) return;

  try{

    const ctx =
      getAudioContext();

    if(!ctx) return;

    if(ctx.state === "suspended"){
      ctx.resume();
    }

    const osc =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    osc.connect(gain);

    gain.connect(ctx.destination);

    const frequencies = {

      click:800,

      success:600,

      warning:400,

      error:220

    };

    osc.frequency.value =
      frequencies[type] || 800;

    gain.gain.value = .06;

    osc.start();

    osc.stop(
      ctx.currentTime + .08
    );

  }catch(error){

    console.debug(
      "Sound unavailable",
      error
    );

  }

}


/* ============================================================
   AUTHENTICATION
============================================================ */

onAuthStateChanged(
  auth,
  async user => {

    authResolved = true;

    if(!user){

      currentUser = null;

      setSaveStatus(
        "Not signed in",
        "error"
      );

      /*
        The editor belongs to authenticated users.
        Do not allow an unauthenticated user to reach
        private project data.
      */

      window.location.replace(
        "login.html"
      );

      return;
    }


    currentUser = user;


    /*
      Your security rules require verified email accounts.
    */

    if(!user.emailVerified){

      setSaveStatus(
        "Email verification required",
        "error"
      );

      showToast(
        "Verify your email before saving private projects.",
        "warning"
      );

    }else{

      setSaveStatus(
        "Account secured",
        "saved"
      );

    }


    try{

      await loadProjectsList();

      await loadProject();

    }catch(error){

      console.error(
        "Editor initialization error:",
        error
      );

      handleFirebaseError(
        error,
        "Unable to load your projects."
      );

    }

  }
);


/* ============================================================
   FIREBASE ERROR HANDLER
============================================================ */

function handleFirebaseError(
  error,
  fallbackMessage = "Something went wrong."
){

  console.error(error);

  const code =
    error?.code || "";

  let message =
    fallbackMessage;


  if(
    code === "permission-denied" ||
    code === "PERMISSION_DENIED"
  ){

    if(
      currentUser &&
      !currentUser.emailVerified
    ){

      message =
        "Firebase blocked this action because your email is not verified.";

    }else{

      message =
        "Firebase denied access. Check that you are signed into the correct Code Academy account and that Firestore Rules allow this operation.";

    }

  }else if(
    code === "unauthenticated"
  ){

    message =
      "Your session has expired. Please log in again.";

  }else if(
    code === "unavailable"
  ){

    message =
      "Firebase is temporarily unavailable. Check your internet connection.";

  }else if(
    code === "failed-precondition"
  ){

    message =
      "Firebase needs an additional configuration before this operation can work.";

  }else if(
    error?.message
  ){

    message =
      error.message;

  }


  setSaveStatus(
    "⚠ " + message,
    "error"
  );

  showToast(
    message,
    "error"
  );

  return message;
}

async function loadMonaco(){

  try{

    const monacoModule =
      await import(
        "https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/+esm"
      );

    window.monaco =
      monacoModule;

    editorReady = true;

    clearTimeout(
      monacoFallbackTimer
    );


    if(
      Object.keys(files).length > 0 &&
      !editor
    ){

      createEditor();

    }

  }catch(error){

    console.error(
      "Monaco failed:",
      error
    );

    enableFallback();

  }

}


function createEditor(){

  if(!editorReady) return;

  if(editor) return;

  fallbackEditor =
    $("fallbackEditor");

  const container =
    $("monacoEditor");

  container.innerHTML = "";


  const file =
    files[currentFile] || {};

  const content =
    typeof file.content === "string"
      ? file.content
      : "";

  const language =
    file.lang || "html";


  try{

    editor =
      window.monaco.editor.create(
        container,
        {

          value:content,

          language:language,

          theme:"vs-dark",

          fontSize:14,

          automaticLayout:true,

          minimap:{
            enabled:false
          },

          tabSize:2,

          wordWrap:"on",

          scrollBeyondLastLine:false,

          smoothScrolling:true,

          cursorBlinking:"smooth",

          renderWhitespace:"selection",

          padding:{
            top:14
          }

        }
      );


    editor.onDidChangeModelContent(
      () => {

        if(
          files[currentFile]
        ){

          files[currentFile].content =
            editor.getValue();

        }

        markUnsaved();

      }
    );


    editor.onDidChangeCursorPosition(
      event => {

        $("lineCol").textContent =
          "Line " +
          event.position.lineNumber +
          ", Column " +
          event.position.column;

      }
    );


  }catch(error){

    console.error(
      "Monaco creation failed:",
      error
    );

    enableFallback();

  }

}


function enableFallback(){

  if(useFallback) return;

  useFallback = true;

  fallbackEditor =
    $("fallbackEditor");

  $("monacoEditor")
    .style.display = "none";

  fallbackEditor.style.display =
    "block";


  fallbackEditor.value =
    files[currentFile]?.content || "";


  fallbackEditor.oninput =
    () => {

      if(
        files[currentFile]
      ){

        files[currentFile].content =
          fallbackEditor.value;

      }

      markUnsaved();

      updateCursorFallback();

    };


  updateCursorFallback();

}


function updateCursorFallback(){

  if(!fallbackEditor) return;

  const position =
    fallbackEditor.selectionStart || 0;

  const before =
    fallbackEditor.value.substring(
      0,
      position
    );

  const lines =
    before.split("\n");

  const line =
    lines.length;

  const column =
    lines[lines.length - 1].length + 1;

  $("lineCol").textContent =
    "Line " +
    line +
    ", Column " +
    column;

}


monacoFallbackTimer =
  setTimeout(() => {

    if(
      !editorReady &&
      !useFallback
    ){

      enableFallback();

    }

  }, 7000);


loadMonaco();

   PROJECTS
============================================================ */

async function loadProjectsList(){

  if(!currentUser) return;


  const projectsRef =
    collection(
      db,
      "users",
      currentUser.uid,
      "projects"
    );


  let snapshot;


  try{

    /*
      Try ordered query first.
    */

    const q =
      query(
        projectsRef,
        orderBy(
          "updatedAt",
          "desc"
        )
      );

    snapshot =
      await getDocs(q);

  }catch(error){

    /*
      If an older project doesn't have
      updatedAt or the query needs an index,
      load without ordering and sort locally.
    */

    console.warn(
      "Ordered project query failed. Loading without order.",
      error
    );

    snapshot =
      await getDocs(
        projectsRef
      );

  }


  allProjects = [];


  snapshot.forEach(
    projectDoc => {

      allProjects.push({

        id:projectDoc.id,

        ...projectDoc.data()

      });

    }
  );


  allProjects.sort(
    (a,b) => {

      const aTime =
        a.updatedAt?.toMillis?.() || 0;

      const bTime =
        b.updatedAt?.toMillis?.() || 0;

      return bTime - aTime;

    }
  );


  renderProjectsList();

}

    empty.style.cssText =

  }


  allProjects.forEach(
    project => {

      const item =
        document.createElement("div");

      item.className =
        "projectItem" +
        (
          project.id === projectId
            ? " active"
            : ""
        );


      const icon =
        document.createElement("i");

      icon.className =
        "fa fa-folder";


      const name =
        document.createElement("span");

      name.className =
        "itemText";

      name.textContent =
        project.name ||
        "Untitled Project";


      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "deleteBtn";

      deleteButton.title =
        "Delete project";

      deleteButton.innerHTML =
        '<i class="fa fa-trash"></i>';


      deleteButton.addEventListener(
        "click",
        event => {

          event.stopPropagation();

          openDeleteModal(
            "project",
            project.id,
            project.name ||
            "Untitled Project"
          );

        }
      );


      item.appendChild(icon);

      item.appendChild(name);

      item.appendChild(
        deleteButton
      );


      item.addEventListener(
        "click",
        () => {

          if(
            project.id === projectId
          ){

            closeSidebar();

            return;

          }


          if(dirty){

            const leave =
              confirm(
                "You have unsaved changes. Switch project anyway?"
              );

            if(!leave) return;

          }


          window.location.href =
            "CODEEDITOR.html?id=" +
            encodeURIComponent(
              project.id
            );

        }
      );


      list.appendChild(item);

    }
  );

}


/* ============================================================
   LOAD CURRENT PROJECT
============================================================ */

async function loadProject(){

  if(!currentUser) return;


  const projectRef =
    doc(
      db,
      "users",
      currentUser.uid,
      "projects",
      projectId
    );


  let snapshot;


  try{

    snapshot =
      await getDoc(
        projectRef
      );

  }catch(error){

    handleFirebaseError(
      error,
      "Unable to load this project."
    );

    return;

  }


  if(snapshot.exists()){

    const data =
      snapshot.data();


    $("projectName").textContent =
      data.name ||
      "Untitled Project";


    files =
      normalizeFiles(
        data.files
      );


    folders =
      data.folders || {};


  }else{

    /*
      If this is the default editor
      and no project exists, create it.
    */

    if(projectId === "default"){

      files =
        getDefaultFiles();

      folders = {};

      $("projectName").textContent =
        "My Project";


      try{

        await saveProject(
          true
        );

      }catch(error){

        return;

      }

    }else{

      showToast(
        "Project not found.",
        "error"
      );

      window.location.replace(
        "projects.html"
      );

      return;

    }

  }


  if(
    !files[currentFile]
  ){

    currentFile =
      Object.keys(files)[0] ||
      "index.html";

  }


  renderFileExplorer();

  renderEditorTabs();

  updateLanguage();


  if(editorReady){

    if(editor){

      switchFile(
        currentFile,
        false
      );

    }else{

      createEditor();

    }

  }


  dirty = false;


  if(currentUser?.emailVerified){

    setSaveStatus(
      "✓ Ready",
      "saved"
    );

  }

}


/* ============================================================
   NORMALIZE FILES
============================================================ */

function normalizeFiles(data){

  if(
    !data ||
    typeof data !== "object"
  ){

    return getDefaultFiles();

  }


  const result = {};


  Object.keys(data).forEach(
    filename => {

      const item =
        data[filename];


      if(
        item &&
        typeof item === "object"
      ){

        result[filename] = {

          lang:
            item.lang ||
            detectLanguage(
              filename
            ),

          content:
            typeof item.content === "string"
              ? item.content
              : ""

        };

      }

    }
  );


  if(
    Object.keys(result).length === 0
  ){

    return getDefaultFiles();

  }


  return result;

}


/* ============================================================
   LANGUAGE DETECTION
============================================================ */

function detectLanguage(filename){

  const lower =
    filename.toLowerCase();


  if(
    lower.endsWith(".html") ||
    lower.endsWith(".htm")
  ){

    return "html";

  }


  if(
    lower.endsWith(".css")
  ){

    return "css";

  }


  if(
    lower.endsWith(".json")
  ){

    return "json";

  }


  if(
    lower.endsWith(".js") ||
    lower.endsWith(".mjs")
  ){

    return "javascript";

  }


  if(
    lower.endsWith(".ts")
  ){

    return "typescript";

  }


  if(
    lower.endsWith(".py")
  ){

    return "python";

  }


  if(
    lower.endsWith(".java")
  ){

    return "java";

  }


  if(
    lower.endsWith(".cpp") ||
    lower.endsWith(".cc")
  ){

    return "cpp";

  }


  if(
    lower.endsWith(".c")
  ){

    return "c";

  }


  if(
    lower.endsWith(".php")
  ){

    return "php";

  }


  if(
    lower.endsWith(".xml")
  ){

    return "xml";

  }


  if(
    lower.endsWith(".sql")
  ){

    return "sql";

  }


  return "plaintext";

}

/* ============================================================
   SWITCH FILE
============================================================ */

function switchFile(
  filename,
  updateUI = true
){

  if(!files[filename]) return;


  currentFile =
    filename;


  const content =
    files[filename].content || "";


  if(
    useFallback &&
    fallbackEditor
  ){

    fallbackEditor.value =
      content;

    updateCursorFallback();

  }else if(
    editor &&
    editorReady
  ){

    const model =
      editor.getModel();


    if(model){

      window.monaco.editor
        .setModelLanguage(
          model,
          files[filename].lang ||
          detectLanguage(filename)
        );

    }


    editor.setValue(
      content
    );

  }


  updateLanguage();


  if(updateUI){

    renderFileExplorer();

    renderEditorTabs();

  }

}


/* ============================================================
   UPDATE LANGUAGE
============================================================ */

function updateLanguage(){

  const language =
    files[currentFile]?.lang ||
    detectLanguage(
      currentFile
    );


  $("langType").textContent =
    language.toUpperCase();

}


/* ============================================================
   SAVE PROJECT
============================================================ */

async function saveProject(
  silent = false
){

  if(!currentUser){

    showToast(
      "You must be logged in.",
      "error"
    );

    return false;

  }


  if(
    !currentUser.emailVerified
  ){

    showToast(
      "Verify your email before saving.",
      "warning"
    );

    setSaveStatus(
      "Email verification required",
      "error"
    );

    return false;

  }


  if(saveInProgress){

    return false;

  }


  if(
    useFallback &&
    fallbackEditor &&
    files[currentFile]
  ){

    files[currentFile].content =
      fallbackEditor.value;

  }


  saveInProgress = true;


  setSaveStatus(
    "Saving...",
    ""
  );


  try{

    const projectRef =
      doc(
        db,
        "users",
        currentUser.uid,
        "projects",
        projectId
      );


    const projectName =
      $("projectName").textContent.trim() ||
      "Untitled Project";


    /*
      Everything is written beneath the
      authenticated user's UID.
    */

    await setDoc(
      projectRef,
      {

        name:projectName,

        files:files,

        folders:folders,

        ownerId:currentUser.uid,

        updatedAt:
          serverTimestamp(),

        ...(projectId === "default"
          ? {
              createdAt:
                serverTimestamp()
            }
          : {})

      },
      {
        merge:true
      }
    );


    dirty = false;


    setSaveStatus(
      "✓ Saved",
      "saved"
    );


    playSound(
      "success"
    );


    if(!silent){

      showToast(
        "Project saved successfully.",
        "success"
      );

    }


    await refreshProjectListSilently();


    return true;


  }catch(error){

    handleFirebaseError(
      error,
      "Could not save your project."
    );

    playSound(
      "error"
    );

    return false;


  }finally{

    saveInProgress = false;

  }

}

      );

async function createProject(){

  if(!currentUser){

    showToast(
      "Please log in first.",
      "error"
    );

    return;

  }


  if(
    !currentUser.emailVerified
  ){

    showToast(
      "Verify your email before creating projects.",
      "warning"
    );

    return;

  }


  const name =
    $("projName")
      .value
      .trim();


  if(!name){

    showToast(
      "Enter a project name.",
      "warning"
    );

    return;

  }


  if(name.length < 2){

    showToast(
      "Project name is too short.",
      "warning"
    );

    return;

  }


  const id =
    "proj_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2,8);


  try{

    await setDoc(
      doc(
        db,
        "users",
        currentUser.uid,
        "projects",
        id
      ),
      {

        name:name,

        ownerId:
          currentUser.uid,

        files:
          getDefaultFiles(),

        folders:{},

        createdAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp()

      }
    );


    $("newProjectModal")
      .classList.remove("active");


    $("projName").value = "";


    playSound(
      "success"
    );


    showToast(
      "Project created.",
      "success"
    );


    window.location.href =
      "CODEEDITOR.html?id=" +
      encodeURIComponent(id);


  }catch(error){

    handleFirebaseError(
      error,
      "Could not create the project."
    );

  }

}

  .addEventListener(

async function createItem(){

  const name =
    $("newItemName")
      .value
      .trim();


  if(!name){

    showToast(
      "Enter a name.",
      "warning"
    );

    return;

  }


  if(
    /[.#$[\]/]/.test(name)
  ){

    showToast(
      "Use a simple file or folder name.",
      "warning"
    );

    return;

  }


  if(creatingType === "folder"){

    if(folders[name]){

      showToast(
        "That folder already exists.",
        "warning"
      );

      return;

    }


    folders[name] =
      true;


    const indexFile =
      name +
      "/index.html";


    files[indexFile] = {

      lang:"html",

      content:
`<!DOCTYPE html>
<html>
<head>
  <title>${escapeForCode(name)}</title>
</head>
<body>

  <h1>${escapeForCode(name)}</h1>

</body>
</html>`

    };


    currentFile =
      indexFile;


  }else{

    if(files[name]){

      showToast(
        "That file already exists.",
        "warning"
      );

      return;

    }


    const language =
      detectLanguage(name);


    let starter =
      "";


    if(language === "html"){

      starter =
        "<!DOCTYPE html>\\n<html>\\n<head>\\n</head>\\n<body>\\n\\n</body>\\n</html>";

    }else if(language === "css"){

      starter =
        "/* New CSS file */\\n";

    }else if(language === "javascript"){

      starter =
        "// New JavaScript file\\n";

    }else if(language === "python"){

      starter =
        "# New Python file\\n";

    }else{

      starter =
        "";

    }


    files[name] = {

      lang:language,

      content:starter

    };


    currentFile =
      name;

  }


  $("newItemModal")
    .classList.remove("active");


  $("newItemName").value =
    "";


  renderFileExplorer();

  renderEditorTabs();

  switchFile(
    currentFile,
    false
  );


  markUnsaved();


  /*
    Explicit save is used here.
    This prevents accidental empty documents
    being created by autosave.
  */

  await saveProject();


  playSound(
    "success"
  );

}


/* ============================================================
   ESCAPE CODE TEXT
============================================================ */

function escapeForCode(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");

}

function openDeleteModal(

  name,
  displayName
){

  deleteTarget = {

  };


  $("deleteTitle").textContent =
    "Delete " +
    (
      type === "project"
        ? "Project"
        : type === "folder"
          ? "Folder"
          : "File"
    );


  $("deleteMsg").textContent =

    type === "project"

      ? `Delete project "${displayName}" and all of its stored data?`

      : type === "folder"

        ? `Delete folder "${displayName}" and its files?`

        : `Delete file "${displayName}"?`;


  $("deleteModal")
    .classList.add("active");


  playSound(
    "warning"
  );

}

$("confirmDeleteBtn")
  .addEventListener(
    "click",
    confirmDelete
  );


async function confirmDelete(){

  if(!deleteTarget) return;


  const target =
    deleteTarget;


  if(
    !currentUser
  ){

    showToast(
      "You are not signed in.",
      "error"
    );

    return;

  }


  try{

    if(target.type === "project"){

      await deleteDoc(
        doc(
          db,
          "users",
          currentUser.uid,
          "projects",
          target.name
        )
      );


      closeDeleteModal();


      playSound(
        "success"
      );


      showToast(
        "Project deleted.",
        "success"
      );


      window.location.href =
        "projects.html";


      return;

    }


    if(
      target.type === "folder"
    ){

      Object.keys(files)
        .forEach(
          filename => {

            if(
              filename.startsWith(
                target.name + "/"
              )
            ){

              delete files[
                filename
              ];

            }

          }
        );


      delete folders[
        target.name
      ];


      if(
        currentFile.startsWith(
          target.name + "/"
        )
      ){

        currentFile =
          Object.keys(files)[0] ||
          "index.html";

      }

    }else{

      delete files[
        target.name
      ];


      if(
        currentFile ===
        target.name
      ){

        currentFile =
          Object.keys(files)[0] ||
          "index.html";

      }

    }


    closeDeleteModal();


    renderFileExplorer();

    renderEditorTabs();


    switchFile(
      currentFile,
      false
    );


    markUnsaved();


    await saveProject();


    playSound(
      "success"
    );


  }catch(error){

    handleFirebaseError(
      error,
      "Could not delete the item."
    );

  }

}


/* ============================================================
   FORMAT
============================================================ */

$("formatBtn")
  .addEventListener(
    "click",
    formatCurrentFile
  );


function formatCurrentFile(){

  if(
    !files[currentFile]
  ){

    return;

  }


  let content;


  if(
    useFallback &&
    fallbackEditor
  ){

    content =
      fallbackEditor.value;

  }else if(editor){

    content =
      editor.getValue();

  }else{

    content =
      files[currentFile].content ||
      "";

  }


  const language =
    files[currentFile].lang ||
    detectLanguage(
      currentFile
    );


  /*
    Lightweight formatter.
    It intentionally avoids destroying user's code.
  */

  if(language === "json"){

    try{

      content =
        JSON.stringify(
          JSON.parse(content),
          null,
          2
        );

    }catch(error){

      showToast(
        "The JSON contains a syntax error.",
        "warning"
      );

      return;

    }

  }else if(language === "html"){

    content =
      formatHTML(
        content
      );

  }else{

    content =
      content
        .replace(/\r\n/g,"\n")
        .replace(/[ \t]+$/gm,"");

  }


  files[currentFile].content =
    content;


  if(
    useFallback &&
    fallbackEditor
  ){

    fallbackEditor.value =
      content;

  }else if(editor){

    editor.setValue(
      content
    );

  }


  markUnsaved();

  playSound(
    "success"
  );


  showToast(
    "Code formatted.",
    "success"
  );

}


function formatHTML(html){

  return html
    .replace(/>\s+</g,"><")
    .replace(/></g,">\n<")
    .split("\n")
    .map(
      line =>
        line.trim()
    )
    .filter(
      line =>
        line.length
    )
    .join("\n");

}

function runPreview(){

  if(
    !files["index.html"]
  ){

    showToast(
      "Your project needs an index.html file.",
      "warning"
    );

    return;

  }


  $("rightPane")
    .classList.add("active");

  );

function updatePreview(){

  const html =
    files["index.html"]?.content ||
    "";


  const css =
    files["style.css"]?.content ||
    "";


  const js =
    files["script.js"]?.content ||
    "";


  $("consoleOutput").innerHTML =
    '<div class="consoleLine console-info">Running project...</div>';


  /*
    Remove external CSS/JS references because
    the editor injects local project files.
  */

  let cleanHTML =
    html
      .replace(
        /<link\b[^>]*rel=["']stylesheet["'][^>]*>/gi,
        ""
      )
      .replace(
        /<script\b[^>]*src=["'][^"']*["'][^>]*><\/script>/gi,
        ""
      );


  /*
    Console bridge.
  */

  const bridge = `
<script>

(function(){

  function stringify(value){

    try{

      if(
        typeof value === "object"
        && value !== null
      ){

        return JSON.stringify(value);

      }

      return String(value);

    }catch(error){

      return String(value);

    }

  }


  function send(type,args){

    parent.postMessage(

      {
        source:"code-academy-preview",
        type:type,
        data:args
          .map(stringify)
          .join(" ")
      },

      "*"

    );

  }


  console.log =
    function(){

      send(
        "log",
        Array.from(arguments)
      );

    };


  console.error =
    function(){

      send(
        "error",
        Array.from(arguments)
      );

    };


  console.warn =
    function(){

      send(
        "warn",
        Array.from(arguments)
      );

    };


  window.onerror =
    function(
      message,
      source,
      lineno,
      colno
    ){

      send(
        "error",
        [
          message +
          " (line " +
          lineno +
          ")"
        ]
      );

    };


})();

<\/script>
`;


  const preview =

`<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<style>

${css}

</style>

</head>

<body>

${cleanHTML}

<script>

${js}

<\/script>

${bridge}

</body>

</html>`;


  $("previewFrame").srcdoc =
    preview;

}


/* ============================================================
   PREVIEW MESSAGE SECURITY
============================================================ */

window.addEventListener(
  "message",
  event => {

    /*
      Only accept messages coming from
      our own preview iframe.
    */

    if(
      event.source !==
      $("previewFrame").contentWindow
    ){

      return;

    }


    const data =
      event.data;


    if(
      !data ||
      data.source !==
      "code-academy-preview"
    ){

      return;

    }


    addConsoleLine(
      data.data,
      data.type
    );

  }
);


/* ============================================================
   CONSOLE
============================================================ */

function addConsoleLine(
  message,
  type = "log"
){

  const output =
    $("consoleOutput");


  const initial =
    output.querySelector(
      ".console-info"
    );


  if(
    initial &&
    output.children.length === 1
  ){

    output.innerHTML =
      "";

  }


  const line =
    document.createElement("div");


  line.className =
    "consoleLine console-" +
    (
      ["log","error","warn","info"]
        .includes(type)
        ? type
        : "log"
    );


  line.textContent =
    "> " +
    String(message);


  output.appendChild(
    line
  );


  output.scrollTop =
    output.scrollHeight;

}

/* ============================================================
   KEYBOARD SHORTCUTS
============================================================ */

document.addEventListener(
  "keydown",
  event => {

    /*
      Save
    */

    if(
      (event.ctrlKey ||
       event.metaKey) &&
      event.key.toLowerCase() === "s"
    ){

      event.preventDefault();

      saveProject();

      return;

    }


    /*
      Run
    */

    if(
      (event.ctrlKey ||
       event.metaKey) &&
      event.key === "Enter"
    ){

      event.preventDefault();

      runPreview();

      return;

    }


    /*
      Escape closes modal/sidebar/preview.
    */

    if(
      event.key === "Escape"
    ){

      $("newProjectModal")
        .classList.remove(
          "active"
        );

      $("newItemModal")
        .classList.remove(
          "active"
        );

      $("deleteModal")
        .classList.remove(
          "active"
        );

      closeSidebar();

    }

  }
);
