
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Code Academy Editor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --bg:#0d1117;
  --sidebar:#161b22;
  --editor:#0d1117;
  --border:#30363d;
  --primary:#1f6feb;
  --success:#3fb950;
  --danger:#f85149;
  --text:#c9d1d9;
  --text-dim:#8b949e;
  --active:#21262d;
  --hover:#30363d;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'JetBrains Mono','Consolas',monospace;}
html, body{width:100%;height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);}

.topbar{height:56px;background:var(--sidebar);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0;}
.menuBtn,.soundBtn{width:42px;height:42px;background:var(--active);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.menuBtn:hover,.soundBtn:hover{border-color:var(--primary);background:var(--hover);}
.soundBtn.muted{opacity:0.4;}
.projectName{font-size:15px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 12px;}
.actionBtn{padding:8px 14px;background:var(--active);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.actionBtn.primary{background:var(--primary);border-color:var(--primary);color:white;}
.actionBtn.play{background:var(--success);border-color:var(--success);color:white;}
.actionBtn.danger{background:var(--danger);border-color:var(--danger);color:white;}

.sidebar{width:280px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;left:-280px;top:0;height:100dvh;z-index:1000;transition:left 0.3s ease;}
.sidebar.active{left:0;}
.sidebarHeader{height:56px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);font-weight:700;font-size:14px;flex-shrink:0;}
.sidebarActions{display:flex;gap:6px;}
.sidebarBtn{width:34px;height:34px;background:var(--active);border:1px solid var(--border);border-radius:6px;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;}
.sidebarBtn:hover{background:var(--primary);border-color:var(--primary);}

.projectsSection{border-bottom:1px solid var(--border);max-height:220px;overflow-y:auto;flex-shrink:0;}
.sectionTitle{padding:12px 16px 8px;font-size:11px;color:var(--text-dim);text-transform:uppercase;font-weight:700;letter-spacing:0.5px;}
.projectItem{padding:8px 16px;display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer;border-radius:6px;margin:2px 8px;position:relative;}
.projectItem:hover{background:var(--hover);}
.projectItem.active{background:var(--active);color:var(--primary);border-left:3px solid var(--primary);}

.fileExplorer{flex:1;overflow-y:auto;padding:10px 0;min-height:0;}
.fileItem{padding:8px 16px 8px 32px;display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;border-radius:6px;margin:2px 8px;position:relative;}
.fileItem:hover{background:var(--hover);}
.fileItem.active{background:var(--active);color:var(--primary);}
.fileItem.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary);}

.deleteBtn{
  width:24px;
  height:24px;
  background:transparent;
  border:none;
  color:var(--text-dim);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:4px;
  margin-left:auto;
  opacity:0;
  transition:0.2s;
}
.fileItem:hover.deleteBtn,.projectItem:hover.deleteBtn,.editorTab:hover.deleteBtn{opacity:1;}
.deleteBtn:hover{background:var(--danger);color:white;}

.main{flex:1;display:flex;flex-direction:column;margin-left:0;transition:margin-left 0.3s;width:100%;height:100dvh;}
.main.shifted{margin-left:280px;}
.workspace{flex:1;display:flex;overflow:hidden;position:relative;min-height:0;}
.editorPane{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;}
.editorTabs{height:42px;background:var(--sidebar);display:flex;border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;}
.editorTab{padding:0 16px;height:100%;display:flex;align-items:center;font-size:12px;cursor:pointer;border-right:1px solid var(--border);color:var(--text-dim);white-space:nowrap;position:relative;gap:8px;}
.editorTab:hover{color:var(--text);background:var(--hover);}
.editorTab.active{background:var(--editor);color:var(--text);}
.editorTab.active::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--primary);}

#monacoEditor{flex:1;min-height:0;width:100%;}
#fallbackEditor{flex:1;display:none;width:100%;background:var(--editor);color:var(--text);border:none;padding:16px;font-family:'JetBrains Mono',monospace;font-size:14px;resize:none;outline:none;min-height:0;}

.rightPane{display:none;position:fixed;top:0;left:0;width:100%;height:100dvh;background:var(--bg);z-index:999;flex-direction:column;}
.rightPane.active{display:flex;}
.previewHeader{height:56px;background:var(--sidebar);display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:2px solid var(--primary);font-size:14px;flex-shrink:0;}
.previewHeaderLeft{display:flex;align-items:center;gap:12px;}

.consolePanel{height:0;background:var(--sidebar);border-top:2px solid var(--border);display:none;flex-direction:column;flex-shrink:0;transition:height 0.3s ease;}
.consolePanel.active{height:200px;display:flex;}
.consoleHeader{height:42px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);font-size:12px;color:var(--text-dim);flex-shrink:0;}
.consoleOutput{flex:1;overflow-y:auto;padding:12px 16px;font-size:12px;font-family:'JetBrains Mono',monospace;min-height:0;}
.consoleLine{margin:3px 0;white-space:pre-wrap;word-break:break-word;}
.console-log{color:var(--text);}
.console-error{color:var(--danger);}
.console-warn{color:#d29922;}
.console-info{color:var(--primary);}

#previewFrame{flex:1;border:none;background:white;min-height:0;width:100%;}

.modal{position:fixed;top:0;left:0;width:100%;height:100dvh;background:rgba(0,0,0,0.9);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:2000;padding:20px;}
.modal.active{display:flex;}
.modalBox{background:var(--sidebar);border:1px solid var(--border);border-radius:16px;padding:30px;width:100%;max-width:420px;animation:scaleIn 0.2s ease;}
@keyframes scaleIn{from{transform:scale(0.9);opacity:0;}to{transform:scale(1);opacity:1;}}
.modalBox h3{margin-bottom:12px;font-size:20px;text-align:center;}
.modalBox p{color:var(--text-dim);font-size:14px;margin-bottom:20px;text-align:center;}
.modalBox input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);margin-bottom:15px;font-size:14px;}
.modalActions{display:flex;gap:10px;}
.btn{flex:1;padding:12px;border-radius:8px;border:none;font-weight:600;cursor:pointer;font-size:14px;}
.btn-primary{background:var(--primary);color:white;}
.btn-secondary{background:var(--active);color:var(--text);}
.btn-danger{background:var(--danger);color:white;}

.statusBar{height:28px;background:var(--sidebar);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 16px;font-size:11px;color:var(--text-dim);gap:20px;flex-shrink:0;}
.saveIndicator{margin-left:auto;color:var(--success);}
.loadingBox{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px;color:var(--primary);min-height:200px;}

@media (max-width: 768px){
.topbar{padding:0 10px;gap:6px;}
.actionBtn{padding:8px 10px;}
.actionBtn span{display:none;}
.sidebar{width:260px;}
.main.shifted{margin-left:260px;}
}
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <div class="sidebarHeader">
    <span><i class="fa fa-folder-open"></i> EXPLORER</span>
    <div class="sidebarActions">
      <button class="sidebarBtn" id="newProjectBtn" title="New Project"><i class="fa fa-plus-square"></i></button>
      <button class="sidebarBtn" id="newFileBtn" title="New File"><i class="fa fa-file"></i></button>
      <button class="sidebarBtn" id="newFolderBtn" title="New Folder"><i class="fa fa-folder-plus"></i></button>
    </div>
  </div>

  <div class="projectsSection">
    <div class="sectionTitle">Projects</div>
    <div id="projectsList"></div>
  </div>

  <div class="fileExplorer" id="fileExplorer"></div>
</div>

<div class="main" id="main">
  <div class="topbar">
    <button class="menuBtn" id="menuBtn"><i class="fa fa-bars"></i></button>
    <div class="projectName" id="projectName">Loading...</div>
    <button class="actionBtn" id="formatBtn"><i class="fa fa-magic"></i> <span>Format</span></button>
    <button class="actionBtn play" id="playBtn"><i class="fa fa-play"></i> <span>RUN</span></button>
    <button class="actionBtn primary" id="saveBtn"><i class="fa fa-save"></i> <span>Save</span></button>
    <button class="soundBtn" id="soundBtn"><i class="fa fa-volume-up"></i></button>
  </div>

  <div class="workspace">
    <div class="editorPane">
      <div class="editorTabs" id="editorTabs"></div>
      <div id="monacoEditor">
        <div class="loadingBox">
          <i class="fa fa-spinner fa-spin fa-2x"></i>
          <p>Loading Monaco Editor...</p>
        </div>
      </div>
      <textarea id="fallbackEditor" placeholder="Basic editor active..."></textarea>
    </div>

    <div class="rightPane" id="rightPane">
      <div class="previewHeader">
        <div class="previewHeaderLeft">
          <span><i class="fa fa-expand"></i> Live Preview</span>
          <button class="actionBtn" id="toggleConsole">
            <i class="fa fa-terminal"></i> Console
          </button>
        </div>
        <button class="actionBtn" id="closePreview">
          <i class="fa fa-times"></i> Close
        </button>
      </div>
      <iframe id="previewFrame"></iframe>

      <div class="consolePanel" id="consolePanel">
        <div class="consoleHeader">
          <span><i class="fa fa-terminal"></i> Console Output</span>
          <button class="actionBtn" id="clearConsole"><i class="fa fa-trash"></i> Clear</button>
        </div>
        <div class="consoleOutput" id="consoleOutput">
          <div class="consoleLine console-info">Click RUN to execute code...</div>
        </div>
      </div>
    </div>
  </div>

  <div class="statusBar">
    <span id="lineCol">Line 1, Column 1</span>
    <span id="langType">HTML</span>
    <span class="saveIndicator" id="saveStatus"></span>
  </div>
</div>

<div class="modal" id="newProjectModal">
  <div class="modalBox">
    <h3><i class="fa fa-plus-square"></i> Create New Project</h3>
    <input type="text" id="projName" placeholder="Enter project name">
    <div class="modalActions">
      <button class="btn btn-secondary" id="cancelProjectBtn">Cancel</button>
      <button class="btn btn-primary" id="createProjectBtn">Create</button>
    </div>
  </div>
</div>

<div class="modal" id="newItemModal">
  <div class="modalBox">
    <h3 id="itemModalTitle">Create New File</h3>
    <input type="text" id="newItemName" placeholder="filename.html">
    <div class="modalActions">
      <button class="btn btn-secondary" id="cancelItemBtn">Cancel</button>
      <button class="btn btn-primary" id="createItemBtn">Create</button>
    </div>
  </div>
</div>

<div class="modal" id="deleteModal">
  <div class="modalBox">
    <h3 id="deleteTitle">Delete Item</h3>
    <p id="deleteMsg">Are you sure?</p>
    <div class="modalActions">
      <button class="btn btn-secondary" id="cancelDeleteBtn">Cancel</button>
      <button class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
    </div>
  </div>
</div>



















































<script>
     
     
     
   // FIX MONACO WORKERS - stops "Could not create web worker" error
self.MonacoEnvironment = {
  getWorkerUrl: function(workerId, label) {
    return 'data:text/javascript;charset=utf-8,' + encodeURIComponent(`
      self.MonacoEnvironment = { baseUrl: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/' };
      importScripts('https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/base/worker/workerMain.js');
    `);
  }
};  
     
     
     
let editor=null,fallbackEditor=null,useFallback=false,currentFile='index.html',files={},folders={},projectId=new URLSearchParams(location.search).get('id')||'default',editorReady=false,longPressTimer=null,longPressTarget=null,currentUser=null,creatingType='file',soundEnabled=true,consoleVisible=false,allProjects=[],deleteTarget=null;

window.markUnsaved=function(){document.getElementById('saveStatus').textContent='● Unsaved';};

async function loadMonacoESM(){
  try{
    const monaco = await import('https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/+esm');
    window.monaco = monaco;
    editorReady = true;
    if(Object.keys(files).length > 0) createEditor();
  }catch(e){
    console.error('Monaco failed',e);
    enableFallback();
  }
}

function createEditor(){
  if(!editorReady) return;
  fallbackEditor = document.getElementById('fallbackEditor');
  const container = document.getElementById('monacoEditor');
  container.innerHTML = '';
  const content = files[currentFile]?.content || '// Welcome\n';
  const lang = files[currentFile]?.lang || 'html';
  try{
    editor = monaco.editor.create(container, {
      value: content,
      language: lang,
      theme: 'vs-dark',
      fontSize: 14,
      minimap: {enabled: false},
      automaticLayout: true,
      tabSize: 2,
      wordWrap: 'on'
    });
    editor.onDidChangeModelContent(function(){
      if(files[currentFile]) files[currentFile].content = editor.getValue();
      window.markUnsaved();
    });
    editor.onDidChangeCursorPosition(function(e){
      document.getElementById('lineCol').textContent = 'Line ' + e.position.lineNumber + ', Column ' + e.position.column;
    });
  }catch(e){
    enableFallback();
  }
}

function enableFallback(){
  useFallback = true;
  fallbackEditor = document.getElementById('fallbackEditor');
  document.getElementById('monacoEditor').style.display = 'none';
  fallbackEditor.style.display = 'block';
  fallbackEditor.value = files[currentFile]?.content || '';
  fallbackEditor.addEventListener('input', function(){
    if(files[currentFile]) files[currentFile].content = fallbackEditor.value;
    window.markUnsaved();
  });
}

setTimeout(function(){
  if(!editorReady &&!useFallback) enableFallback();
}, 5000);

loadMonacoESM();

import('https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js').then(function({initializeApp}){
import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js').then(function({getAuth,onAuthStateChanged}){
import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js').then(function({getFirestore,collection,doc,getDoc,getDocs,setDoc,deleteDoc,query,orderBy,serverTimestamp}){

const firebaseConfig = {
  apiKey: "AIzaSyDDHzPkR4jIMz6fcK7M_hdjQk2u6xk-efI",
  authDomain: "code-acada.firebaseapp.com",
  projectId: "code-acada",
  storageBucket: "code-acada.appspot.com",
  messagingSenderId: "155763239454",
  appId: "1:155763239454:web:7fc20b0037dcd8e5621c0f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type){
  if(!soundEnabled) return;
  try{
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value = type==='click'?800:type==='success'?600:type==='warning'?400:200;
    gain.gain.value = 0.08;
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
  }catch(e){}
}

function addLongPress(el, type, name, projectName){
  let pressed = false;
  function start(e){
    pressed = true;
    longPressTarget = el;
    el.classList.add('long-press');
    playSound('warning');
    longPressTimer = setTimeout(function(){
      if(pressed){
        e.preventDefault();
        showDeleteModal(type, name, projectName);
        navigator.vibrate && navigator.vibrate(50);
      }
    }, 600);
  }
  function cancel(){
    pressed = false;
    clearTimeout(longPressTimer);
    el.classList.remove('long-press');
    longPressTarget = null;
  }
  el.addEventListener('touchstart', start, {passive:false});
  el.addEventListener('mousedown', start);
  el.addEventListener('touchend', cancel);
  el.addEventListener('mouseup', cancel);
  el.addEventListener('mouseleave', cancel);
  el.addEventListener('touchmove', cancel);
}

document.getElementById('soundBtn').onclick = function(){
  soundEnabled =!soundEnabled;
  const btn = document.getElementById('soundBtn');
  btn.classList.toggle('muted');
  btn.innerHTML = soundEnabled? '<i class="fa fa-volume-up"></i>' : '<i class="fa fa-volume-mute"></i>';
  playSound('click');
};

document.getElementById('menuBtn').onclick = function(){
  document.getElementById('sidebar').classList.toggle('active');
  document.getElementById('main').classList.toggle('shifted');
  playSound('click');
};

onAuthStateChanged(auth, async function(user){
  if(user){
    currentUser = user;
    await loadProjectsList();
    await loadProject();
  }else{
    location.href = 'login.html';
  }
});

async function loadProjectsList(){
  if(!currentUser) return;
  const q = query(collection(db,'users',currentUser.uid,'projects'), orderBy('updatedAt','desc'));
  const snap = await getDocs(q);
  allProjects = [];
  snap.forEach(function(d){allProjects.push({id:d.id,...d.data()});});
  renderProjectsList();
}

function renderProjectsList(){
  const list = document.getElementById('projectsList');
  list.innerHTML = '';
  if(allProjects.length === 0){
    list.innerHTML = '<div style="padding:15px;text-align:center;color:var(--text-dim);font-size:12px;">No projects</div>';
    return;
  }
  allProjects.forEach(function(p){
    const div = document.createElement('div');
    div.className = 'projectItem' + (p.id===projectId?' active':'');
    div.innerHTML = '<i class="fa fa-folder"></i> ' + (p.name||'Untitled') + '<button class="deleteBtn" onclick="event.stopPropagation();showDeleteModal(\'project\',\''+p.id+'\',\''+p.name+'\')"><i class="fa fa-trash"></i></button>';
    div.onclick = function(){
      if(longPressTarget===div) return;
      if(p.id!==projectId) location.href = 'CODEEDITOR.html?id=' + p.id;
      document.getElementById('sidebar').classList.remove('active');
      document.getElementById('main').classList.remove('shifted');
      playSound('click');
    };
    addLongPress(div, 'project', p.id, p.name);
    list.appendChild(div);
  });
}

async function loadProject(){
  if(!currentUser) return;
  const ref = doc(db,'users',currentUser.uid,'projects',projectId);
  const snap = await getDoc(ref);
  if(snap.exists()){
    const data = snap.data();
    files = data.files || getDefaultFiles();
    folders = data.folders || {};
    document.getElementById('projectName').textContent = data.name || 'Untitled';
  }else{
    files = getDefaultFiles();
    folders = {};
    await saveProject();
  }
  if(!files[currentFile]) currentFile = Object.keys(files)[0] || 'index.html';
  renderFileExplorer();
  renderEditorTabs();
  if(editorReady && editor) switchFile(currentFile);
  else if(editorReady &&!editor) createEditor();
}

function getDefaultFiles(){
  return {
    'index.html': {lang:'html', content:'<!DOCTYPE html><html><head><title>My Project</title><link rel="stylesheet" href="style.css"></head><body><h1>Hello Code Academy! 🚀</h1><button onclick="sayHello()">Click Me</button><script src="script.js"><\/script></body></html>'},
    'style.css': {lang:'css', content:'body{font-family:Arial;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;margin:0}button{padding:14px 32px;background:#3b82f6;color:white;border:none;border-radius:10px;cursor:pointer;margin-top:20px;font-size:16px}'},
    'script.js': {lang:'javascript', content:'function sayHello(){console.log("Button clicked! 🚀");alert("Hello from Code Academy!")}console.log("Script loaded ✅")'}
  };
}

function renderFileExplorer(){
  const ex = document.getElementById('fileExplorer');
  ex.innerHTML = '';
  Object.keys(folders).forEach(function(fn){
    const d = document.createElement('div');
    d.className = 'fileItem';
    d.innerHTML = '<i class="fa fa-folder"></i> ' + fn + '/<button class="deleteBtn" onclick="event.stopPropagation();showDeleteModal(\'folder\',\''+fn+'\')"><i class="fa fa-trash"></i></button>';
    addLongPress(d, 'folder', fn);
    ex.appendChild(d);
  });
  Object.keys(files).forEach(function(fn){
    const d = document.createElement('div');
    d.className = 'fileItem' + (fn===currentFile?' active':'');
    const icon = fn.endsWith('.html')?'fa-file-code':fn.endsWith('.css')?'fa-file-css':'fa-file-js';
    d.innerHTML = '<i class="fa '+icon+'"></i> ' + fn + '<button class="deleteBtn" onclick="event.stopPropagation();showDeleteModal(\'file\',\''+fn+'\')"><i class="fa fa-trash"></i></button>';
    d.onclick = function(){
      if(longPressTarget===d) return;
      switchFile(fn);
      playSound('click');
    };
    addLongPress(d, 'file', fn);
    ex.appendChild(d);
  });
}

function switchFile(fn){
  if(!files[fn]) return;
  currentFile = fn;
  const c = files[fn].content;
  if(useFallback && fallbackEditor) fallbackEditor.value = c;
  else if(editor && editorReady){
    const m = editor.getModel();
    monaco.editor.setModelLanguage(m, files[fn].lang);
    editor.setValue(c);
  }
  document.getElementById('langType').textContent = files[fn].lang.toUpperCase();
  renderFileExplorer();
  renderEditorTabs();
}

function renderEditorTabs(){
  const t = document.getElementById('editorTabs');
  t.innerHTML = '';
  Object.keys(files).forEach(function(fn){
    const tab = document.createElement('div');
    tab.className = 'editorTab' + (fn===currentFile?' active':'');
    tab.innerHTML = fn + '<button class="deleteBtn" onclick="event.stopPropagation();showDeleteModal(\'file\',\''+fn+'\')"><i class="fa fa-times"></i></button>';
    tab.onclick = function(e){
      if(longPressTarget===tab) return;
      if(!e.target.closest('.deleteBtn')){
        switchFile(fn);
        playSound('click');
      }
    };
    addLongPress(tab, 'file', fn);
    t.appendChild(tab);
  });
}

window.showDeleteModal = function(type, name, projectName){
  deleteTarget = {type:type, name:name};
  const tt = document.getElementById('deleteTitle');
  const msg = document.getElementById('deleteMsg');
  tt.textContent = 'Delete ' + (type==='project'?'Project':type==='folder'?'Folder':'File');
  msg.textContent = type==='project'?'Delete project "'+projectName+'" and all files?':type==='folder'?'Delete folder "'+name+'" and all files inside?':'Delete file "'+name+'"?';
  document.getElementById('deleteModal').classList.add('active');
  playSound('click');
};

document.getElementById('cancelDeleteBtn').onclick = function(){
  document.getElementById('deleteModal').classList.remove('active');
  deleteTarget = null;
  playSound('click');
};

document.getElementById('confirmDeleteBtn').onclick = async function(){
  if(!deleteTarget) return;
  if(deleteTarget.type==='project'){
    await deleteDoc(doc(db,'users',currentUser.uid,'projects',deleteTarget.name));
    document.getElementById('deleteModal').classList.remove('active');
    playSound('success');
    location.href = 'projects.html';
    return;
  }
  if(deleteTarget.type==='folder'){
    Object.keys(files).forEach(function(f){
      if(f.startsWith(deleteTarget.name+'/')) delete files[f];
    });
    delete folders[deleteTarget.name];
  }else{
    delete files[deleteTarget.name];
    if(currentFile===deleteTarget.name) currentFile = Object.keys(files)[0] || 'index.html';
  }
  await saveProject();
  document.getElementById('deleteModal').classList.remove('active');
  deleteTarget = null;
  renderFileExplorer();
  renderEditorTabs();
  if(editorReady) switchFile(currentFile);
  playSound('success');
};

document.getElementById('newProjectBtn').onclick = function(){
  document.getElementById('newProjectModal').classList.add('active');
  playSound('click');
};

document.getElementById('cancelProjectBtn').onclick = function(){
  document.getElementById('newProjectModal').classList.remove('active');
  playSound('click');
};

document.getElementById('createProjectBtn').onclick = async function(){
  const name = document.getElementById('projName').value.trim();
  if(!name){playSound('error');alert('Enter project name');return;}
  const id = 'proj_' + Date.now();
  await setDoc(doc(db,'users',currentUser.uid,'projects',id), {name:name, files:getDefaultFiles(), folders:{}, createdAt:serverTimestamp(), updatedAt:serverTimestamp()});
  document.getElementById('newProjectModal').classList.remove('active');
  document.getElementById('projName').value = '';
  playSound('success');
  location.href = 'CODEEDITOR.html?id=' + id;
};

document.getElementById('newFileBtn').onclick = function(){
  creatingType = 'file';
  document.getElementById('itemModalTitle').innerHTML = '<i class="fa fa-file-plus"></i> Create New File';
  document.getElementById('newItemName').placeholder = 'example.html';
  document.getElementById('newItemModal').classList.add('active');
  playSound('click');
};

document.getElementById('newFolderBtn').onclick = function(){
  creatingType = 'folder';
  document.getElementById('itemModalTitle').innerHTML = '<i class="fa fa-folder-plus"></i> Create New Folder';
  document.getElementById('newItemName').placeholder = 'components';
  document.getElementById('newItemModal').classList.add('active');
  playSound('click');
};

document.getElementById('cancelItemBtn').onclick = function(){
  document.getElementById('newItemModal').classList.remove('active');
  playSound('click');
};

document.getElementById('createItemBtn').onclick = async function(){
  const name = document.getElementById('newItemName').value.trim();
  if(!name){playSound('error');return;}
  if(creatingType==='folder'){
    folders[name] = true;
    files[name+'/index.html'] = {lang:'html', content:'<!-- '+name+' folder -->'};
  }else{
    const lang = name.endsWith('.html')?'html':name.endsWith('.css')?'css':'javascript';
    files[name] = {lang:lang, content:lang==='html'?'<!-- New file -->':'/* New file */'};
  }
  document.getElementById('newItemModal').classList.remove('active');
  document.getElementById('newItemName').value = '';
  await saveProject();
  const nf = Object.keys(files)[Object.keys(files).length-1];
  switchFile(nf);
  playSound('success');
};

document.getElementById('playBtn').onclick = function(){
  document.getElementById('rightPane').classList.add('active');
  updatePreview();
  playSound('click');
};

document.getElementById('closePreview').onclick = function(){
  document.getElementById('rightPane').classList.remove('active');
  document.getElementById('consolePanel').classList.remove('active');
  consoleVisible = false;
  playSound('click');
};

document.getElementById('toggleConsole').onclick = function(){
  consoleVisible =!consoleVisible;
  document.getElementById('consolePanel').classList.toggle('active');
  playSound('click');
};

function addConsoleLine(msg, type){
  const out = document.getElementById('consoleOutput');
  if(out.querySelector('.console-info') && out.children.length===1) out.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'consoleLine console-' + (type||'log');
  d.textContent = '> ' + msg;
  out.appendChild(d);
  out.scrollTop = out.scrollHeight;
}

function updatePreview(){
  const html = files['index.html']?.content || '';
  const css = files['style.css']?.content || '';
  const js = files['script.js']?.content || '';
  document.getElementById('consoleOutput').innerHTML = '<div class="consoleLine console-info">Running...</div>';
  const preview = '<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1.0"><style>'+css+'</style></head><body>'+html.replace(/<link[^>]*>/g,'').replace(/<script[^>]*src[^>]*><\/script>/g,'')+'<script>'+js+'(function(){const send=function(t,...a){parent.postMessage({type:t,data:a.map(function(x){return typeof x==="object"?JSON.stringify(x):String(x)}).join(" ")},"*")};console.log=function(...a){send("log",...a)};console.error=function(...a){send("error",...a)};console.warn=function(...a){send("warn",...a)}})();<\/script></body></html>';
  document.getElementById('previewFrame').srcdoc = preview;
}

window.addEventListener('message', function(e){
  if(e.data.type) addConsoleLine(e.data, e.data.type);
});

document.getElementById('clearConsole').onclick = function(){
  document.getElementById('consoleOutput').innerHTML = '<div class="consoleLine console-info">Console cleared</div>';
  playSound('click');
};

async function saveProject(){
  if(!currentUser) return;
  if(useFallback && files[currentFile] && fallbackEditor) files[currentFile].content = fallbackEditor.value;
  await setDoc(doc(db,'users',currentUser.uid,'projects',projectId), {name:document.getElementById('projectName').textContent, files:files, folders:folders, updatedAt:serverTimestamp()}, {merge:true});
  document.getElementById('saveStatus').textContent = '✓ Saved';
  playSound('success');
  setTimeout(function(){document.getElementById('saveStatus').textContent = ''}, 2000);
}

document.getElementById('saveBtn').onclick = saveProject;

document.addEventListener('keydown', function(e){
  if((e.ctrlKey || e.metaKey) && e.key==='s'){e.preventDefault();saveProject();}
  if((e.ctrlKey || e.metaKey) && e.key==='Enter'){e.preventDefault();document.getElementById('playBtn').click();}
});

}); // firestore close
}); // auth close
}); // app close
</script>
