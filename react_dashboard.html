<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>React Course Dashboard</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
}

/* =========================
NAVBAR
========================= */

.navbar{
display:flex;
align-items:center;
justify-content:space-between;
padding:15px 20px;
background:#0f172a;
border-bottom:1px solid #1e293b;
position:sticky;
top:0;
}

/* BACK BUTTON (MODERN REACT STYLE) */
.backBtn{
background:linear-gradient(135deg,#38bdf8,#a855f7);
border:none;
color:white;
padding:10px 14px;
border-radius:12px;
cursor:pointer;
font-weight:bold;
display:flex;
align-items:center;
gap:8px;
transition:0.3s;
box-shadow:0 0 12px rgba(168,85,247,0.3);
}

.backBtn:hover{
transform:translateX(-6px);
box-shadow:0 0 20px rgba(168,85,247,0.6);
}

.backIcon{
font-size:18px;
}

/* TITLE */
.title{
font-size:16px;
color:#a855f7;
font-weight:bold;
}

/* XP BOX */
.xpBox{
background:#1e293b;
padding:8px 12px;
border-radius:10px;
font-size:13px;
}

/* =========================
CONTAINER
========================= */

.container{
padding:20px;
max-width:1100px;
margin:auto;
}

h2{
color:#a855f7;
margin-top:20px;
}

/* =========================
GRID
========================= */

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
margin-top:20px;
}

/* =========================
CARD
========================= */

.card{
background:#111827;
padding:15px;
border-radius:15px;
border:1px solid #1f2937;
cursor:pointer;
transition:0.3s;
position:relative;
}

.card:hover{
transform:translateY(-5px);
border-color:#a855f7;
box-shadow:0 0 15px rgba(168,85,247,0.2);
}

.card h3{
margin:0;
color:#a855f7;
}

.card p{
font-size:13px;
color:#94a3b8;
margin-top:8px;
}

.badge{
position:absolute;
top:10px;
right:10px;
padding:5px 10px;
font-size:11px;
border-radius:20px;
background:#22c55e;
}

.locked .badge{
background:#ef4444;
}

.locked{
opacity:0.5;
cursor:not-allowed;
}

</style>
</head>

<body>

<!-- =========================
NAVBAR
========================= -->

<div class="navbar">

<button class="backBtn" onclick="goBack()">
<span class="backIcon">⬅</span> Back
</button>

<div class="title">React Course</div>

<div class="xpBox" id="xpBox">XP: 0</div>

</div>

<!-- =========================
CONTENT
========================= -->

<div class="container">

<h2>React Mastery Path (15 Lessons)</h2>

<div class="grid" id="lessonGrid"></div>

</div>

<script>

/* =========================
BACK ENGINE
========================= */

function goBack(){
window.history.back();
}

/* =========================
USER ENGINE
========================= */

let user = JSON.parse(localStorage.getItem("react_user")) || {
xp:0,
completed:[]
};

function saveUser(){
localStorage.setItem("react_user", JSON.stringify(user));
}

document.getElementById("xpBox").textContent = "XP: " + user.xp;

/* =========================
REACT LESSON ENGINE
========================= */

const lessons = [
{
id:"react_lesson_1",
title:"Introduction to React",
desc:"Understand what React is and why modern apps use it."
},
{
id:"react_lesson_2",
title:"JSX Basics",
desc:"Learn how HTML is written inside JavaScript."
},
{
id:"react_lesson_3",
title:"Components",
desc:"Build reusable UI blocks."
},
{
id:"react_lesson_4",
title:"Props",
desc:"Pass data between components."
},
{
id:"react_lesson_5",
title:"State",
desc:"Manage dynamic data inside apps."
},
{
id:"react_lesson_6",
title:"Events in React",
desc:"Handle user interactions."
},
{
id:"react_lesson_7",
title:"Conditional Rendering",
desc:"Show UI based on conditions."
},
{
id:"react_lesson_8",
title:"Lists & Keys",
desc:"Render multiple components efficiently."
},
{
id:"react_lesson_9",
title:"Forms in React",
desc:"Handle user input in components."
},
{
id:"react_lesson_10",
title:"useEffect Hook",
desc:"Manage side effects in apps."
},
{
id:"react_lesson_11",
title:"useState Hook",
desc:"Core state management hook."
},
{
id:"react_lesson_12",
title:"React Router",
desc:"Navigate between pages."
},
{
id:"react_lesson_13",
title:"API Calls",
desc:"Fetch data from servers."
},
{
id:"react_lesson_14",
title:"Mini React Project",
desc:"Build a small interactive app."
},
{
id:"react_lesson_15",
title:"Final React Project",
desc:"Build a full modern React application."
}
];

/* =========================
UNLOCK SYSTEM
========================= */

function isUnlocked(index){

if(index === 0) return true;

return user.completed.includes(lessons[index-1].id);
}

/* =========================
RENDER ENGINE
========================= */

const grid = document.getElementById("lessonGrid");

function render(){

grid.innerHTML = "";

lessons.forEach((lesson,index)=>{

const unlocked = isUnlocked(index);

const card = document.createElement("div");

card.className = "card " + (!unlocked ? "locked" : "");

card.innerHTML = `
<h3>${lesson.title}</h3>
<p>${lesson.desc}</p>
<div class="badge">${unlocked ? "OPEN" : "LOCKED"}</div>
`;

if(unlocked){
card.onclick = () => {
window.location.href = `react_lesson.html?lesson=${lesson.id}`;
};
}

grid.appendChild(card);

});

}

render();

</script>

</body>
</html>
