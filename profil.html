<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile - Code Academy</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',sans-serif;}

:root{
  --bg:#020617;
  --card:#0f172a;
  --card-hover:#1e293b;
  --primary:#38bdf8;
  --primary-glow:rgba(56,189,248,0.4);
  --text:#f1f5f9;
  --text-dim:#94a3b8;
  --border:rgba(56,189,248,0.15);
  --success:#22c55e;
  --danger:#ef4444;
}

body{
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding-bottom:120px;
  overflow-x:hidden;
}

/* PREMIUM LIGHTING EFFECT */
body::before{
  content:'';
  position:fixed;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:radial-gradient(circle at 30% 20%, rgba(56,189,248,0.15) 0%, transparent 50%),
             radial-gradient(circle at 80% 80%, rgba(14,165,233,0.1) 0%, transparent 50%);
  z-index:-2;
  animation:float 20s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translate(0,0) rotate(0deg);}
 50%{transform:translate(30px,30px) rotate(5deg);}
}

/* GRID OVERLAY */
body::after{
  content:'';
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size:70px 70px;
  z-index:-1;
  opacity:0.4;
}

/* NAVBAR */
.navbar{
  position:sticky;
  top:0;
  width:100%;
  height:75px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 20px;
  background:rgba(15,23,42,0.8);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  z-index:100;
}

.navBrand{
  display:flex;
  align-items:center;
  gap:12px;
}

.navBrand img{
  width:40px;
  height:40px;
  border-radius:12px;
}

.navBrand h2{
  font-size:18px;
  background:linear-gradient(135deg,var(--primary),#0ea5e9);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  font-weight:800;
}

.backBtn{
  width:44px;
  height:44px;
  border-radius:14px;
  background:rgba(30,41,59,0.6);
  border:1px solid var(--border);
  color:var(--primary);
  font-size:18px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all 0.3s;
}

.backBtn:hover{
  background:var(--primary);
  color:var(--bg);
  transform:translateX(-4px);
  box-shadow:0 8px 25px var(--primary-glow);
}

/* CONTAINER */
.container{
  max-width:680px;
  margin:40px auto;
  padding:0 20px;
}

/* GLASS CARD */
.glassCard{
  background:rgba(15,23,42,0.6);
  backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-radius:24px;
  padding:30px;
  margin-bottom:24px;
  box-shadow:0 20px 60px rgba(0,0,0,0.3);
  transition:all 0.4s;
}

.glassCard:hover{
  border-color:var(--primary);
  box-shadow:0 25px 70px rgba(56,189,248,0.15);
}

/* PROFILE HERO */
.profileHero{
  text-align:center;
  padding:40px 30px;
}

.photoWrapper{
  position:relative;
  display:inline-block;
  margin-bottom:20px;
}

.avatar{
  width:130px;
  height:130px;
  border-radius:50%;
  border:4px solid var(--primary);
  object-fit:cover;
  box-shadow:0 0 40px var(--primary-glow);
  transition:all 0.4s;
}

.avatar:hover{
  transform:scale(1.05);
  box-shadow:0 0 60px var(--primary-glow);
}

.editPhoto{
  position:absolute;
  bottom:8px;
  right:8px;
  width:40px;
  height:40px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--primary),#0ea5e9);
  border:3px solid var(--bg);
  color:var(--bg);
  cursor:pointer;
  font-size:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all 0.3s;
}

.editPhoto:hover{
  transform:scale(1.2) rotate(10deg);
}

.userName{
  font-size:28px;
  font-weight:800;
  margin-bottom:6px;
  background:linear-gradient(135deg,var(--text),var(--primary));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.userEmail{
  font-size:14px;
  color:var(--text-dim);
  margin-bottom:15px;
}

.badgeRow{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.badge{
  padding:7px 16px;
  border-radius:30px;
  font-size:12px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:6px;
}

.badge.verified{
  background:rgba(34,197,94,0.15);
  color:var(--success);
  border:1px solid rgba(34,197,94,0.3);
}

.badge.level{
  background:linear-gradient(135deg,#facc15,#f59e0b);
  color:#111827;
}

.userId{
  font-size:11px;
  color:var(--text-dim);
  font-family:'Courier New',monospace;
  padding:8px 14px;
  background:rgba(30,41,59,0.5);
  border-radius:10px;
  display:inline-block;
  border:1px solid var(--border);
}

/* XP BAR */
.xpWrapper{
  margin-top:25px;
}

.xpHeader{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
  font-size:13px;
  font-weight:700;
}

.xpBar{
  height:12px;
  background:rgba(30,41,59,0.8);
  border-radius:12px;
  overflow:hidden;
  border:1px solid var(--border);
}

.xpFill{
  height:100%;
  background:linear-gradient(90deg,var(--primary),#0ea5e9);
  border-radius:12px;
  box-shadow:0 0 20px var(--primary-glow);
  transition:width 1s cubic-bezier(0.4,0,0.2,1);
}

/* SECTION HEADER */
.sectionHeader{
  font-size:20px;
  font-weight:800;
  margin:35px 0 20px;
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--primary);
}

/* STATS GRID */
.statsGrid{
  display:flex;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  position: center;
  width: 300vw;
  height: 50%;
  
  
}

.statCard{
  background:rgba(15,23,42,0.6);
  backdrop-filter:blur(15px);
  border:1px solid var(--border);
  border-radius:20px;
  padding:25px 15px;
  text-align:center;
  transition:all 0.3s;
}

.statCard:hover{
  transform:translateY(-8px);
  border-color:var(--primary);
  box-shadow:0 15px 40px var(--primary-glow);
}

.statCard i{
  font-size:26px;
  color:var(--primary);
  margin-bottom:12px;
}

.statCard h3{
  font-size:28px;
  font-weight:800;
  margin-bottom:6px;
}

.statCard p{
  font-size:12px;
  color:var(--text-dim);
  font-weight:600;
}

/* COURSE CARD */
.courseCard{
  background:rgba(15,23,42,0.6);
  backdrop-filter:blur(15px);
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;
  margin-bottom:14px;
  transition:all 0.3s;
}

.courseCard:hover{
  border-color:var(--primary);
  transform:translateX(5px);
}

.courseTop{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:15px;
}

.courseIcon{
  width:50px;
  height:50px;
  padding:10px;
  background:rgba(56,189,248,0.1);
  border-radius:16px;
  border:1px solid var(--border);
}

.courseInfo h4{
  font-size:16px;
  font-weight:700;
  margin-bottom:4px;
}

.courseInfo p{
  font-size:12px;
  color:var(--text-dim);
}

.progressWrapper{
  margin-top:12px;
}

.progressBar{
  height:8px;
  background:rgba(2,6,23,0.8);
  border-radius:10px;
  overflow:hidden;
  margin-bottom:8px;
}

.progressFill{
  height:100%;
  background:linear-gradient(90deg,var(--primary),#0ea5e9);
  border-radius:10px;
  transition:width 0.8s;
}

.progressText{
  font-size:11px;
  color:var(--text-dim);
  text-align:right;
  font-weight:700;
}

/* INPUT FORM */
.formGroup{
  margin-bottom:20px;
}

.formLabel{
  font-size:13px;
  color:var(--text-dim);
  margin-bottom:8px;
  display:block;
  font-weight:700;
}

.inputWrapper{
  position:relative;
}

.inputWrapper i{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  color:var(--primary);
  font-size:15px;
}

.inputWrapper input{
  width:100%;
  padding:15px 16px 15px 48px;
  background:rgba(30,41,59,0.6);
  border:1px solid var(--border);
  border-radius:14px;
  color:var(--text);
  font-size:15px;
  outline:none;
  transition:all 0.3s;
}

.inputWrapper input:focus{
  border-color:var(--primary);
  background:rgba(15,23,42,0.8);
  box-shadow:0 0 20px var(--primary-glow);
}

/* BUTTONS */
.btn{
  width:100%;
  padding:16px;
  border:none;
  border-radius:14px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  transition:all 0.3s;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.btn-primary{
  background:linear-gradient(135deg,var(--primary),#0ea5e9);
  color:var(--bg);
}

.btn-primary:hover{
  transform:translateY(-3px);
  box-shadow:0 15px 40px var(--primary-glow);
}

.btn-danger{
  background:linear-gradient(135deg,var(--danger),#dc2626);
  color:white;
  margin-top:25px;
}

.btn-danger:hover{
  transform:translateY(-3px);
  box-shadow:0 15px 40px rgba(239,68,68,0.4);
}

.actionBtn{
  background:rgba(15,23,42,0.6);
  backdrop-filter:blur(15px);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
  text-align:center;
  cursor:pointer;
  text-decoration:none;
  color:var(--text);
  display:block;
  transition:all 0.3s;
  margin-bottom:15px;
}

.actionBtn:hover{
  border-color:var(--primary);
  transform:translateY(-5px);
  box-shadow:0 20px 50px var(--primary-glow);
}

.actionBtn i{
  font-size:28px;
  color:var(--primary);
  margin-bottom:10px;
}

/* LOADING */
.loading{
  text-align:center;
  padding:100px 20px;
  color:var(--primary);
  font-size:16px;
}

#photoInput{display:none;}

@media(max-width:640px){
  .statsGrid{grid-template-columns:1fr;}
  .avatar{width:110px;height:110px;}
}
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <button class="backBtn" onclick="history.back()">
    <i class="fa fa-arrow-left"></i>
  </button>
  <div class="navBrand">
    <img src="logo.png" alt="Code Academy">
    <h2>Code Academy</h2>
  </div>
</nav>

<!-- CONTAINER -->
<div class="container">

  <!-- LOADING -->
  <div id="loading" class="loading">
    <i class="fa fa-spinner fa-spin"></i> Loading your profile...
  </div>

  <!-- PROFILE CONTENT -->
  <div id="profileContent" style="display:none;">

    <!-- PROFILE HERO -->
    <div class="glassCard profileHero">
      <div class="photoWrapper">
        <img id="userPhoto" src="" class="avatar" alt="Profile">
        <button class="editPhoto" onclick="document.getElementById('photoInput').click()">
          <i class="fa fa-camera"></i>
        </button>
        <input type="file" id="photoInput" accept="image/*">
      </div>

      <h1 id="userName" class="userName">Loading...</h1>
      <p id="userEmail" class="userEmail">loading...</p>

      <div class="badgeRow">
        <div id="verifyBadge" class="badge verified">
          <i class="fa fa-check-circle"></i> Verified
        </div>
        <div id="levelBadge" class="badge level">
          <i class="fa fa-crown"></i> Level 1
        </div>
      </div>

      <div class="userId">User ID: <span id="userId">---</span></div>

      <!-- XP BAR -->
      <div class="xpWrapper">
        <div class="xpHeader">
          <span>Experience Points</span>
          <span><b id="currentXP">0</b> / <b id="nextXP">100</b> XP</span>
        </div>
        <div class="xpBar">
          <div id="xpFill" class="xpFill" style="width:0%"></div>
        </div>
      </div>
    </div>

    <!-- STATS -->
    <h2 class="sectionHeader"><i class="fa fa-chart-bar"></i> Your Progress</h2>
    <div class="statsGrid">
      <div class="statCard">
        <i class="fa fa-certificate"></i>
        <h3 id="certCount">0</h3>
        <p>Certificates</p>
      </div>
      <div class="statCard">
        <i class="fa fa-fire"></i>
        <h3 id="streak">0</h3>
        <p>Day Streak</p>
      </div>
      <div class="statCard">
        <i class="fa fa-trophy"></i>
        <h3 id="coursesDone">0</h3>
        <p>Courses Done</p>
      </div>
    </div>

    <!-- COURSES -->
    <h2 class="sectionHeader"><i class="fa fa-graduation-cap"></i> Course Progress</h2>
    <div id="coursesList"></div>

    <!-- CERTIFICATES ACTION -->
    <a href="certificate.html" class="actionBtn">
      <i class="fa fa-award"></i>
      <div>View All Certificates</div>
    </a>

    <!-- ACCOUNT SETTINGS -->
    <h2 class="sectionHeader"><i class="fa fa-user-cog"></i> Account Settings</h2>
    <div class="glassCard">
      <div class="formGroup">
        <label class="formLabel">Full Name</label>
        <div class="inputWrapper">
          <i class="fa fa-user"></i>
          <input type="text" id="fullName" placeholder="Your name">
        </div>
      </div>

      <div class="formGroup">
        <label class="formLabel">Email Address</label>
        <div class="inputWrapper">
          <i class="fa fa-envelope"></i>
          <input type="email" id="email" placeholder="your@email.com">
        </div>
      </div>

      <button class="btn btn-primary" onclick="updateProfile()">
        <i class="fa fa-save"></i> Save Changes
      </button>
    </div>

    <!-- SECURITY -->
    <h2 class="sectionHeader"><i class="fa fa-shield-alt"></i> Security</h2>
    <div class="glassCard">
      <div class="formGroup">
        <label class="formLabel">Current Password</label>
        <div class="inputWrapper">
          <i class="fa fa-key"></i>
          <input type="password" id="currentPass" placeholder="Enter current password">
        </div>
      </div>

      <div class="formGroup">
        <label class="formLabel">New Password</label>
        <div class="inputWrapper">
          <i class="fa fa-lock"></i>
          <input type="password" id="newPass" placeholder="Minimum 6 characters">
        </div>
      </div>

      <div class="formGroup">
        <label class="formLabel">Confirm Password</label>
        <div class="inputWrapper">
          <i class="fa fa-lock"></i>
          <input type="password" id="confirmPass" placeholder="Re-enter password">
        </div>
      </div>

      <button class="btn btn-primary" onclick="changePassword()">
        <i class="fa fa-shield-alt"></i> Update Password
      </button>
    </div>

    <!-- LOGOUT -->
    <button class="btn btn-danger" onclick="logout()">
      <i class="fa fa-sign-out-alt"></i> Logout Account
    </button>

  </div>
</div>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, updateProfile, updateEmail, updatePassword, reauthenticateWithCredential, EmailAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

// ============= FIREBASE CONFIG =============
// PASTE YOUR FIREBASE CONFIG HERE
const firebaseConfig = {
    apiKey: "AIzaSyDDHzPkR4jIMz6fcK7M_hdjQk2u6xk-efI",
  authDomain: "code-acada.firebaseapp.com",
  databaseURL: "https://code-acada-default-rtdb.firebaseio.com",
  projectId: "code-acada",
  storageBucket: "code-acada.appspot.com", // FIXED: was.firebasestorage.app
  messagingSenderId: "155763239454",
  appId: "1:155763239454:web:7fc20b0037dcd8e5621c0f",
  measurementId: "G-ZCV1ELNR0K"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

const loading = document.getElementById('loading');
const profileContent = document.getElementById('profileContent');

// Level system
function getLevel(xp){
  const level = Math.floor(xp / 100) + 1;
  const titles = ['Beginner','Learner','Coder','Developer','Expert','Master','Legend'];
  return {level, title: titles[Math.min(level-1, titles.length-1)]};
}

// Load user data from Firestore
onAuthStateChanged(auth, async (user) => {
  if(user){
    try{
      const userRef = doc(db, "users", user.uid);
      const snap = await getDoc(userRef);
      
      if(snap.exists()){
        const data = snap.data();
        
        // ========== PROFILE INFO ==========
        document.getElementById('userPhoto').src = user.photoURL || 'https://i.pravatar.cc/150?u=' + user.uid;
        document.getElementById('userName').textContent = data.displayName || user.displayName || 'User';
        document.getElementById('userEmail').textContent = user.email;
        document.getElementById('fullName').value = data.displayName || user.displayName || '';
        document.getElementById('email').value = user.email;
        document.getElementById('userId').textContent = user.uid;
        
        // ========== EMAIL VERIFICATION ==========
        const verifyBadge = document.getElementById('verifyBadge');
        if(user.emailVerified){
          verifyBadge.className = 'badge verified';
          verifyBadge.innerHTML = '<i class="fa fa-check-circle"></i> Email Verified';
        } else {
          verifyBadge.style.background = 'rgba(239,68,68,0.15)';
          verifyBadge.style.color = 'var(--danger)';
          verifyBadge.style.borderColor = 'rgba(239,68,68,0.3)';
          verifyBadge.innerHTML = '<i class="fa fa-times-circle"></i> Not Verified';
        }
        
        // ========== XP & LEVEL ==========
        const xp = data.xp || 0;
        const coins = data.coins || 0;
        const {level, title} = getLevel(xp);
        const currentXP = xp % 100;
        
        document.getElementById('levelBadge').innerHTML = `<i class="fa fa-crown"></i> Level ${level} ${title}`;
        document.getElementById('currentXP').textContent = currentXP;
        document.getElementById('nextXP').textContent = 100;
        document.getElementById('xpFill').style.width = currentXP + '%';
        
        // ========== STATS ==========
        const certs = data.certificates || {};
        const earnedCount = Object.values(certs).filter(v => v === true).length;
        document.getElementById('certCount').textContent = earnedCount;
        document.getElementById('streak').textContent = data.streak || 0;
        document.getElementById('coursesDone').textContent = earnedCount;
        
        // ========== COURSES PROGRESS ==========
        const courses = [
          {id:'html', name:'HTML', icon:'https://cdn-icons-png.flaticon.com/512/732/732212.png', lessons:15},
          {id:'css', name:'CSS', icon:'https://cdn-icons-png.flaticon.com/512/732/732190.png', lessons:15},
          {id:'javascript', name:'JavaScript', icon:'https://cdn-icons-png.flaticon.com/512/5968/5968292.png', lessons:15},
          {id:'python', name:'Python', icon:'https://cdn-icons-png.flaticon.com/512/5968/5968350.png', lessons:15},
          {id:'react', name:'React', icon:'https://cdn-icons-png.flaticon.com/512/1126/1126012.png', lessons:15}
        ];
        
        const coursesList = document.getElementById('coursesList');
        coursesList.innerHTML = '';
        
        courses.forEach(course => {
          const courseProgress = data.progress?.[course.id] || {};
          const completedLesson = courseProgress.completed || 0;
          const percent = Math.min(Math.floor((completedLesson / course.lessons) * 100), 100);
          
          const card = document.createElement('div');
          card.className = 'courseCard';
          card.innerHTML = `
            <div class="courseTop">
              <img src="${course.icon}" class="courseIcon">
              <div class="courseInfo">
                <h4>${course.name}</h4>
                <p>${certs[course.id] ? '✅ Certificate Earned' : '📚 In Progress'}</p>
              </div>
            </div>
            <div class="progressWrapper">
              <div class="progressBar">
                <div class="progressFill" style="width:${percent}%"></div>
              </div>
              <div class="progressText">${completedLesson} / ${course.lessons} lessons • ${percent}%</div>
            </div>
          `;
          coursesList.appendChild(card);
        });
        
        loading.style.display = 'none';
        profileContent.style.display = 'block';
        
      } else {
        alert('User profile not found. Please complete signup.');
        window.location.href = 'signup.html';
      }
    } catch(error){
      console.error('Profile load error:', error);
      alert('Error loading profile: ' + error.message);
    }
  } else {
    window.location.href = 'login.html';
  }
});

// ========== UPLOAD PHOTO ==========
document.getElementById('photoInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  
  const user = auth.currentUser;
  if(!user) return;
  
  try{
    const storageRef = ref(storage, `profilePhotos/${user.uid}`);
    await uploadBytes(storageRef, file);
    const photoURL = await getDownloadURL(storageRef);
    
    await updateProfile(user, { photoURL });
    await updateDoc(doc(db, "users", user.uid), { photoURL });
    document.getElementById('userPhoto').src = photoURL;
    alert('Profile photo updated!');
  } catch(error){
    alert('Error uploading photo: ' + error.message);
  }
});

// ========== UPDATE PROFILE ==========
window.updateProfile = async () => {
  const user = auth.currentUser;
  const newName = document.getElementById('fullName').value.trim();
  const newEmail = document.getElementById('email').value.trim();
  
  try{
    // Update name
    if(newName && newName !== user.displayName){
      await updateProfile(user, { displayName: newName });
      await updateDoc(doc(db, "users", user.uid), { displayName: newName });
      document.getElementById('userName').textContent = newName;
    }
    
    // Update email
    if(newEmail && newEmail !== user.email){
      await updateEmail(user, newEmail);
      await updateDoc(doc(db, "users", user.uid), { email: newEmail });
      alert('Email updated! Please verify your new email.');
      window.location.reload();
      return;
    }
    
    alert('Profile updated successfully!');
  } catch(error){
    alert('Error: ' + error.message);
  }
};

// ========== CHANGE PASSWORD ==========
window.changePassword = async () => {
  const user = auth.currentUser;
  const current = document.getElementById('currentPass').value;
  const newPass = document.getElementById('newPass').value;
  const confirm = document.getElementById('confirmPass').value;
  
  if(newPass !== confirm){
    alert('Passwords do not match!');
    return;
  }
  if(newPass.length < 6){
    alert('Password must be at least 6 characters');
    return;
  }
  
  try{
    const credential = EmailAuthProvider.credential(user.email, current);
    await reauthenticateWithCredential(user, credential);
    await updatePassword(user, newPass);
    alert('Password changed! Please login again.');
    await signOut(auth);
    window.location.href = 'login.html';
  } catch(error){
    alert('Error: ' + error.message);
  }
};

// ========== LOGOUT ==========
window.logout = async () => {
  if(confirm('Logout from Code Academy?')){
    await signOut(auth);
    window.location.href = 'login.html';
  }
};
