<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS IDE PRO (AI ENGINE)</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>



*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#050510;
    --panel:#0b1020;
    --cyan:#00f5ff;
    --pink:#ff00ff;
    --green:#00ff88;
    --red:#ff4444;
    --text:#d8ffff;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    font-family:'JetBrains Mono',monospace;
    color:white;
}


/* BACKGROUND */

#grid{
    position:absolute;
    inset:0;
    z-index:-1;

    background:
    linear-gradient(
    rgba(0,245,255,.05) 1px,
    transparent 1px
    ),
    linear-gradient(
    90deg,
    rgba(0,245,255,.05) 1px,
    transparent 1px
    );

    background-size:45px 45px;
}


/* ================= NAVBAR ================= */

.navbar{

    height:64px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 5px;

    background:
    rgba(5,5,16,.85);

    backdrop-filter:blur(15px);

    border-bottom:1px solid rgba(0,245,255,.4);

}


.brand{

    font-family:Orbitron;
    font-size:18px;
    letter-spacing:3px;

    color:var(--cyan);

    text-shadow:
    0 0 15px var(--cyan);

}



.actions{

    display:flex;
    gap:12px;
    padding: 5px;

}



button{

    border:none;
    outline:none;

    cursor:pointer;

    padding:10px 18px;

    border-radius:12px;

    font-family:Orbitron;

    transition:.25s;

}



button:hover{

    transform:translateY(-2px);

    box-shadow:
    0 0 20px var(--cyan);

}



/* NAV BUTTONS */


#runBtn{

background:
linear-gradient(
135deg,
var(--green),
var(--cyan)
);

color:#000;
padding: 5px;

}



#saveBtn{

background:
linear-gradient(
135deg,
var(--cyan),
var(--pink)
);

color:#000;
padding: 5px;
}



#menuBtn{

background:#11182c;

color:var(--cyan);

border:1px solid var(--cyan);
padding: 5px;

}



#backBtn{

background:transparent;

color:white;

border:1px solid #555;
padding: 5px;
}



/* ================= MAIN IDE ================= */


#workspace{

height:calc(100vh - 64px);

display:flex;

overflow:hidden;

background:#030308;

}



/* LINE NUMBER AREA */

#lineNumbers{

width:20px;

background:#070711;

color:#555;

padding-top:18px;

text-align:right;

padding-right:18px;

font-size:14px;

line-height:1.7;

user-select:none;

border-right:1px solid #222;

overflow:hidden;

}



/* EDITOR */


#editor{

flex:1;

height:100%;

resize:none;

border:none;

outline:none;

background:

linear-gradient(
90deg,
#050510,
#000010
);

color:#00ff88;


padding:18px 25px;


font-size:15px;

line-height:1.7;


font-family:'JetBrains Mono';

caret-color:var(--cyan);


overflow:auto;

}



/* FOCUS MODE */

#editor:focus{

box-shadow:
inset 0 0 40px rgba(0,245,255,.08);

}




/* ================= FLOATING FILE PANEL ================= */


#filePanel{


position:fixed;

top:75px;
left:25px;


width:260px;


background:#09091b;


border:1px solid var(--cyan);


border-radius:18px;


padding:18px;


display:none;


z-index:500;


box-shadow:
0 0 40px rgba(0,245,255,.25);

}



.tab{

padding:12px;

margin-top:8px;

background:#111;

border-radius:10px;

color:var(--cyan);

}



/* ================= AI WINDOW ================= */


#aiBox{


position:fixed;


right:25px;

bottom:25px;


width:300px;


background:#080816;


border:1px solid var(--pink);


border-radius:20px;


padding:20px;


display:none;


z-index:1000;


box-shadow:
0 0 35px rgba(255,0,255,.3);

}



#aiBox h3{

font-family:Orbitron;
color:var(--pink);

}



#fixBtn,
#refactorBtn,
#generateBtn{

width:100%;
margin-top:10px;

}



/* ================= ERROR SYSTEM ================= */


#errorPanel{


position:fixed;


left:50%;

top:50%;


transform:translate(-50%,-50%);


width:300px;


max-height:400px;


background:#090910;


border:2px solid var(--red);


border-radius:20px;


display:none;


z-index:5000;


box-shadow:
0 0 50px rgba(255,0,0,.4);

}



.error-header{


height:50px;


display:flex;

align-items:center;

justify-content:space-between;


padding:0 20px;


color:var(--red);


font-family:Orbitron;


}



/* ================= CONSOLE ================= */


#consolePanel{


position:fixed;


bottom:20px;

left:50%;


transform:translateX(-50%);


width:70%;


height:220px;


background:#050505;


border:1px solid var(--green);


border-radius:20px;


display:none;


z-index:2000;


}



/* ================= FULL PREVIEW ================= */


#previewPanel{


position:fixed;


inset:0;


background:white;


display:none;


flex-direction:column;


z-index:9999;

}



.preview-header{

height:55px;

background:#050510;

color:var(--cyan);

display:flex;

align-items:center;

justify-content:space-between;

padding:0 25px;

}



#previewFrame{

flex:1;

border:none;

background:white;

}




/* ================= AUTOCOMPLETE ================= */


#suggestions{

position:absolute;

background:#09091b;

border:1px solid var(--cyan);

border-radius:12px;

display:none;

overflow:hidden;

z-index:9000;

}



.suggestion-item{

padding:10px 15px;

color:var(--green);

}



.suggestion-item:hover{

background:var(--cyan);

color:#000;

}



/* REMOVE ALL SCROLLBARS */

::-webkit-scrollbar{

width:0;
height:0;

}

</style>
</head>

<body>

<!-- BACKGROUND GRID -->
<div id="grid"></div>

<!-- ================= TOP NAVBAR ================= -->
<nav class="navbar">
<!--  <button id="backBtn">BACK</button> -->
<button id="backBtn" onclick="history.back()">Back</button

  <div class="brand">JS IDE </div>

  <div class="actions">
    <button id="runBtn">▶RUN</button>
    <button id="saveBtn">💾 SAVE</button>
   
  </div>
</nav>


<!-- ================= MAIN EDITOR AREA ================= -->
<main id="workspace">

  <!-- LINE NUMBERS -->
  <div id="lineNumbers"></div>

  <!-- CODE EDITOR -->
  <textarea id="editor" spellcheck="false">// Start coding here...</textarea>

  <!-- INTELLISENSE DROPDOWN -->
  <div id="suggestions"></div>

</main>

<!-- ================= RIGHT SIDE: AI + DEBUG ================= -->
<aside id="rightPanel">

  <!-- AI ENGINE BOX -->
  <div id="aiBox">
    <h3>AI ENGINE</h3>
    <p id="aiMessage">AI watching your code...</p>

    <button id="fixBtn">⚡ AI FIX</button>
    <button id="refactorBtn">♻ REFACTOR</button>
    <button id="generateBtn">🧠 GENERATE</button>
  </div>

  <!-- DEBUG PANEL -->
  <div id="debugPanel">
    <h3>DEBUG INFO</h3>
    <div id="debugContent"></div>
  </div>

</aside>

<!-- ================= ERROR PANEL ================= -->
<div id="errorPanel">
  <div class="error-header">
    <span>⚠ SYNTAX / RUNTIME ERROR</span>
    <button id="closeError">✕</button>
  </div>

  <div id="errorContent"></div>
</div>

<!-- ================= CONSOLE PANEL ================= -->
<div id="consolePanel">
  <div class="console-header">
    <span>🖥 CONSOLE</span>
    <button id="clearConsole">CLEAR</button>
  </div>

  <div id="consoleOutput"></div>
</div>

<!-- ================= LIVE PREVIEW PANEL ================= -->
<div id="previewPanel">
  <div class="preview-header">
  
  <!-- <button id="backBtn" onclick="history.back()">Back</button -->
    <span>🌐 LIVE PREVIEW</span>
    <button id="refreshPreview">REFRESH</button>
  </div>

  <iframe id="previewFrame"></iframe>
</div>

<!-- ================= STATUS BAR ================= -->
<footer id="statusBar">
  <span id="statusText">Ready</span>
  <span id="statusRight">JS IDE PRO • AI ACTIVE</span>
</footer>

<!-- ================= LIBRARIES ================= -->
<script src="https://unpkg.com/esprima@4.0.1/dist/esprima.js"></script>

<!-- MAIN ENGINE (JS WILL COME NEXT FILE) -->
<script>
/* JS ENGINE WILL BE BUILT NEXT *//* =====================================
   JS IDE PRO ENGINE
===================================== */


/* ---------- STATE ---------- */

const IDE = {

    files:{
        "script.js":"",
        "utils.js":"",
        "index.html":""
    },

    activeFile:"script.js",

    history:[],
    redo:[],

    editor:null,
    lines:null,

};



/* ---------- DOM ---------- */


document.addEventListener("DOMContentLoaded",()=>{


IDE.editor=document.getElementById("editor");
IDE.lines=document.getElementById("lineNumbers");



loadCode();

updateLines();



// typing engine

IDE.editor.addEventListener("input",()=>{


saveState();

updateLines();

syntaxCheck();


});



// keyboard shortcuts

IDE.editor.addEventListener("keydown",(e)=>{


if(e.ctrlKey && e.key==="z"){

undo();

}


if(e.ctrlKey && e.key==="y"){

redo();

}


});



setupButtons();


syntaxCheck();


});




/* =====================================
   EDITOR SYSTEM
===================================== */


function loadCode(){


let saved=
localStorage.getItem("JS_IDE_PROJECT");


if(saved){

IDE.files=JSON.parse(saved);

}



IDE.editor.value=
IDE.files[IDE.activeFile] ||
`// JS IDE PRO

function hello(){

console.log("Welcome");

}

hello();`;



}



function saveCode(){


IDE.files[IDE.activeFile]=
IDE.editor.value;


localStorage.setItem(
"JS_IDE_PROJECT",
JSON.stringify(IDE.files)
);


}



function saveState(){


saveCode();


IDE.history.push(
IDE.editor.value
);


if(IDE.history.length>50)
IDE.history.shift();


}





/* =====================================
   LINE NUMBERS
===================================== */


function updateLines(){


let count=
IDE.editor.value.split("\n").length;


let output="";


for(let i=1;i<=count;i++){

output+=i+"<br>";

}


IDE.lines.innerHTML=output;


}



/* =====================================
   UNDO REDO
===================================== */


function undo(){


if(!IDE.history.length)
return;


IDE.redo.push(
IDE.editor.value
);


IDE.editor.value=
IDE.history.pop();


updateLines();


}



function redo(){


if(!IDE.redo.length)
return;


IDE.history.push(
IDE.editor.value
);


IDE.editor.value=
IDE.redo.pop();


updateLines();


}





/* =====================================
   SYNTAX ENGINE
===================================== */


function syntaxCheck(){


let errorBox=
document.getElementById("errorPanel");


try{


if(window.esprima){

esprima.parseScript(
IDE.editor.value,
{
loc:true
}
);

}



document.getElementById("statusText")
.innerHTML=
"✓ Code is clean";



errorBox.style.display="none";



}

catch(err){


showError(err);


}



}





function showError(error){


let panel=
document.getElementById("errorPanel");


let text=
document.getElementById("errorContent");



text.innerHTML=`

<div style="
padding:20px;
color:#ff7777">

<h3>
Syntax Error
</h3>

<br>

Line:
${error.lineNumber || "unknown"}

<br><br>

${error.description || error.message}


</div>

`;



panel.style.display="block";



}






/* =====================================
   AUTOCOMPLETE
===================================== */


const words=[


"console.log",

"document",

"querySelector",

"getElementById",

"function",

"const",

"let",

"var",

"return",

"if",

"else",

"for",

"while",

"class",

"async",

"await",
"if() {       }else {             }",

"px",
"em",
"$",
"|| ",
"``",
"//",
"/*  */",
"<",
">",
"&& ",
"!",
"=",
"()"



];




IDE.editor?.addEventListener(
"keyup",
()=>{


showSuggestions();


});





function showSuggestions(){


let box=
document.getElementById(
"suggestions"
);



let value=
IDE.editor.value;


let current=
value
.split(/\s+/)
.pop();



if(current.length<2){

box.style.display="none";
return;

}



let result=
words.filter(x=>
x.startsWith(current)
);



if(!result.length){

box.style.display="none";
return;

}




box.innerHTML=
result.map(x=>`

<div class="suggestion-item"
onclick="insertWord('${x}')">

${x}

</div>

`).join("");




box.style.left="120px";
box.style.top="100px";

box.style.display="block";



}




function insertWord(word){


let pos=
IDE.editor.selectionStart;


let before=
IDE.editor.value.substring(0,pos);



let after=
IDE.editor.value.substring(pos);



let last=
before.split(/\s+/).pop();



IDE.editor.value=
before.slice(
0,
before.length-last.length
)
+
word
+
after;



IDE.editor.focus();


updateLines();

saveCode();



document
.getElementById("suggestions")
.style.display="none";

}




/* =====================================
   RUN ENGINE
===================================== */


function runCode(){


let preview=
document.getElementById(
"previewPanel"
);


let frame=
document.getElementById(
"previewFrame"
);



let code=
IDE.editor.value;



frame.srcdoc=`

<html>

<body>

<h2>Preview</h2>

<script>

try{

${code}

}

catch(e){

document.body.innerHTML=e;

}

<\/script>


</body>

</html>

`;



preview.style.display="flex";



}







/* =====================================
   BUTTONS
===================================== */


function setupButtons(){



document
.getElementById("runBtn")
.onclick=()=>{

syntaxCheck();

runCode();

};



document
.getElementById("saveBtn")
.onclick=()=>{

saveCode();

alert("Project saved");

};




document
.getElementById("closeError")
.onclick=()=>{

document
.getElementById("errorPanel")
.style.display="none";

};




document
.getElementById("clearConsole")
?.addEventListener(
"click",
()=>{

document
.getElementById("consoleOutput")
.innerHTML="";

});





document
.getElementById("refreshPreview")
?.addEventListener(
"click",
runCode
);



document
.getElementById("menuBtn")
.onclick=()=>{


let panel=
document.getElementById(
"filePanel"
);


panel.style.display =
panel.style.display==="block"
?
"none"
:
"block";

};





document
.getElementById("backBtn")
.onclick=()=>{

location.reload();

};





/* AI BUTTONS */

document
.getElementById("fixBtn")
?.addEventListener(
"click",
()=>{

document
.getElementById("aiMessage")
.innerHTML=
"AI analysis ready";

});



document
.getElementById("refactorBtn")
?.addEventListener(
"click",
()=>{

document
.getElementById("aiMessage")
.innerHTML=
"Refactor engine ready";

});



document
.getElementById("generateBtn")
?.addEventListener(
"click",
()=>{

IDE.editor.value+=
"\n\n// Generated code";


updateLines();

});



}
</script>

</body>
</html>
